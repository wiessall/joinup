'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: Card Overlay
status: stable
description: 'A card component with image and overlay content'
props:
  type: object
  properties:
    image:
      type: object
      title: Image
      properties:
        src:
          type: string
          title: Image source
          default: '/images/placeholders/card-1.jpg'
        alt:
          type: string
          title: Image alt text
          default: 'Card title'
    category:
      type: string
      title: Category
      default: 'Category'
    title:
      type: string
      title: Card title
      default: 'Card title'
    title_url:
      type: string
      title: Title URL
      default: '#'
    date:
      type: string
      title: Date
      description: 'Date string to display'
      default: ''
slots:
  card_extra:
    title: Card Extra Content
    description: 'Optional slot for additional content in the overlay'

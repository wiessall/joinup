name: 'FAO Design System Lean'
type: theme
description: 'Lean Drupal theme for the FAO Design System (Bootstrap 5.3 + FAO DS CSS).'
package: FAO
core_version_requirement: ^10.3 || ^11
base theme: false

# Same region machine names as the previous fao theme, so existing block
# placements (block.block.fao_*) keep their region.
regions:
  header: 'Header'
  breadcrumb: 'Breadcrumb'
  primary_nav: 'Primary navigation'
  messages: 'Messages'
  full_width: 'Full width content'
  content: 'Content'
  sidebar: 'Sidebar'
  footer: 'Footer'

libraries:
  - fao/global

# Joinup's LocalTaskLinksHelper reads this key to decide between horizontal
# tabs and the "three dots" menu. Point it at the machine name of the "Tabs"
# block you place in this theme, then uncomment:
# joinup:
#   menu_local_tasks:
#     horizontal_tabs_block: fao_tabs

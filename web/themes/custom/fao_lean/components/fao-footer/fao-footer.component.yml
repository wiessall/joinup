$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: FAO corporate footer
status: stable
description: 'FAO corporate footer: logo, social links, corporate link groups, copyright. Data comes from data/fao-chrome.json via fao_lean_preprocess_page().'
props:
  type: object
  properties:
    logo:
      type: object
    top_menu_left:
      type: object
    top_menu_right:
      type: object
    bottom_menu:
      type: object
    social_icons:
      type: object
    app:
      type: object
slots:
  site_links:
    title: Site links
    description: 'The blocks placed in the Footer region (site-specific links), rendered above the corporate part.'

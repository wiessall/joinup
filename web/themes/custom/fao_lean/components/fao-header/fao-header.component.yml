$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: FAO corporate header
status: stable
description: 'FAO corporate strip: FAO logo and "Discover" menu, FAO Design System markup. Data from data/fao-chrome.json via fao_lean_preprocess_page().'
props:
  type: object
  properties:
    logo:
      type: object
      properties:
        url: { type: string }
        image: { type: string }
        alt: { type: string }
        title: { type: string }
    menu:
      type: object
      properties:
        button: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string }
slots:
  tools:
    title: Tools
    description: 'Right-hand extras, e.g. a language switcher block.'

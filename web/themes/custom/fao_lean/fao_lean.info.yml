name: 'FAO Design System (lean)'
type: theme
description: 'Lean rebuild of the fao theme: Bootstrap 5.3 + FAO Design System CSS, SDC components. Machine name fao_lean, so it can be installed next to fao for comparison.'
package: FAO
core_version_requirement: ^10.3 || ^11
base theme: false

# Same region machine names as the previous fao theme, so existing block
# placements (block.block.fao_*) keep their region.
regions:
  header: 'Header'
  breadcrumb: 'Breadcrumb'
  primary_nav: 'Primary navigation'
  messages: 'Messages'
  full_width: 'Full width content'
  content: 'Content'
  sidebar: 'Sidebar'
  footer: 'Footer'

libraries:
  - fao_lean/global

# Joinup's LocalTaskLinksHelper reads this key: on pages where this block is
# visible, local tasks render as horizontal tabs; everywhere else as the
# three-dots dropdown (templates/navigation/menu-local-tasks--three-dots-menu).
# The block must exist: the helper loads it without a NULL check, so a missing
# block is a fatal error on every front-end page.
joinup:
  menu_local_tasks:
    horizontal_tabs_block: fao_lean_horizontal_tabs

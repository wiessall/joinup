# SMACSS (http://smacss.com/)
components:
  version: VERSION
  css:
    component:
      assets/css/components.min.css: { minified: true }
  dependencies:
    - iop/components.js

components.js:
  header: true
  js:
    assets/js/oe-bcl-joinup.bundle.min.js: { minified: true, attributes: { defer: true } }
  dependencies:
    - core/drupal

theme:
  version: VERSION
  css:
    theme:
      assets/css/theme.min.css: { minified: true }
  dependencies:
    - iop/landing

# Pages
landing:
  css:
    theme:
      assets/css/landing.min.css: { minified: true, preprocess: false }

listing:
  css:
    theme:
      assets/css/listing.min.css: { minified: true }

# Components
accordion-faq:
  css:
    theme:
      assets/css/accordion-faq.min.css: { minified: true, preprocess: false }

call-to-action:
  css:
    theme:
      assets/css/call-to-action.min.css: { minified: true, preprocess: false }

join:
  css:
    theme:
      assets/css/join.min.css: { minified: true }

navbar:
  css:
    theme:
      assets/css/navbar.min.css: { minified: true }

page-header:
  css:
    theme:
      assets/css/page-header.min.css: { minified: true }

pager:
  css:
    theme:
      assets/css/pagination.min.css: { minified: true }

paragraph__call_to_action:
  css:
    theme:
      assets/css/paragraph--call-to-action.min.css: { minified: true, preprocess: false }

paragraph__carousel:
  css:
    theme:
      assets/css/paragraph--carousel.min.css: { minified: true, preprocess: false }
      assets/css/glide.core.min.css: { minified: true }
  dependencies:
    - iop/paragraph__carousel.js

paragraph__carousel.js:
  header: true
  js:
    assets/js/glide.min.js: { minified: true, attributes: { defer: true }  }

paragraph__image:
  css:
    theme:
      assets/css/paragraph--image.min.css: { minified: true }

paragraph__layout:
  css:
    theme:
      assets/css/paragraph--layout.min.css: { minified: true }

paragraph__testimony:
  css:
    theme:
      assets/css/paragraph--testimony.min.css: { minified: true }

tile:
  css:
    theme:
      assets/css/tile.min.css: { minified: true }

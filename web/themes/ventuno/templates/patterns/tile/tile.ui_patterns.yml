tile:
  label: 'Tile'
  description: 'Custom version of <a href="https://oelibrary.netlify.app/default/?path=/story/components-card--default" target="_blank">BCL''s card</a> to fit the needs of Joinup tiles display.'
  fields:
    image:
      type: object
      label: 'Image'
      description: 'Tile image with path and alt.'
      preview:
        path: 'https://placeimg.com/1000/500/people'
        alt: 'Alternative text for tile image'
    url:
      type: text
      label: 'Url'
      description: 'Url leading to the article.'
      preview: 'https://joinup.ec.europa.eu'
    highlighted:
      type: object
      label: 'Highlighted info'
      description: 'Very relevant information.'
      preview:
        icon: 'calendar-event'
        text: 'DD/MM/YYYY'
    info:
      type: text
      label: 'Info'
      description: 'Tile info.'
      preview: 'Important info'
    title_prefix:
      type: array
      label: 'Title prefix'
      description: 'Variable coming from Drupal that may content important stuff.'
      preview: ''
    title:
      type: text
      label: 'Title'
      description: 'Title of the tile.'
      preview: 'Heading'
    title_suffix:
      type: array
      label: 'Title suffix'
      description: 'Variable coming from Drupal that may content important stuff such as contextual links.'
      preview: ''
    metadata:
      type: array
      label: 'Metadata'
      description: 'Pairs of label/icon describing the type of content the tile refers to. Both are optional.'
      preview:
        - label: 'solution'
          icon: 'clipboard-check'
        - icon: 'clipboard-check'
    bundle:
      type: object
      label: 'Bundle'
      description: 'Content type.'
      preview:
        label: 'News'
        icon: 'newspaper'

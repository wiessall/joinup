tile:
  label: 'Tile'
  description: 'Custom version of <a href="https://oelibrary.netlify.app/default/?path=/story/components-card--default" target="_blank">BCL''s card</a> to fit the needs of Joinup search page.'
  variants:
    default:
      label: 'Default'
      description: 'Standard result item.'
    featured:
      label: 'Featured'
      description: 'Featured result item: the three first results are shown with their image.'
  fields:
    image:
      type: array
      label: 'Image'
      description: 'Card image with path, alt and position.'
      preview:
        path: 'https://placeimg.com/1000/500/people'
        alt: 'Alternative text for card image'
    badges:
      type: array
      label: 'Badges'
      description: 'List of badges for the card.'
      preview:
        - label: 'Primary badge'
        - label: 'Secondary badge'
          rounded_pill: true
    title:
      type: text
      label: 'Title'
      description: 'Card title.'
      preview: 'Title card'
    text:
      type: text
      label: 'Text'
      description: 'Card text.'
      preview: 'Text card with longer text which is supported'
    metadata:
      type: text
      label: 'Metadata'
      description: 'Item metadata.'
      preview: '<span class="text-muted text-nowrap me-4">COLLECTION</span><span class="text-muted text-nowrap">Created: 17/01/2022</span>'

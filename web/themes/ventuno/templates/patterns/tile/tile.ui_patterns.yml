tile:
  label: 'Tile'
  description: 'Custom version of <a href="https://oelibrary.netlify.app/default/?path=/story/components-card--default" target="_blank">BCL''s card</a> to fit the needs of Joinup tiles display.'
  fields:
    horizontal:
      type: boolean
      label: 'Horizontal'
      description: 'Variant of the tile.'
      preview: false
    image:
      type: render
      label: 'Image'
      description: 'Tile image with path and alt.'
      preview:
        - theme: 'image'
          uri: 'https://picsum.photos/1000/500'
          alt: 'Alternative text for tile image'
    url:
      type: text
      label: 'Url'
      description: 'Url leading to the article.'
      preview: 'https://joinup.ec.europa.eu'
    highlighted:
      type: object
      label: 'Highlighted info'
      description: 'Very relevant information.'
      preview:
        icon: 'calendar-event'
        text: 'DD/MM/YYYY'
    info:
      type: object
      label: 'Info'
      description: 'Tile info.'
      preview:
        icon: 'user'
        text: 'Jon Doe'
    title_prefix:
      type: array
      label: 'Title prefix'
      description: 'Variable coming from Drupal that may content important stuff.'
      preview: ''
    label:
      type: text
      label: 'Label'
      description: 'Label of the tile.'
      preview: 'Heading'
    title_suffix:
      type: array
      label: 'Title suffix'
      description: 'Variable coming from Drupal that may content important stuff such as contextual links.'
      preview: ''
    text:
      type: text
      label: 'Text'
      description: 'Descritpion of the content.'
      preview: 'Lorem ipsum dolor sit amet is the standard in typesetting industry.'
    action:
      type: render
      label: 'Action'
      description: 'Call to action in the tile.'
    badges:
      type: array
      label: 'Badges'
      description: 'Badges of the tile.'
      preview:
        - label: 'Open Source'
        - label: 'eGovernment'
    extra_data:
      type: array
      label: 'Extra data'
      description: 'Pairs of label/icon describing the type of content the tile refers to. Both are optional.'
      preview:
        - icon: 'clipboard2-check'
          label: 'solution'
        - icon: 'clipboard2-check'
    bundle:
      type: object
      label: 'Bundle'
      description: 'Content type.'
      preview:
        label: 'News'
        icon: 'newspaper'

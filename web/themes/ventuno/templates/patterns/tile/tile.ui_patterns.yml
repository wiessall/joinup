tile:
  label: 'Tile'
  description: 'Custom version of <a href="https://oelibrary.netlify.app/default/?path=/story/components-card--default" target="_blank">BCL''s card</a> to fit the needs of Joinup tiles display.'
  settings:
    featured:
      type: boolean
      label: 'Featured'
      description: 'Enable to mark the item as featured, with secondary background.'
      preview: false
  fields:
    image:
      type: object
      label: 'Image'
      description: 'Card image with path and alt.'
      preview:
        path: 'https://placeimg.com/1000/500/people'
        alt: 'Alternative text for card image'
    url:
      type: text
      label: 'Url'
      description: 'Url leading to the article.'
      preview: 'https://joinup.ec.europa.eu'
    title:
      type: text
      label: 'Title'
      description: 'Card title.'
      preview: 'Title card'
    text:
      type: text
      label: 'Text'
      description: 'Card text.'
      preview: 'Text card with longer text which is supported'
    subtext:
      type: text
      label: 'Subext'
      description: 'Card subtext.'
      preview: 'Text, card, with, longer text, supported'
    metadata:
      type: array
      label: 'Metadata'
      description: 'Pairs of label/icon describing the type of content the tile refers to. Both are optional.'
      preview:
        - label: 'solution'
          icon: 'clipboard-check'
        - icon: 'clipboard-check'

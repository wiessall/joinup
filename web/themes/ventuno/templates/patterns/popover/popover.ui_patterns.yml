popover:
  label: 'Popover'
  description: 'Generic Bootstrap popover component for reusable UI elements'
  fields:
    trigger_text:
      type: text
      label: 'Trigger text'
      description: 'Text for the trigger button.'
      preview: 'Click me'
    content:
      type: text
      label: 'Content'
      description: 'The popover content (can be HTML).'
      preview: '<p>This is the popover content with some <strong>HTML</strong> formatting.</p>'
    placement:
      type: select
      label: 'Placement'
      description: 'Popover placement position.'
      options:
        bottom: 'Bottom'
        top: 'Top'
        left: 'Left'
        right: 'Right'
      preview: 'bottom'
    trigger_classes:
      type: array
      label: 'Trigger classes'
      description: 'Additional CSS classes for the trigger button.'
      preview: []
    popover_classes:
      type: array
      label: 'Popover classes'
      description: 'Additional CSS classes for the popover container.'
      preview: []
    trigger_attributes:
      type: array
      label: 'Trigger attributes'
      description: 'Additional attributes for the trigger button.'
      preview: []
    popover_attributes:
      type: array
      label: 'Popover attributes'
      description: 'Additional attributes for the popover container.'
      preview: []
  libraries:
    - popover:
        css:
          theme:
            css/popover.css: {}
        js:
          js/popover.js: {}
        dependencies:
          - core/drupal
          - core/once
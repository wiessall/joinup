# Main
style:
  version: VERSION
  css:
    base:
      assets/css/main.css: {}
  js:
    assets/js/oe-bcl-joinup.bundle.min.js: { minified: true }
    assets/js/popovers.js: { minified: false }
  dependencies:
    - core/drupal

# Pages
homepage:
  css:
    theme:
      assets/css/homepage.css: {}
  dependencies:
    - ventuno/tour-first-balloon

licence-comparer:
  css:
    theme:
      assets/css/licence-comparer.css: {}

searchpage:
  css:
    theme:
      assets/css/searchpage.css: {}
  dependencies:
    - ventuno/close

# Pure BCL components
accordion:
  css:
    theme:
      assets/css/accordion.css: {}

close:
  css:
    theme:
      assets/css/close.css: {}

modals:
  css:
    theme:
      assets/css/modals.css: {}
  dependencies:
    - ventuno/close

tables:
  css:
    theme:
      assets/css/tables.css: {}

# Custom and hybrid (BCL + custom) components

footer:

# Main
style:
  version: VERSION
  css:
    base:
      assets/css/main.css: {}
  js:
    assets/js/oe-bcl-joinup.bundle.min.js: { minified: true }
    assets/js/popovers.js: { minified: false }
  dependencies:
    - core/drupal

# Pages
homepage:
  css:
    theme:
      assets/css/homepage.css: {}
  dependencies:
    - ventuno/tour-first-balloon

licence-comparer:
  css:
    theme:
      assets/css/licence-comparer.css: {}

searchpage:
  css:
    theme:
      assets/css/searchpage.css: {}
  dependencies:
    - ventuno/close

# Bootstrap components
close:
  css:
    theme:
      assets/css/close.css: {}

modals:
  css:
    theme:
      assets/css/modals.css: {}
  dependencies:
    - ventuno/close

tables:
  css:
    theme:
      assets/css/tables.css: {}

# Custom components
footer:
  css:
    theme:
      assets/css/footer.css: {}

form-checkboxes:
  css:
    theme:
      assets/css/form-checkboxes.css: {}

glide:
  js:
    assets/js/glide.js: { minified: false }
  css:
    theme:
      assets/css/glide.core.min.css: { minified: true }

navbar:
  css:
    theme:
      assets/css/navbar.css: {}
  js:
    assets/js/sticky-menu.js: { minified: true, attributes: { defer: true } }

navbar-search:
  css:
    theme:
      assets/css/navbar-search.css: {}
  js:
    assets/js/searchbox-focus.js: { minified: true, attributes: { defer: true } }

pager:
  css:
    theme:
      assets/css/pager.css: {}

site-alerts-messages:
  css:
    theme:
      assets/css/site-alerts-messages.css: {}

tour-first-balloon:
  js:
    assets/js/tour-first-balloon.js: { minified: true, attributes: { defer: true } }

# @todo remove when switch to Ventuno theme is complete
bootstrap-base:
  css:
    component:
      assets/css/bootstrap-base.css: {}
  js:
    assets/js/oe-bcl-joinup.bundle.min.js: { minified: true }
    assets/js/popovers.js: { minified: false }

joinup_user.settings:
  type: config_object
  label: 'Settings related to the joinup_user.'
  mapping:
    membership_group_limit:
      label: 'Maximum groups displayed per user'
      type: integer

# Schema for the configuration files of the Joinup user module.
joinup_user.mail:
  type: config_object
  label: 'Email settings'
  mapping:
    email_admin_update:
      type: mail
      label: 'Account updated by administrator confirmation'
    password_reset_confirm:
      type: mail
      label: 'Password reset confirmation'

views.filter.joinup_user_group:
  type: views_filter
  label: 'OG groups the user belongs to.'

views.field.joinup_user_bulk_form:
  type: views.field.user_bulk_form
  label: 'Interoperable Europe Portal user operations bulk form'

views.field.joinup_user_is_author:
  type: views.field.boolean
  label: 'Has authored content'

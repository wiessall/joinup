parameters:
  # See https://www.drupal.org/node/2910500
  security.enable_super_user: false

services:

  _defaults:
    autoconfigure: true
    autowire: true

  cache_context.user.photo:
    class: Drupal\joinup_user\Cache\Context\UserPhotoCacheContext
    tags:
      - { name: cache.context}

  joinup_user.user_route_context:
    class: Drupal\joinup_user\ContextProvider\UserRouteContext
    tags:
      - { name: 'context_provider' }

  Drupal\joinup_user\Routing\RouteSubscriber: { }

  Drupal\joinup_user\Access\UserStatusAccessCheck:
    tags:
      - { name: access_check, applies_to: _user_status }

  Drupal\joinup_user\EventSubscriber\JoinupUserUserCancelSubscriber: { }

  Drupal\joinup_user\EventSubscriber\ShowOnlyUserContentSubscriber: { }

  joinup_user.notification_helper:
    class: Drupal\joinup_user\JoinupUserNotificationHelper
  Drupal\joinup_user\JoinupUserNotificationHelperInterface: '@joinup_user.notification_helper'

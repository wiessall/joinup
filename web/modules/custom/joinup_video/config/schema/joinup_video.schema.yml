filter_settings.joinup_video:
  type: filter
  label: 'Joinup Video Embed'
  mapping:
    allowed_providers:
      type: sequence
      label: 'Allowed providers'
      sequence:
        # Could be string of integer.
        type: ignore
        label: Provider
    autoplay:
      type: boolean
      label: 'Autoplay video'
    responsive:
      type: boolean
      label: Responsive

media.source.joinup_ec_video:
  type: media.source.field_aware
  label: 'Joinup EC Video source configuration'
  mapping:
    thumbnails_directory:
      type: uri
      label: 'URI of thumbnail storage directory'

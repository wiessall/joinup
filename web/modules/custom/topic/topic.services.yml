services:

  _defaults:
    autoconfigure: true
    autowire: true

  topic.path_processor:
    class: Drupal\topic\PathProcessor\TopicPathProcessor
    tags:
      - { name: path_processor_outbound, priority: 1001 }

  topic.vocabulary_manager:
    class: Drupal\topic\VocabularyManager
    arguments: ['@entity_type.manager', '@database', '@rdf_sync.connection', '@meta_entity.repository']

  Drupal\topic\EventSubscriber\HomepageTopicsSectionSubscriber: { }

  Drupal\topic\EventSubscriber\QueryPresetSubscriber: { }

  Drupal\topic\Routing\TopicRouteSubscriber: { }

  Drupal\topic\EventSubscriber\TopicRedirectRequestSubscriber: { }

services:

  _defaults:
    autoconfigure: true
    autowire: true

  Drupal\topic\PathProcessor\TopicPathProcessor:
    tags:
      - { name: path_processor_outbound, priority: 1001 }

  Drupal\topic\EventSubscriber\HomepageTopicsSectionSubscriber: { }

  Drupal\topic\EventSubscriber\QueryPresetSubscriber: { }

  Drupal\topic\Routing\TopicRouteSubscriber: { }

  Drupal\topic\EventSubscriber\TopicRedirectRequestSubscriber: { }

  Drupal\topic\Hook\TopicHooks: { }

  topic:
    class: Drupal\topic\Service\TopicService
    Drupal\topic\Service\TopicServiceInterface: '@topic'

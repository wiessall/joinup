services:
  topic.path_processor:
    class: Drupal\topic\PathProcessor\TopicPathProcessor
    tags:
      - { name: path_processor_outbound, priority: 0 }
  topic.route_processor:
    class: Drupal\topic\RouteProcessor\TopicRouteProcessor
    tags:
      - { name: route_processor_outbound, priority: 0 }

  topic.vocabulary_manager:
    class: Drupal\topic\VocabularyManager
    arguments: ['@entity_type.manager', '@database', '@sparql.endpoint']

  topic.event_subscriber:
    class: Drupal\topic\EventSubscriber\HomepageTopicsSectionSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }

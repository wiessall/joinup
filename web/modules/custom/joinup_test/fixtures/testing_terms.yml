legal_type:
  - name: 'Can'
    children:
      - name: 'Use/reproduce'
        description: 'Ability to use, copy / reproduce the work freely in unlimited quantities'
      - name: 'Distribute'
        description: 'Ability to distribute the work to third parties freely,  in unlimited quantities'
      - name: 'Modify/merge'
        description: 'Ability to modify / combine the work with others and create derivatives'
      - name: 'Sublicense'
        description: 'Ability to license the work, including possible modifications (without changing the licence if it is copyleft or share alike)'
      - name: 'Commercial use'
        description: 'Ability to make use of the work for commercial purpose or to license it for a fee'
      - name: 'Use patents'
        description: 'Rights to practice patent claims of the software owner and of the contributors to the code, in so far these rights are necessary to make full use of the software'
      - name: 'Place warranty'
        description: 'Ability to place additional warranty, services or rights on the software licensed (without holding the software owner and other contributors liable for it)'
  - name: 'Must'
    children:
      - name: 'Incl. Copyright'
        description: 'Describes whether the original copyright and attribution marks must be retained'
      - name: 'Royalty free'
        description: 'In case a fee (i.e. contribution, lump sum) is requested from recipients, it cannot be royalties (depending on the use)'
      - name: 'State changes'
        description: 'Source code modifications (author, why, beginning, end) must be documented'
      - name: 'Disclose source'
        description: 'The source code of distributed derivatives must be publicly available'
      - name: 'Copyleft/Share a.'
        description: 'In case of (re-) distribution of the work or its derivatives, the same licence must be used/granted: no re-licensing.'
      - name: 'Lesser copyleft'
        description: 'While the work itself is copyleft, derivatives produced by the normal use of the work are not and could be covered by any other licence'
      - name: 'SaaS/network'
        description: 'Distribution includes providing access to the work (to its functionalities) throug a network, online, from the cloud, as a service'
      - name: 'Include licence'
        description: 'Include the full text of the licence in the modified software.'
      - name: 'Rename modifs.'
        description: 'Obligation to rename the work in case a modified/derivative version is distributed'
  - name: 'Cannot'
    children:
      - name: 'Hold liable'
        description: 'No recipient may charge the software owner or contributors for direct or indirect damages. This is a frequent clause in open licences'
      - name: 'Use trademark'
        description: "No allowance of using the original licensor or contributors' names, trademarks or logos (i.e. for advertisement, promotion)"
      - name: 'Commerce'
        description: 'No allowance of making use of the work for commercial purpose or to license it for a fee. This makes the licence &quot;non open source&quot;.'
      - name: 'Modify'
        description: 'The software or work (i.e. the text of a regulation, of a court decision) is licensed &quot;as is&quot; and (re-) distributions cannot be modified. For software, this makes the licence &quot;non open source&quot;.'
      - name: 'Ethical clauses'
        description: 'The use of the work is restricted based on matter/ethical conditions (i.e. not for nuclear industry, weapons,  genetic etc.). This makes the licence &quot;non open source&quot;.'
      - name: 'Pub sector only'
        description: 'The use of the work is restricted to a specific category of users, i.e. public sector. This makes the licence &quot;non open source&quot;.'
      - name: 'Sublicence'
        description: 'Recipient re-distributing the work are not &quot;licensors&quot;, even when users that receives the software automatically has the right to copy, modify and distribute the work.'
  - name: 'Compatible'
    children:
      - name: 'None N/A'
        description: 'The license does not authorise reusing or marging the covered work in another work'
      - name: 'Permissive'
        description: 'The licence authorises reusing or merging the covered code in software covered any other licence (free/libre or proprietary)'
      - name: 'GPL'
        description: 'The licence authorises reusing or merging the covered code in software covered by the GNU/GPL'
      - name: 'Other copyleft'
        description: 'The licence is interoperable with other copyleft licences and authorises reusing or merging the covered code in software covered by these other copyleft licences'
      - name: 'Linking freedom'
        description: '&quot;Linking for interoperability&quot; with other software has no impact on the licensing condition of the other software'
      - name: 'Multilingual'
        description: 'The licence has a working value and is &quot;original&quot; in several languages (i.e. English, French, German, Italian, Spanish etc.)'
      - name: 'For data'
        description: 'The licence was designed or is also convenient for the distribution of data (i.e. it covers &quot;the copyrighted work&quot; in general)'
      - name: 'For software'
        description: 'The licence was designed for the distribution of software'
  - name: 'Law'
    children:
      - name: 'EU/MS law'
        description: 'The licence states explicitly that the law of EU/or of a Member State is applicable (i.e. the Member State of the Licensor)'
      - name: 'US law'
        description: 'The licence states explicitly that the law of the United States of America is applicable (i.e. some US State)'
      - name: "Licensor's law"
        description: "The licence states explicitly that the applicable law is the one of the licensor's state"
      - name: 'Other law'
        description: 'The licence states explicitly that the law of a specific state (other than EU or US) is applicable'
      - name: 'Not fixed/local'
        description: 'The licence do not explicitely determines the applicable law'
      - name: 'Venue fixed'
        description: 'The licence fixes the competent court in case of litigation, with possible exceptions / agreements'
  - name: 'Support'
    children:
      - name: 'Strong Community'
        description: 'The licence is supported by a solid community: licence stewart has a web site / has a legal support addressing questions / publish FAQs or cases'
      - name: 'Governments/EU'
        description: 'The licence is supported by a government, an international organisation, the European Union or important public agencies (i.e. NASA, CERN etc.)'
      - name: 'OSI approved'
        description: 'The licence is approved by the Open Source Initiative, as compliant with the Open Source Definition (OSD)'
      - name: 'FSF Free/Libre'
        description: 'The licence is considered as Free/Libre by the Free Software Foundation'

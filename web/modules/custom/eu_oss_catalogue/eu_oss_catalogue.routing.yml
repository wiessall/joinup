eu_oss_catalogue.provider.collection:
  path: /admin/content/eu-oss-catalogue
  defaults:
    _controller: Drupal\eu_oss_catalogue\Controller\EuOssCatalogueController::collection
    _title: EU OSS Catalogue
  requirements:
    _permission: administer eu oss catalogue
    _eu_oss_catalogue_check_enabled: 'TRUE'

eu_oss_catalogue.hosting_platform_add:
  path: '/admin/content/eu-oss-catalogue/hosting-platform/add'
  defaults:
    _entity_form: 'hosting_platform.edit'
    _title: 'Add configuration'
  requirements:
    _permission: 'administer eu oss catalogue'
    _eu_oss_catalogue_check_enabled: 'TRUE'

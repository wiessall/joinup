localisation:
  localisationReady: false
  availableLanguages:
    - en
description:
  en:
    genericName: EU OSS Catalogue - Drupal module
    longDescription: |
      This is a Drupal module for generating the first MVP (minimum viable
      product) version of a EU OpenSource Software Solutions, produced or used
      by Public Administrations. Mainly, the module federates data from national
      OSS catalogues but also from any other arbitrary source and allows
      exposing such data via Drupal API, using Drupal Views, controllers or,
      even, JSON:API/GraphQL endpoints. It started as a Proof-Of-Concept based
      on the[ publiccode.ym)]((https://yml.publiccode.tools/) schema
      specifications but lately evolved as a full pluggable system that accepts
      any kind of federation source, called \_solution provider\_ in the realm
      of this module.
    shortDescription: Drupal module for EU OpenSource Software Solutions Catalogue

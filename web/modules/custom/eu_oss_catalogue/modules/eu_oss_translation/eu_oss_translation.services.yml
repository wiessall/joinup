services:
  _defaults:
    autoconfigure: true
  eu_oss_translation.job_builder:
    class: Drupal\eu_oss_translation\JobBuilder
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@logger.channel.eu_oss_catalogue'
      - '@plugin.manager.tmgmt.source'
      - '@config.factory'

  Drupal\eu_oss_translation\EventSubscriber\SolutionPostSaveSubscriber:
    arguments: [ '@queue' ]

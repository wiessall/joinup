# Schema for the configuration files of the Vitality index module.

eu_oss_vitality_index.settings:
  type: config_object
  label: 'Vitality index settings'
  mapping:
    cron_frequency:
      type: integer
      label: 'Cron frequency in days'
    process_timeout:
      type: integer
      label: 'The process timeout (max. runtime) in seconds for cloning/fetching repository.'

field.formatter.settings.vitality_index_chart:
  type: mapping
  label: 'Vitality index chart'
  mapping:
    info:
      type: text_format
      label: 'Information text'

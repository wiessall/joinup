      description:
          it:
              genericName: Software Gestionale
              shortDescription: |-
                  Il software consente di organizzare l'iter di gestione delle licenze Taxi
                  ed NCC
              longDescription: "La piattaforma software applicativa consente la gestione delle licenze e\ndei turni di servizio Taxi e NCC all’interno del proprio territorio\ncomunale, al fine di monitorare la copertura delle esigenze di trasporto\nmanifestate dai cittadini e pianificare in maniera più efficace le azioni\nvolte al miglioramento del servizio stesso. \n\n\n\nLa piattaforma è in grado di organizzare le informazioni circa le licenze.\nIn particolare, organizza la documentazione che nel tempo viene prodotta,\nassicurando conformità rispetto alla tenuta del documento informatico. In\nfase di configurazione è possibile indicare i template dei documenti da\nprodurre, che tramite un editor dei testi l'operatore può modificare,\ninoltre, tramite la gestione dei tag tutte le informazioni recuperate dal\nsistema andranno a precompilare il documento. \n\nIl sistema prevede la gestione di un iter di firma, in questo modo un\noperatore può inviare e notificare al documento i documenti da firmare. Il\ndirigente ha a disposizione una sezione attraverso la quale poter firmare\nla documentazione. \n\n\n\nPer ciascuna licenza, inoltre, vengono gestite le informazioni circa il\nproprietario, le sostituzioni e la tipologia di veicolo utilizzato. Tutte\nle informazioni vengono storicizzate così da garantire una completa\nricostruzione della storia di una licenza.\n\nIl sistema gestisce l'anagrafica dei proprietari, delle associazioni di\ncategoria e degli enti di rilascio.  \n"
              features:
                  - Anagrafica dei proprietari
                  - Gestione Licenze taxi ed NCC
                  - Gestione documentazione licenze
                  - Variazioni licenze
                  - Gestione turnazioni

      description:
          it:
              genericName: ' Verifica firme'
              shortDescription: Applicazione per la verifica della raccolta di firme
              longDescription: "L'applicativo Verifica firme ha l'obiettivo di fornire gli strumenti per la verifica firme relative a una richiesta di Referendum \no a una Proposta di Legge di Iniziativa Popolare.\nLa verifica delle firme è necessaria sia in fase di presentazione della richiesta per attestarne l'ammissibilità sia in fase \ndi verifica del raggiungimento del quorum per la presentazione del Referendum o della Proposta di Legge di Iniziativa Popolare.\n"
              features:
                  - Raccolta dati sul campo e analisi
              screenshots:
                  - VerificaFirme.jpg
      legal:
          license: AGPL-3.0-or-later
          mainCopyrightOwner: Regione Emilia-Romagna
          repoOwner: Regione Emilia-Romagna

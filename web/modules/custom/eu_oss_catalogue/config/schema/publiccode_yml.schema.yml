# There's no 'eu_oss_catalogue.publiccode_yml' configuration. We're using this
# schema definition to test publiccode.yml data.
# See https://yml.publiccode.tools
eu_oss_catalogue.publiccode_yml:
  type: mapping
  mapping:
    publiccodeYmlVersion:
      type: string
      required: true
    name:
      type: string
      required: true
    applicationSuite:
      type: string
    url:
      type: uri
      required: true
    landingURL:
      type: uri
    isBasedOn:
      type: sequence
      sequence:
        type: uri
    softwareVersion:
      type: string
    releaseDate:
      type: string
      required: true
      # Validate YYYY-MM-DD format.
      # constraints:
    # https://yml.publiccode.tools/schema.core.html#key-logo
    logo:
      type: string
      # Validate:
      # - file exists
      # - file extension
      # - PNG minimum width
      # constraints:
    monochromeLogo:
      type: string
      # Validate:
      # - file exists
      # - file extension
      # - PNG minimum width
      # constraints:
      deprecated: The monochromeLogo key is deprecated. See https://yml.publiccode.tools/schema.core.html#key-monochromelogo-deprecated
    inputTypes:
      type: sequence
      sequence:
        type: string
      deprecated: The inputTypes key is deprecated. See https://yml.publiccode.tools/schema.core.html#key-inputtypes-deprecated
    outputTypes:
      type: sequence
      sequence:
        type: string
      deprecated: The outputTypes key is deprecated. See https://yml.publiccode.tools/schema.core.html#key-outputtypes-deprecated
    # https://yml.publiccode.tools/schema.core.html#key-platforms
    platforms:
      type: sequence
      required: true
      sequence:
        type: string
    # https://yml.publiccode.tools/schema.core.html#key-categories
    categories:
      type: sequence
      required: true
      sequence:
        type: string
      # Validate categories exists in vocab.
      # constraints:
    # https://yml.publiccode.tools/schema.core.html#key-usedby
    usedBy:
      type: sequence
      sequence:
        type: string
    # https://yml.publiccode.tools/schema.core.html#key-roadmap
    roadmap:
      type: uri
    # https://yml.publiccode.tools/schema.core.html#key-developmentstatus
    developmentStatus:
      type: string
      required: true
      # Validate valus is in enumeration
      # constraints:
    # https://yml.publiccode.tools/schema.core.html#key-softwaretype
    softwareType:
      type: string
      required: true
      # Validate value is in enumeration
      # constraints:
    # https://yml.publiccode.tools/schema.core.html#section-intendedaudience
    intendedAudience:
      type: mapping
      mapping:
        countries:
          type: sequence
          sequence:
            type: string
            # Validate value is a ISO 3166-1 alpha-2 two-letter country code from
            # Drupal country list
            # constraints:
        unsupportedCountries:
          type: sequence
          sequence:
            type: string
            # Validate value is a ISO 3166-1 alpha-2 two-letter country code from
            # Drupal country list
            # constraints:
        scope:
          type: sequence
          sequence:
            type: string
            # Validate value is in the oss_scope vocab (to be created)
            # constraints:
    # https://yml.publiccode.tools/schema.core.html#section-description
    description:
      type: sequence
      sequence:
        type: eu_oss_catalogue.publiccode_yml_description
        # Validate the key a ISO 3166-1 alpha-2 two-letter country code from
        # Drupal country list
        # constraint:
    # https://yml.publiccode.tools/schema.core.html#section-legal
    legal:
      type: mapping
      mapping:
        license:
          type: string
          required: true
          # Validate value is in oss_licence
          # constraint:
        mainCopyrightOwner:
          type: string
        repoOwner:
          type: string
        authorsFile:
          type: string
    # https://yml.publiccode.tools/schema.core.html#section-maintenance
    maintenance:
      type: mapping
      mapping:
        type:
          type: string
          # Validate is in enumeration
          # constraints:
        contractors:
          type: sequence
          sequence:
            type: eu_oss_catalogue.publiccode_yml_maintenance.contractor
          # Validate at least 1 contractor exists if maintenance/type == contract
          # constraint:
        contacts:
          type: sequence
          sequence:
            type: eu_oss_catalogue.publiccode_yml_maintenance.contact
          # Validate at least 1 contact exists if maintenance/type is internal
          # or community
          # constraint:
    localisation:
      type: mapping
      mapping:
        localisationReady:
          type: boolean
          required: true
        availableLanguages:
          type: sequence
          required: true
          sequence:
            type: string
            # Validate value is a IETF BCP 47 language tag
    dependsOn:
      type: mapping
      mapping:
        open:
          type: sequence
          sequence:
            type: eu_oss_catalogue.publiccode_yml_dependency
        proprietary:
          type: sequence
          sequence:
            type: eu_oss_catalogue.publiccode_yml_dependency
        hardware:
          type: sequence
          sequence:
            type: eu_oss_catalogue.publiccode_yml_dependency
    # This added automatically by Drupal. We ignore it.
    langcode:
      type: ignore
    # Country specific.
    it:
      type: eu_oss_catalogue.publiccode_yml.country.[%key]
      label: Country specific schema for Italy
    de:
      type: eu_oss_catalogue.publiccode_yml.country.[%key]
      label: Country specific schema for Germany

# https://yml.publiccode.tools/schema.core.html#section-description
eu_oss_catalogue.publiccode_yml_description:
  type: mapping
  mapping:
    genericName:
      type: string
      deprecated: The genericName key is deprecated. See https://yml.publiccode.tools/schema.core.html#key-description-lang-genericname-deprecated
    localisedName:
      type: string
    shortDescription:
      type: string
      required: true
      # Validate maxlength 150
      # constraints:
    longDescription:
      type: string
      # Validate:
      # - is present in, at least, one language
      # - min 150 chars, max 10000 chars)
      # constraints:
    documentation:
      type: uri
    apiDocumentation:
      type: uri
    features:
      type: sequence
      sequence:
        type: string
      # Validate is present, at least, one language
      # constraints:
    screenshots:
      type: sequence
      sequence:
        type: string
        # Validate:
        # - file exists
        # - file extension: PNG, JPG
        # constraints:
    videos:
      type: sequence
      sequence:
        type: uri
    awards:
      type: sequence
      sequence:
        type: string

eu_oss_catalogue.publiccode_yml_maintenance.contact_base:
  type: mapping
  mapping:
    name:
      type: string
      required: true
    email:
      type: email

eu_oss_catalogue.publiccode_yml_maintenance.contact:
  type: eu_oss_catalogue.publiccode_yml_maintenance.contact_base
  mapping:
    phone:
      type: string
    affiliation:
      type: string

eu_oss_catalogue.publiccode_yml_maintenance.contractor:
  type: eu_oss_catalogue.publiccode_yml_maintenance.contact_base
  mapping:
    until:
      type: string
      required: true
      # Validate YYYY-MM-DD format
      # constraints:
    website:
      type: uri

# https://yml.publiccode.tools/schema.core.html#dependency
eu_oss_catalogue.publiccode_yml_dependency:
  type: mapping
  mapping:
    name:
      type: string
      required: true
    versionMin:
      type: string
    versionMax:
      type: string
    version:
      type: string
    optional:
      type: boolean

# @see https://yml.publiccode.tools/country.html#country-specific-sections
eu_oss_catalogue.publiccode_yml.country_base:
  type: mapping
  mapping:
    countryExtensionVersion:
      type: string
      label: Version of the country extension
      required: true
      constraints:
        - regex: '/^1\.0\.0$/'

eu_oss_catalogue.publiccode_yml.country.it:
  type: eu_oss_catalogue.publiccode_yml.country_base
  mapping:
    conforme:
      type: mapping
      label: Conformity to Italian law
      required: false
      mapping:
        lineeGuidaDesign:
          type: boolean
          label: Compliance with the Italian laws (L. 4/2004)
          required: false
        modelloInteroperabilita:
          type: boolean
          label: 'Compliance with the "linee guida sull’interoperabilità".'
          required: false
        misureMinimeSicurezza:
          type: boolean
          label: 'Compliance with the "Misure minime di sicurezza ICT per le Pubbliche amministrazioni".'
          required: false
        gdpr:
          type: boolean
          label: 'Whether the software respects GDPR.'
          required: false
    piattaforme:
      type: mapping
      required: false
      mapping:
        spid:
          type: boolean
          label: 'Whether the software interfaces with "SPID - il Sistema Pubblico di Identità Digitale".'
          required: false
        cie:
          type: boolean
          label: 'Whether the software interfaces with "Carta di Identità Elettronica".'
          required: false
        anpr:
          type: boolean
          label: 'Whether the software interfaces with "ANPR".'
          required: false
        pagopa:
          type: boolean
          label: 'Whether the software interfaces with "PagoPA".'
          required: false
        io:
          type: boolean
          label: 'Whether the software interfaces with "IO - public services app".'
          required: false
    riuso:
      type: mapping
      required: false
      mapping:
        codiceIPA:
          type: string
          label: 'mandatory if repoOwner is a Public Administration'
          required: false

eu_oss_catalogue.publiccode_yml.country.de:
  type: eu_oss_catalogue.publiccode_yml.country_base

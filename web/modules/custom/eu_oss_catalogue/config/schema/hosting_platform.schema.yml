eu_oss_catalogue.hosting_platform.*:
  type: config_entity
  label: 'Code hosting platform config'
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    description:
      type: text
      label: Description
    platformId:
      type: string
      label: Code hosting platform plugin ID
    platformSettings:
      type: eu_oss_catalogue.hosting_platform_plugin.[%parent.platformId]
      label: Code hosting platform plugin instance settings

eu_oss_catalogue.hosting_platform_plugin_default_settings:
  type: mapping

eu_oss_catalogue.hosting_platform_plugin_default_settings_git:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings
  mapping:
    projects:
      type: sequence
      label: List of repository IDs or namespaces
      sequence:
        type: sequence
        nullable: true
        sequence:
          type: string

# GitHub
eu_oss_catalogue.hosting_platform_plugin.github:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings_git
  label: GitHub platform settings

# GitLab (gitlab.com).
eu_oss_catalogue.hosting_platform_plugin.gitlab_com:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings_git
  label: GitLab as service platform settings

# GitLab (self-hosted).
eu_oss_catalogue.hosting_platform_plugin.gitlab_self_hosted:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings_git
  label: GitLab self-hosted platform settings
  mapping:
    url:
      type: uri
      label: GitLab platform URL

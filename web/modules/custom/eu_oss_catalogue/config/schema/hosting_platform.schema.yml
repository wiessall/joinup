eu_oss_catalogue.hosting_platform.*:
  type: config_entity
  label: 'Code hosting platform config'
  mapping:
    id:
      type: string
      label: ID
    label:
      type: label
      label: Label
    type:
      type: string
      label: Catalogue type
      constraints:
        Choice:
          callback: [ '\Drupal\eu_oss_catalogue\Entity\CatalogueType', 'validChoices' ]
    country:
      type: string
      label: Country code
      nullable: true
      constraints:
        CountryCode: [ ]
    weblinks:
      type: sequence
      label: Weblinks
      constraints:
        Callback: [ '\Drupal\eu_oss_catalogue\Entity\HostingPlatformConfig', 'validateWeblinks' ]
      sequence:
        type: mapping
        label: Weblink
        mapping:
          url:
            type: string
            label: URL
          title:
            type: label
            label: Title
            nullable: true
    description:
      type: text
      label: Description
    platformId:
      type: string
      label: Code hosting platform plugin ID
    platformSettings:
      type: eu_oss_catalogue.hosting_platform_plugin.[%parent.platformId]
      label: Code hosting platform plugin instance settings

eu_oss_catalogue.hosting_platform_plugin_default_settings:
  type: mapping

eu_oss_catalogue.hosting_platform_plugin_default_settings_git:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings
  mapping:
    baseUrl:
      type: string
      label: Platform base URL
      nullable: true
    projects:
      type: sequence
      label: List of repository IDs or namespaces
      sequence:
        type: sequence
        nullable: true
        sequence:
          type: string

eu_oss_catalogue.hosting_platform_plugin.*:
  type: eu_oss_catalogue.hosting_platform_plugin_default_settings_git

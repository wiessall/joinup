joinup_distribution.group.add:
  path: 'node/{node}/distribution/add'
  defaults:
    _controller: '\Drupal\joinup_distribution\Controller\JoinupDistributionController::addOnNode'
    _title: 'Add Distribution'
  requirements:
    _custom_access: '\Drupal\joinup_distribution\Controller\JoinupDistributionController::createAssetDistributionOnNodeGroupAccess'
    _joinup_group: 'solution'
  options:
    parameters:
      node:
        type: entity:node

joinup_distribution.track_download:
  path: 'distribution/track/{file}'
  defaults:
    _controller: '\Drupal\joinup_distribution\Controller\DownloadTrackingController::trackDownload'
    _title: 'Download in progress...'
  requirements:
    _access: 'TRUE'
    _custom_access: '\Drupal\joinup_distribution\Controller\DownloadTrackingController::isDistributionFile'

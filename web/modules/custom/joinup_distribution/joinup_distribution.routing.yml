joinup_distribution.distribution.add:
  path: /rdf_entity/{rdf_entity}/add/{node_type}
  defaults:
    _entity_form: node
    _title: Add new distribution
  requirements:
    _entity_create_access: node:distribution
    node_type: distribution
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - asset_release
          - solution
        group: true
      node_type:
        type: entity:node_type


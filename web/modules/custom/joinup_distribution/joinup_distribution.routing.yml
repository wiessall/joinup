joinup_distribution.asset_distribution.add:
  path: 'rdf_entity/{rdf_entity}/distribution/add'
  defaults:
    _controller: '\Drupal\joinup_distribution\Controller\JoinupDistributionController::add'
    _title: 'Add Distribution'
  requirements:
    _custom_access: '\Drupal\joinup_distribution\Controller\JoinupDistributionController::createAssetDistributionAccess'
    _joinup_group: 'solution'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity

joinup_distribution.track_download:
  path: 'distribution/track/{file}'
  defaults:
    _controller: '\Drupal\joinup_distribution\Controller\DownloadTrackingController::trackDownload'
    _title: 'Download in progress...'
  requirements:
    _access: 'TRUE'
    _custom_access: '\Drupal\joinup_distribution\Controller\DownloadTrackingController::isDistributionFile'

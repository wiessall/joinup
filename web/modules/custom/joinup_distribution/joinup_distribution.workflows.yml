joinup_distribution_workflow:
  id: joinup_distribution_workflow
  label: "Distribution"
  group: joinup_distribution
  states:
    published:
      label: Published
      published: true
    archived:
      label: Archived
      published: true
  transitions:
    publish:
      label: Publish
      from: [ published ]
      to: published
    archive:
      label: Archive
      from: [ published ]
      to: archived
    unarchive:
      label: Unarchive
      from: [ archived ]
      to: published

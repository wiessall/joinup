services:
  joinup_core.sanitize.commands:
    class: Drupal\joinup_core\Commands\JoinupDataSanitizationCommands
    arguments: ['@database']
    tags:
      - { name: drush.command }

  joinup_core.clean_cache_tables.commands:
    class: Drupal\joinup_core\Commands\JoinupCleanCacheTablesCommands
    arguments: ['@database']
    tags:
      - { name: drush.command }

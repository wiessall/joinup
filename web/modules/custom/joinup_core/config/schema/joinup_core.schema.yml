# Normally this kind of data should be stored in each bundle config entity, as
# third-party settings. As the active config store is locked in production, we
# don't want the bundle config entities to be editable, so we keep these
# settings in a centralized config object which is editable.
# See joinup_core_config_readonly_whitelist_patterns().
joinup_core.outdated_content_threshold:
  type: sequence
  label: 'Entity types'
  sequence:
    type: sequence
    label: 'Bundles'
    sequence:
      type: integer
      label: 'Years'
      nullable: true

field.formatter.third_party.joinup:
  type: mapping
  label: 'Theme settings for Joinup project.'
  mapping:
    template_suggestion:
      type: string

field.formatter.settings.image_url_formatter:
  type: mapping
  label: 'Image field display format settings'
  mapping:
    image_link:
      type: string
      label: 'Link image to'
    image_style:
      type: string
      label: 'Image style'

field.formatter.settings.daterange_condensed:
  type: field.formatter.settings.datetime_base
  label: 'Condensed date range formatter settings'
  mapping:
    separator:
      type: string
      label: 'Date separator'
    default_format:
      type: date_format
      label: 'Default format'
    day_diff_format:
      type: date_format
      label: 'Different days format'
    month_diff_format:
      type: date_format
      label: 'Different months format'
    year_diff_format:
      type: date_format
      label: 'Different years format'

field.formatter.settings.addtocall_daterange_condensed:
  type: field.formatter.settings.addtocal_view
  label: 'Add to Call condensed date range formatter settings'
  mapping:
    day_diff_format:
      type: date_format
      label: 'Different days format'
    month_diff_format:
      type: date_format
      label: 'Different months format'
    year_diff_format:
      type: date_format
      label: 'Different years format'

field.formatter.settings.filtered_entity_reference_bundles:
  type: field.formatter.settings.entity_reference_revisions_entity_view
  label: 'Add filtered entity reference types formatter settings'
  mapping:
    filtered_entity_bundles:
      type: sequence
      label: 'Bundles'
      nullable: true
      sequence:
        type: string
        label: 'Bundle'
    trim_length:
      type: integer
      label: 'Trim length'
    trim_chars:
      # Allow translation.
      type: label
      label: 'Trim characters'
      nullable: true

field.widget.settings.email_legacy_multicardinality:
  type: field.widget.settings.email_default

field.widget.settings.link_legacy_multicardinality:
  type: field.widget.settings.link_default

field.widget.settings.string_textfield_legacy_multicardinality:
  type: field.widget.settings.string_textfield

condition.plugin.request_route:
  type: condition.plugin
  label: Request route condition
  mapping:
    routes:
      type: sequence
      label: Routes
      sequence:
        type: string
        label: Route

condition.plugin.joinup_content:
  type: condition.plugin
  label: Joinup content condition
  mapping:
    content:
      type: sequence
      sequence:
        type: string

field.formatter.settings.entity_reference_custom_link:
  type: mapping
  label: 'Entity reference custom link display format settings'
  mapping:
    path:
      type: string
      label: Path
    label:
      type: string
      label: Label
    query_parameters:
      type: string
      label: Query parameters
    limit:
      type: integer
      label: limit

block.settings.joinup_local_tasks_block:
  type: block_settings
  label: 'Tabs block'
  mapping:
    primary:
      type: boolean
      label: 'Whether primary tabs are shown'
    secondary:
      type: boolean
      label: 'Whether secondary tabs are shown'

block.settings.entity_unpublished:
  type: block_settings
  label: 'Unpublished content block settings'
  mapping:
    states_filter:
      type: sequence
      label: 'States filter'
      sequence:
        type: string
        label: 'State'
    negate_states_filter:
      type: boolean
      label: 'Negate states filter'

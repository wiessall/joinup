services:

  _defaults:
    autoconfigure: true
    autowire: true

  joinup_core.joinup_version:
    class: Drupal\joinup_core\JoinupVersion

  logger.channel.joinup_core:
    parent: logger.channel_base
    arguments: ['joinup_core']

  joinup_core.local_task_links_helper:
    class: Drupal\joinup_core\LocalTaskLinksHelper
  Drupal\joinup_core\LocalTaskLinksHelperInterface: '@joinup_core.local_task_links_helper'

  Drupal\joinup_core\EventSubscriber\OutdatedContentConfigSubscriber: { }

  Drupal\joinup_core\Access\NodeCreationRoutesAccess:
    tags:
      - { name: access_check, applies_to: _node_creation_route }

  path_processor.joinup_core:
    class: Drupal\joinup_core\PathProcessor\IdRedirectUuidProcessor
    tags:
      - { name: path_processor_inbound, priority: 200 }

  path_processor.joinup_core.field_more_in_modal:
    class: Drupal\joinup_core\PathProcessor\ModalRouteProcessor
    calls:
      - [setAliasProcessor, ['@?path_alias.path_processor']]
    tags:
      - { name: path_processor_inbound, priority: 0 }
      - { name: path_processor_outbound, priority: 0 }

  Drupal\joinup_core\EventSubscriber\ExceptionEventSubscriber: { }

  # Prevent errors in twigc by implementing the missing get_dummy_text function,
  # which is referenced in BCL component templates.
  joinup_core.twig_extension:
    class: Drupal\joinup_core\TwigExtension\DummyTextTwigExtension
    tags:
      - { name: twig.extension }

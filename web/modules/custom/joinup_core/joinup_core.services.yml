services:

  joinup_core.joinup_version:
    class: Drupal\joinup_core\JoinupVersion

  logger.channel.joinup_core:
    parent: logger.channel_base
    arguments: ['joinup_core']

  joinup_core.requirements_helper:
    class: Drupal\joinup_core\RequirementsHelper
    arguments: ['@database']

  joinup_core.local_task_links_helper:
    class: Drupal\joinup_core\LocalTaskLinksHelper
    arguments: ['@entity_type.manager', '@theme.manager']

  joinup_core.outdated_content.config.sunscriber:
    class: Drupal\joinup_core\EventSubscriber\OutdatedContentConfigSubscriber
    arguments: ['@entity_field.manager']
    tags:
      - { name: event_subscriber }

  path_processor.joinup_core:
    class: Drupal\joinup_core\PathProcessor\IdRedirectUuidProcessor
    tags:
      - { name: path_processor_inbound, priority: 200 }

  joinup_core.modal_formatter.route_subscriber:
    class: Drupal\joinup_core\EventSubscriber\ModalFormatterRouteSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }

  paramconverter.modal_formatter:
    class: Drupal\joinup_core\ParamConverter\ModalFormatterConverter
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
    tags:
      - { name: paramconverter }

  joinup_core.modal_formatter.access_checker:
    class: Drupal\joinup_core\Access\ModalFormatterAccessCheck
    arguments:
      - '@entity_display.repository'
    tags:
      - { name: access_check, applies_to: _modal_formatter }

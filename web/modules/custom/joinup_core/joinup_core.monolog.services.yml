parameters:

  monolog.channel_handlers:
    default: ['default_handler']
    php: ['php_handler', 'mail', 'telegram']

  monolog.processors:
    - message_placeholder
    - current_user
    - request_uri
    - ip
    - referer
    - error_page_error_uuid

  # These two parameters settings are overridden with values stored in
  # environment variables, in JoinupCoreServiceProvider::alter(), and are here
  # only to provide sane defaults.
  # See \Drupal\joinup_core\JoinupCoreServiceProvider::alter()
  joinup_core.monolog.paths.default_handler: /tmp/drupal/log/default.log
  joinup_core.monolog.paths.php_handler: /tmp/drupal/log/php.log

services:

  monolog.handler.default_handler:
    class: Monolog\Handler\RotatingFileHandler
    # The parameter is set in \Drupal\joinup_core\JoinupCoreServiceProvider
    arguments: ['%joinup_core.monolog.paths.default_handler%', 10, '100']

  monolog.handler.php_handler:
    class: Monolog\Handler\RotatingFileHandler
    # The parameter is set in \Drupal\joinup_core\JoinupCoreServiceProvider
    arguments: ['%joinup_core.monolog.paths.php_handler%', 10, '400']

  monolog.handler.mail:
    class: Drupal\joinup_core\Logger\Handler\MailHandler
    arguments: ['mail', '@state']

  monolog.handler.telegram:
    class: Drupal\joinup_core\Logger\Handler\TelegramHandler
    arguments: ['telegram', '@state', '@lock']
    tags:
      - { name: needs_destruction }

  monolog.processor.error_page_error_uuid:
    class: Drupal\joinup_core\Logger\Processor\ErrorPageErrorUuidProcessor

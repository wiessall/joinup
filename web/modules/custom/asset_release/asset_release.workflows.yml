# The workflow of the release entity.
asset_release_workflow:
  id: asset_release_workflow
  label: "Default"
  group: asset_release
  states:
    draft:
      label: Draft
    needs_update:
      label: Needs update
    published:
      label: Published
    archived:
      label: Archived
      published: true
  transitions:
    draft:
      label: Save as draft
      from: [published]
      to: draft
    validate:
      label: Publish
      from: [draft, needs_update]
      to: published
    request_changes:
      label: Request changes
      from: [published]
      to: needs_update
    archive:
      label: Archive
      from: [ published, needs_update ]
      to: archived
    unarchive:
      label: Unarchive
      from: [ archived ]
      to: published

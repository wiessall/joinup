# Route to create a release that belongs to an rdf_entity.solution
joinup_release.solution_release.add:
  path: 'rdf_entity/{rdf_entity}/release/add'
  defaults:
    _controller: '\Drupal\joinup_release\Controller\ReleaseController::add'
    _title: 'Add Release'
  requirements:
    _custom_access: '\Drupal\joinup_release\Controller\ReleaseController::createReleaseAccess'
    _joinup_group: 'solution'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
      bundle:
        type: 'solution'

# Route to show an overview of releases belonging to a solution.
joinup_release.solution_release.overview:
  path: '/rdf_entity/{rdf_entity}/releases'
  defaults:
    _controller: '\Drupal\joinup_release\Controller\ReleaseController::overview'
    _title_callback: '\Drupal\joinup_release\Controller\ReleaseController::overviewPageTitle'
  requirements:
    _custom_access: '\Drupal\joinup_release\Controller\ReleaseController::overviewAccess'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
      bundle:
        type: 'solution'

contact_form.settings:
  type: config_object
  label: 'Settings related to the contact form.'
  mapping:
    default_recipient:
      label: 'Default recipient'
      type: string
    contact_form_from:
      label: 'Default sender for contact form (except from reports)'
      type: string

field.field_settings.email_contact_form:
  type: mapping
  label: 'Email contact form popup settings'
  mapping:
    include_values:
      type: boolean
      label: 'Display all field values in email body'
    default_message:
      type: string
      label: 'Additional message in email body'

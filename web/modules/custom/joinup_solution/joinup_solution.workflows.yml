# The workflow of the solution entity.
#
# In the following workflow we have added one 'virtual' state called new.
# This state will be used when the entity is being created.
# In order for the state_machine module to ensure that
# there is at least one option for the field, it forces
# the first available state and checks its available transitions.
# Since we are implementing our own permission schema,
# we are removing the default value and we are only allowing our
# desired target states.
# The virtual state allowes to handle the initial values during a node create.
solution_workflow:
  id: solution_workflow
  label: "Solution"
  group: solution
  states:
    __new__:
      label: New
    draft:
      label: Draft
    proposed:
      label: Proposed
    published:
      label: Published
      published: true
    needs_update:
      label: Needs update
    blacklisted:
      label: Blacklisted
    archived:
      label: Archived
      published: true
  transitions:
    draft:
      label: Save as draft
      from: [ __new__, draft, proposed, published, needs_update, blacklisted ]
      to: draft
    propose:
      label: Propose
      from: [ __new__, draft, proposed, published, needs_update, blacklisted ]
      to: proposed
    validate:
      label: Publish
      from: [ __new__, draft, proposed, needs_update, blacklisted ]
      to: published
    # Separate transition as facilitators can update the solution once published
    # But cannot approve proposed changes.
    update_validated:
      label: Publish
      from: [ published ]
      to: published
    needs_update:
      label: Request changes
      from: [ proposed, published ]
      to: needs_update
    blacklist:
      label: Blacklist
      from: [ published ]
      to: blacklisted
    archive:
      label: Archive
      from: [ published ]
      to: archived
    unarchive:
      label: Unarchive
      from: [ archived ]
      to: published

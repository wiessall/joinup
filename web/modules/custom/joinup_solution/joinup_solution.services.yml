services:
  joinup_solution.og_subscriber:
    class: Drupal\joinup_solution\EventSubscriber\SolutionOgSubscriber
    tags:
      - name: event_subscriber
  cache_context.solution_owner:
    class: 'Drupal\joinup_solution\Cache\Context\SolutionOwnerCacheContext'
    arguments: ['@current_user', '@entity_type.manager', '@og.membership_manager', '@database', '@private_key']
    tags:
      - { name: 'cache.context'}
  joinup_solution.fulfillment_guard:
    class: Drupal\joinup_solution\Guard\SolutionTransitionGuard
    arguments: ['@current_user']
    tags:
      # Priority 5 will set it to be executed before the generic guard of the
      # state_machine_permissions module.
      - { name: state_machine.guard, group: solution, priority: 5}
  joinup_solution.requirements_helper:
    class: Drupal\joinup_solution\RequirementsHelper
    arguments: ['@rdf_sync.connection']
  joinup_solution.title_duplicate_helper:
    class: 'Drupal\joinup_solution\SolutionTitleDuplicateHelper'
    arguments: ['@entity_type.manager']
  joinup_solution.group_add_content.subscriber:
    class: Drupal\joinup_solution\EventSubscriber\SolutionGroupSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  joinup_solution.lazy_builders:
    class: Drupal\joinup_solution\SolutionLazyBuilders
    arguments: [ '@entity_type.manager', '@form_builder', '@current_user' ]
  joinup_solution.group_menu_links:
    class: Drupal\joinup_solution\EventSubscriber\SolutionGroupMenuLinksSubscriber
    tags:
      - { name: event_subscriber }
  joinup_solution.post_archive.subscriber:
    class: Drupal\joinup_solution\EventSubscriber\SolutionArchiveEventSubscriber
    arguments:
      - '@queue'
      - '@current_user'
      - '@messenger'
    tags:
      - { name: event_subscriber }
  joinup_solution.interoperable_flag_subscriber:
    class: Drupal\joinup_solution\EventSubscriber\InteroperableFlagSubscriber
    arguments: [ '@search_api.entity_datasource.tracking_manager' ]
    tags:
      - { name: event_subscriber }
  logger.channel.solution:
    parent: logger.channel_base
    arguments:
      - 'solution'

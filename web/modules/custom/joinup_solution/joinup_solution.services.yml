services:

  _defaults:
    autoconfigure: true
    autowire: true

  Drupal\joinup_solution\EventSubscriber\SolutionOgSubscriber: { }

  cache_context.solution_owner:
    class: 'Drupal\joinup_solution\Cache\Context\SolutionOwnerCacheContext'
    arguments: ['@current_user', '@entity_type.manager', '@og.membership_manager', '@database', '@private_key']
    tags:
      - { name: 'cache.context'}

  Drupal\joinup_solution\Guard\SolutionTransitionGuard:
    tags:
      # Priority 5 will set it to be executed before the generic guard of the
      # state_machine_permissions module.
      - { name: state_machine.guard, group: solution, priority: 5}

  joinup_solution.title_duplicate_helper:
    class: Drupal\joinup_solution\SolutionTitleDuplicateHelper
  Drupal\joinup_solution\SolutionTitleDuplicateHelperInterface: '@joinup_solution.title_duplicate_helper'

  Drupal\joinup_solution\EventSubscriber\SolutionGroupSubscriber: {  }

  joinup_solution.lazy_builders:
    class: Drupal\joinup_solution\SolutionLazyBuilders

  Drupal\joinup_solution\EventSubscriber\SolutionGroupMenuLinksSubscriber: { }

  Drupal\joinup_solution\EventSubscriber\SolutionArchiveEventSubscriber: {  }

  Drupal\joinup_solution\EventSubscriber\InteroperableFlagSubscriber: { }

joinup_solution.collection_solution.add:
  path: 'node/{node}/solution/add'
  defaults:
    _controller: '\Drupal\joinup_solution\Controller\SolutionController::add'
    _title: 'Add solution'
  requirements:
    _custom_access: '\Drupal\joinup_solution\Controller\SolutionController::createSolutionAccess'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

joinup_solution.collection_solution.tca:
  path: 'node/{node}/solution/tca'
  defaults:
    _form: '\Drupal\joinup_solution\Form\TcaForm'
    _title: 'Terms of agreement'
  requirements:
    _custom_access: '\Drupal\joinup_solution\Controller\SolutionController::createSolutionAccess'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

joinup_solution.change_collection:
  path: '/node/{node}/change-collection'
  defaults:
    _form: Drupal\joinup_solution\Form\ChangeCollectionForm
    _title: 'Select a destination collection'
  requirements:
    _permission: 'manage solutions'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

joinup_solution.change_state.multiple:
  path: '/node/{node}/manage-solutions/change-state'
  defaults:
    _form: Drupal\joinup_solution\Form\ChangeSolutionStateForm
    _title_callback: Drupal\joinup_solution\Form\ChangeSolutionStateForm::getQuestion
  requirements:
    _permission: 'manage solutions'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

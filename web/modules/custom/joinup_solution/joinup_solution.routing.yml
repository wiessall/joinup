joinup_solution.collection_solution.add:
  path: 'node/{node}/solution/add'
  defaults:
    _controller: '\Drupal\joinup_solution\Controller\SolutionController::add'
    _title: 'Add solution'
  requirements:
    _custom_access: '\Drupal\joinup_solution\Controller\SolutionController::createSolutionAccess'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

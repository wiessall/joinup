parameters:
  sparql_endpoint.ttl: 86400

services:
  logger.channel.sparql_endpoint:
    parent: logger.channel_base
    arguments: [ 'sparql_endpoint' ]

  cache.sparql_endpoint:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [ sparql_endpoint ]

  sparql_endpoint.readonly_endpoint:
    class: Drupal\sparql_endpoint\SparqlReadOnlyEndpoint
    autowire: true

  sparql_endpoint.cached_sparql_endpoint:
    class: Drupal\sparql_endpoint\CachedSparqlReadOnlyEndpoint
    arguments:
      - '@sparql_endpoint.readonly_endpoint'
      - '@cache.sparql_endpoint'
      - '@datetime.time'
      - '%sparql_endpoint.ttl%'

  plugin.manager.sparql_endpoint.sparql_format:
    class: Drupal\sparql_endpoint\SparqlFormatManager
    parent: default_plugin_manager

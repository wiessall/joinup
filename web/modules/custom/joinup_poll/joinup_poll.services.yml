services:

  _defaults:
    autoconfigure: true

  Drupal\joinup_poll\Routing\PollRouteSubscriber: { }

  access_check.joinup_poll.ajax_request:
    class: Drupal\joinup_poll\Access\AjaxRequestAccessCheck
    tags:
      - { name: access_check, applies_to: _ajax_request, needs_incoming_request: TRUE }

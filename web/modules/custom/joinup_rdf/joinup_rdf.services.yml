services:
  joinup_rdf.vocabulary_fixtures.helper:
    class: Drupal\joinup_rdf\VocabularyFixturesHelper
    arguments: ['@sparql.endpoint']
  joinup_rdf.requirements_helper:
    class: Drupal\joinup_rdf\RequirementsHelper
    arguments: ['@sparql.endpoint', '@string_translation']
  # Move this to sparql_entity_storage in ISAICP-7374.
  # See https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-7374
  joinup_rdf.twig_extension:
    class: Drupal\joinup_rdf\TwigExtension\TwigExtension
    arguments: ['@language_manager', '@renderer']
    tags:
      - { name: twig.extension }
  joinup_rdf.decode_rdf_url.param_converter:
    class: Drupal\joinup_rdf\ParamConverter\DecodeRdfUrlConverter
    tags:
      - { name: paramconverter, priority: 10 }
  # TODO: Drop in ISAICP-8376
  joinup_rdf.outbound_value.tid:
    class: Drupal\joinup_rdf\EventSubscriber\UriIdConversion
    arguments: ['@database', '@entity_field.manager']
    tags:
      - { name: event_subscriber }

  joinup_rdf.legacy_rdf_url.subscriber:
    class: Drupal\joinup_rdf\EventSubscriber\LegacyRdfUrlSubscriber
    calls:
      - [setRdfSyncMapper, ['@?rdf_sync.mapper']]
    tags:
      - { name: event_subscriber }

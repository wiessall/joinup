  joinup_rdf.vocabulary_fixtures.helper:
    class: Drupal\joinup_rdf\VocabularyFixturesHelper

  Drupal\joinup_rdf\Hook\JoinupRdfRequirementsHooks:
    arguments:
      $synchronizer: '@rdf_sync.synchronizer'

  # Move in joinup_rdf. See ISAICP-9156.
  Drupal\joinup_rdf\EventSubscriber\LegacyRdfUrlSubscriber: { }

  Drupal\joinup_rdf\Routing\RdfExportRouteSubscriber: { }

  Drupal\joinup_rdf\Middleware\JoinupAcceptHeaderMiddleware:
    tags:
      - { name: http_middleware, priority: 401 }

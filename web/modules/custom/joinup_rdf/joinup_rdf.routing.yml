# TODO: Remove this route in ISAICP-8376.
entity.rdf_entity.rdf_export:
  path: /rdf_entity/{rdf_entity}/export-metadata
  defaults:
    _controller: Drupal\joinup_rdf\Controller\RdfExportController::downloadLinksLegacy
    _title: Export RDF Metadata
  requirements:
    _permission: 'view rdf entity'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - asset_distribution
          - asset_release
          - collection
          - solution

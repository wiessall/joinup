joinup_rdf.vocabulary_importer:
  path: '/joinup-rdf/vocabulary-importer'
  defaults:
    _title: 'Vocabulary Importer'
    _form: 'Drupal\joinup_rdf\Form\VocabularyImporterForm'
  requirements:
    _permission: 'import RDF vocabularies'

joinup_rdf.sparql_query:
  path: '/joinup-rdf/sparql-query'
  defaults:
    _title: 'Sparql Query'
    _form: 'Drupal\joinup_rdf\Form\SparqlQueryForm'
  requirements:
    _permission: 'run direct SPARQL queries'

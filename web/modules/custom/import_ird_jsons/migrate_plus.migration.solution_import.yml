# migrate_plus.migration.ird_solution_import.yml
#
# Universal solution importer for all IRD collections.
# Reads from the normalized JSON produced by IRD lib.
# One migration config, swap the JSON file per collection.
#
# Usage:
#   drush migrate:import ird_solution_import --update
#   drush migrate:rollback ird_solution_import
#
# To import a different collection, change the URL in source.urls
# or override at runtime:
#   drush migrate:import ird_solution_import \
#     --source-url=modules/custom/import_IRD_jsons/sources/dah.json

uuid: 1f7e0c34-bfe8-4e27-ad92-9da9fc404024
langcode: en
status: true
dependencies:
  enforced:
    module:
      - sti_rdf
      - migrate_plus

id: ird_solution_import
migration_tags:
  - IRD
  - solution
migration_group: ird_import_group
label: 'IRD universal solution importer'

# =============================================================================
# SOURCE
# =============================================================================
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json

  urls:
    - modules/custom/import_IRD_jsons/sources/<name>.json

  # ----- Collection-level defaults (read from meta object) -----
  # These are injected as constants so process plugins can reference them.
  # When switching collections, these come from the JSON's meta block.
  # For now they're hardcoded; a custom source plugin could read meta
  # dynamically. See README for the roadmap on that.
  constants:
    # Entity IDs — must exist before import runs
    OG_AUDIENCE_NID: 42
    OWNER_NID: 17
    CONTACT_NID: 17
    # Taxonomy term IDs — fallbacks when source data has no match
    DEFAULT_CLASSIFICATION_TID: 5
    DEFAULT_DOMAIN_TID: 8
    DEFAULT_LANGUAGE_TID: 31
    # Fixed values
    DEFAULT_STATE: draft
    BUNDLE: solution

  item_selector: records

  fields:
    - { name: id,                  label: 'Record ID',         selector: id }
    - { name: title,               label: 'Title',             selector: title }
    - { name: abstract,            label: 'Abstract',          selector: abstract }
    - { name: description,         label: 'Description',       selector: description }
    - { name: date,                label: 'Date',              selector: date }
    - { name: url,                 label: 'Landing page URL',  selector: url }
    - { name: classification_name, label: 'Classification',    selector: classification_name }
    - { name: domain_names,        label: 'Domains',           selector: domain_names }
    - { name: topic_names,         label: 'Topics',            selector: topic_names }
    - { name: language_names,      label: 'Languages',         selector: language_names }
    - { name: owner_name,          label: 'Owner org name',    selector: owner_name }
    - { name: raw_record,          label: 'Original record',   selector: _raw }

  ids:
    id:
      type: string

# =============================================================================
# PROCESS
# =============================================================================
process:

  # --- Gate: skip rows without a title ---
  title:
    plugin: skip_on_empty
    method: row
    message: 'Skipped: no title'
    source: title

  # --- Node bundle (always 'solution') ---
  type:
    plugin: default_value
    default_value: solution

  # --- Moderation state (always draft on import) ---
  field_state:
    plugin: default_value
    source: constants/DEFAULT_STATE
    default_value: draft

  # =========================================================================
  # REQUIRED FIELDS — text
  # =========================================================================

  # Description (text_long, required)
  field_description/value:
    plugin: skip_on_empty
    method: process
    source: description

  field_description/format:
    plugin: default_value
    default_value: full_html

  # =========================================================================
  # REQUIRED FIELDS — entity references with lookup + fallback
  # =========================================================================

  # Topic (entity_reference → taxonomy, cardinality -1, required)
  # If source provides topic_names, generate terms. Otherwise leave empty
  # (some collections won't have topics — consider making this non-required
  # or providing a default).
  field_topic:
    - plugin: skip_on_empty
      method: process
      source: topic_names
    - plugin: sub_process
      process:
        target_id:
          - plugin: entity_generate
            entity_type: taxonomy_term
            bundle_key: vid
            bundle: topic
            value_key: name
            ignore_case: true
            source: value

  # Language (entity_reference → taxonomy, cardinality -1, required)
  _language_lookup:
    - plugin: skip_on_empty
      method: process
      source: language_names
    - plugin: sub_process
      process:
        target_id:
          - plugin: entity_generate
            entity_type: taxonomy_term
            bundle_key: vid
            bundle: language
            value_key: name
            ignore_case: true
            source: value
  field_language:
    - plugin: null_coalesce
      source:
        - '@_language_lookup'
        - constants/DEFAULT_LANGUAGE_TID

  # OG Audience (og_standard_reference, cardinality 1, required)
  # Always the collection this import belongs to.
  field_og_audience:
    plugin: default_value
    source: constants/OG_AUDIENCE_NID
    default_value: 42

  # Owner (entity_reference → node, cardinality 1, required)
  # What organization is affiliated (owner = organization)
  # Try to look up org by name; fall back to collection default.
  _owner_lookup:
    - plugin: skip_on_empty
      method: process
      source: owner_name
    - plugin: entity_lookup
      entity_type: node
      bundle_key: type
      bundle: owner
      value_key: title
      ignore_case: true
  field_owner:
    - plugin: null_coalesce
      source:
        - '@_owner_lookup'
        - constants/OWNER_NID

  # Contact (entity_reference, cardinality -1, required)
  # contact = individual
  # Hardcoded to collection default — contact resolution is a later problem.
  field_contact:
    plugin: default_value
    source: constants/CONTACT_NID
    default_value: 17

  # =========================================================================
  # OPTIONAL FIELDS
  # =========================================================================

  # Landing page URL
  field_landing_page/uri:
    plugin: skip_on_empty
    method: process
    source: url

  # Date
  field_information_resource_date:
    - plugin: skip_on_empty
      method: process
      source: date
    - plugin: format_date
      from_format: 'Y-m-d'
      to_format: 'Y-m-d'

  # =========================================================================
  # PROVENANCE / AUDIT
  # =========================================================================

  # Original record ID from source system
  field_original_internal_id: id

  # Full original record as JSON blob
  field_machine_record:
    plugin: callback
    callable: json_encode
    source: raw_record

  # Last ingestion timestamp (unix)
  _time:
    plugin: callback
    callable: time
    unpack_source: true
    source: {}
  field_last_ingestion_datetime:
    plugin: format_date
    source: '@_time'
    from_format: U
    to_format: U

# =============================================================================
# DESTINATION
# =============================================================================
destination:
  plugin: 'entity:node'
  default_bundle: solution
  # Prevent overwriting manually curated fields on re-import
  overwrite_properties:
    - field_machine_record
    - field_last_ingestion_datetime
    - field_original_internal_id

# =============================================================================
# DEPENDENCIES
# =============================================================================
# Collections and owner orgs must exist before solutions.
# Annotation import runs AFTER this migration.
migration_dependencies:
  required: []
  optional:
    - ird_annotation_import
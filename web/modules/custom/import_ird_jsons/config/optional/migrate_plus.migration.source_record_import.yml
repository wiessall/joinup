langcode: en
status: true
dependencies:
  enforced:
    module:
      - sti_rdf
      - joinup_rdf
      - migrate_plus
id: <ADD ID>
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - IRD
  - solution
migration_group: ird_import_group
label: <SHORT DESCRIPTION>
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls:
    - modules/custom/import_ird_jsons/sources/<file>.json
  constants:
    COLLECTION_SHORT_ID: <SHORT ID OF THE TARGET COLLECTION>
    OWNER_NID: <OWNER OF TYPE ORGANIZATION>
    CONTACT_NID: <HUMAN CONTACT POINT>
    DEFAULT_CLASSIFICATION_TID: <CLASSIFICATION ID> #! Might change
    DEFAULT_DOMAIN_TID: <DOMAIN TID> #! Might change
    DEFAULT_LANGUAGE_TID: <RECORD LANGUAGE TID> #! Might change
    DEFAULT_STATE: draft
    BUNDLE: solution
  item_selector: records
  fields:
    -
      name: id
      label: 'Record ID'
      selector: core_fields/id
    -
      name: title
      label: Title
      selector: core_fields/title
    -
      name: abstract
      label: Abstract
      selector: core_fields/abstract
    -
      name: description
      label: Description
      selector: core_fields/description
    -
      name: date
      label: Date
      selector: core_fields/date
    -
      name: url
      label: 'Landing page URL'
      selector: core_fields/url
    -
      name: classification_name
      label: Classification
      selector: classification_name
    -
      name: domain_names
      label: Domains
      selector: domain_names
    -
      name: topic_names
      label: Topics
      selector: topic_names
    -
      name: language_names
      label: Languages
      selector: language_names
    -
      name: owner_id
      label: 'Owner source ID'
      selector: core_fields/owner_id
    -
      name: claims
      label: Claims
      selector: claims
    -
      name: raw_record
      label: 'Original record'
      selector: _raw
  ids:
    id:
      type: string
process:
  title:
    plugin: skip_on_empty
    method: row
    message: 'Skipped: no title'
    source: title
  type:
    plugin: default_value
    default_value: solution
  field_state:
    plugin: default_value
    default_value: published
  description/value:
    plugin: skip_on_empty
    method: row
    source: description
  description/format:
    plugin: default_value
    default_value: full_html
  topic:
    -
      plugin: skip_on_empty
      method: process
      source: topic_names
    -
      plugin: sub_process
      process:
        target_id:
          plugin: entity_generate
          source: value
          entity_type: taxonomy_term
          bundle_key: vid
          bundle: topic
          value_key: name
          ignore_case: true
  _language_lookup:
    -
      plugin: skip_on_empty
      method: process
      source: language_names
    -
      plugin: sub_process
      process:
        target_id:
          plugin: entity_generate
          source: value
          entity_type: taxonomy_term
          bundle_key: vid
          bundle: language
          value_key: name
          ignore_case: true
  language:
    -
      plugin: null_coalesce
      source:
        - '@_language_lookup'
        - constants/DEFAULT_LANGUAGE_TID
  og_audience:
    - plugin: entity_lookup
      source: constants/COLLECTION_SHORT_ID
      entity_type: node
      bundle_key: type
      bundle: collection
      value_key: short_id
      ignore_case: true
    - plugin: skip_on_empty
      method: row
      message: 'No collection with this short_id'
  owner:
    -
      plugin: null_coalesce
      source:
        - '@_owner_lookup'
        - constants/OWNER_NID
  contact:
    plugin: get
    source: constants/CONTACT_NID
  landing_page/uri:
    plugin: skip_on_empty
    method: process
    source: url
  field_information_resource_date:
    -
      plugin: skip_on_empty
      method: process
      source: date
    -
      plugin: format_date
      from_format: Y-m-d
      to_format: Y-m-d
  field_original_internal_id: id
  field_machine_record:
    plugin: callback
    callable: json_encode
    source: raw_record
  _time:
    plugin: callback
    callable: time
    unpack_source: true
    source: {  }
  field_last_ingestion_datetime:
    plugin: format_date
    source: '@_time'
    from_format: U
    to_format: U
  field_claims:
    source: claims
    plugin: ird_claims
destination:
  plugin: 'entity:node'
  default_bundle: solution
  overwrite_properties:
    - field_machine_record
    - field_last_ingestion_datetime
    - field_original_internal_id
idMap: {  }
migration_dependencies:
  optional:
    - ird_annotation_import
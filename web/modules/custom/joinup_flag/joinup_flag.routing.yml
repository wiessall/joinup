joinup_flag.rdf.action_flag:
  path: '/joinup-flag/flag/{flag}/{entity_id}/{view_mode}'
  defaults:
    _controller: '\Drupal\flag\Controller\ActionLinkController::flag'
  methods: [ POST ]
  requirements:
    _flag_access: 'entity:flag{flag}'
    _format: 'html'
    _csrf_token: 'TRUE'
  options:
    parameters:
      entity_id:
        type: decode_rdf_url

joinup_flag.rdf.action_unflag:
  path: '/joinup-flag/unflag/{flag}/{entity_id}/{view_mode}'
  defaults:
    _controller: '\Drupal\flag\Controller\ActionLinkController::unflag'
  methods: [ POST ]
  requirements:
    _unflag_access: 'entity:flag{flag}'
    _format: 'html'
    _csrf_token: 'TRUE'
  options:
    parameters:
      entity_id:
        type: decode_rdf_url

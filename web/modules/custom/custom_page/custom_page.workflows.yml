custom_page_workflow:
  id: custom_page_workflow
  label: "Default"
  group: custom_page
  states:
    published:
      label: Published
      published: true
    unpublished:
      label: Unpublished
    archived:
      label: Archived
      published: true
  transitions:
    publish:
      label: Publish
      from: [ unpublished ]
      to: published
    unpublish:
      label: Unpublish
      from: [ published ]
      to: unpublished
    archive:
      label: Archive
      from: [ published ]
      to: archived
    unarchive:
      label: Unarchive
      from: [ archived ]
      to: unpublished

custom_page.file_permalink:
  path: '/node/{node}/f/{delta}'
  defaults:
    _title: 'File download'
    _controller: '\Drupal\custom_page\Controller\CustomPageController::fileDownload'
  requirements:
    _permission: 'access content'
    delta: \d+
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - custom_page
custom_landing_page.add:
  path: '/admin/custom-landing-pages/add'
  defaults:
    _entity_form: 'node'
    _title_callback: '\Drupal\node\Controller\NodeController::addPageTitle'
    node_type: 'custom_page'
  requirements:
    _entity_create_access: 'node:{node_type}'
    _permission: 'manage custom landing pages'
  options:
    _node_operation_route: TRUE
    _admin_route: FALSE
    parameters:
      node_type:
        type: entity:node_type
        with_config_overrides: TRUE

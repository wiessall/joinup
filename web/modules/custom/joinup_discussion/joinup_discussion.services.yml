services:

  _defaults:
    autoconfigure: true
    autowire: true

  cache_context.can_invite_to_discussion:
    class: Drupal\joinup_discussion\Cache\CanInviteToDiscussionCacheContext
    tags:
      - { name: cache.context }

  Drupal\joinup_discussion\EventSubscriber\InvitationSubscriber: { }

  Drupal\joinup_discussion\EventSubscriber\SubscribedDiscussionSubscriber: { }

  Drupal\joinup_discussion\EventSubscriber\SubscribedDiscussionCommentSubscriber: { }

  Drupal\joinup_discussion\EventSubscriber\WorkflowTransitionEventSubscriber: { }

  joinup_discussion.discussion_overview.access_checker:
    class: Drupal\joinup_discussion\Access\DiscussionOverviewAccessCheck
    tags:
      - { name: access_check, applies_to: _joinup_discussion_overview }

  Drupal\joinup_discussion\EventSubscriber\DiscussionSearchApiStatusSubscriber:
    arguments: [ '@facets.manager' ]

  Drupal\joinup_discussion\EventSubscriber\SharedContentForDiscussionsSubscriber: { }

services:
  cache_context.collection:
    class: Drupal\joinup_collection\Cache\joinup_collectionCacheContext
    arguments: ['@request_stack']
    tags:
      - { name: cache.context }
  cache_context.collection_owner:
    class: 'Drupal\joinup_collection\Cache\Context\joinup_collectionOwnerCacheContext'
    arguments: ['@current_user', '@entity_type.manager', '@og.membership_manager', '@database', '@private_key']
    tags:
      - { name: 'cache.context'}
  joinup_collection.event_subscriber:
    class: Drupal\joinup_collection\EventSubscriber\joinup_collectionEventSubscriber
    tags:
      - { name: 'event_subscriber' }
  joinup_collection.fulfillment_guard:
    class: Drupal\joinup_collection\Guard\joinup_collectionTransitionGuard
    arguments: [ '@current_user' ]
    tags:
      - { name: state_machine.guard, group: collection }
  joinup_collection.achived_collection.route_subscriber:
    class: Drupal\joinup_collection\Routing\ArchivedCollectionRouteSubscriber
    tags:
      - { name: 'event_subscriber' }
  joinup_collection.achived_collection.access_check:
    class: Drupal\joinup_collection\Access\ArchivedCollectionAccessCheck
    tags:
      - { name: access_check, applies_to: _archived_collection }
  joinup_collection.group_add_content.subscriber:
    class: Drupal\joinup_collection\EventSubscriber\joinup_collectionGroupSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  joinup_collection.group_menu_links:
    class: Drupal\joinup_collection\EventSubscriber\joinup_collectionGroupMenuLinksSubscriber
    tags:
      - { name: event_subscriber }
  joinup_collection.lazy_builders:
    class: Drupal\joinup_collection\joinup_collectionLazyBuilders
    arguments: ['@entity_type.manager', '@form_builder', '@current_user']
  logger.channel.collection:
    parent: logger.channel_base
    arguments: ['collection']

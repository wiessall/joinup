sti_rdf.curate.skos:
  path: '/admin/curate/skos'
  defaults:
    _title: 'Curate Skos'
    _controller: '\Drupal\sti_rdf\Controller\StiRdfController::curate'
  requirements:
    _permission: 'access content'

# Term lists for the SKOS mapper above, with the URIs the graph uses.
sti_rdf.curate.skos.sources:
  path: '/admin/curate/skos/sources'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\MappingTermsController::sources'
  requirements:
    _permission: 'access content'

sti_rdf.curate.skos.terms:
  path: '/admin/curate/skos/terms/{source}'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\MappingTermsController::terms'
  requirements:
    _permission: 'access content'
    source: 'atio|\d+'

# Dynamic per-collection faceted search.
#
# IMPORTANT: if your site already has nodes/aliases at /collection/{slug},
# this route will collide with them. Two options:
#   (a) move this route to e.g. /collection/{collection}/search and link to
#       it from the collection node template, OR
#   (b) keep this path and ensure no node aliases use it (and remove the
#       collection node entity, or move it elsewhere).
sti_rdf.collection_search:
  path: '/collection/{collection}'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\CollectionSearchController::page'
    _title_callback: '\Drupal\sti_rdf\Controller\CollectionSearchController::title'
  requirements:
    _permission: 'access content'

# One-shot rebuild of the annotation_value table from all annotation nodes.
# Hit this once after enabling the module on an existing site, and any time
# you change sti_rdf.settings (e.g. add a new annotation bundle).
sti_rdf.reindex:
  path: '/admin/sti-rdf/reindex'
  defaults:
    _title: 'Rebuild annotation index'
    _controller: '\Drupal\sti_rdf\Controller\CollectionSearchController::reindex'
  requirements:
    _permission: 'administer site configuration'

# P0: instance URIs https://sti-portal.fao.org/id/{type}/{uuid} dereference
# here. The type requirement mirrors \Drupal\sti_rdf\StiUri::TYPES; keep the
# two in step (StiUriTest asserts it).
sti_rdf.id:
  path: '/id/{type}/{uuid}'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\IdResolverController::resolve'
  requirements:
    # Open on purpose: instance URIs must dereference for anyone. The
    # controller checks view access on the resolved entity and answers 404.
    _access: 'TRUE'
    type: 'source-record|innovation|annotation|collection|agent|claim|claim-resolution|claim-verdict|property|concept'
    uuid: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

# P0: the namespace IRIs dereference to their namespace documents.
sti_rdf.ontology.sti:
  path: '/sti'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\OntologyController::document'
    prefix: sti
  requirements:
    # Open on purpose: a namespace document is public by definition.
    _access: 'TRUE'

sti_rdf.ontology.atio:
  path: '/atio'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\OntologyController::document'
    prefix: atio
  requirements:
    # Open on purpose: a namespace document is public by definition.
    _access: 'TRUE'

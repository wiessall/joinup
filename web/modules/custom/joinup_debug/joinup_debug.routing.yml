joinup_rdf.sparql_console:
  path: '/joinup-debug/sparql-console'
  defaults:
    _title: 'Sparql Console'
    _form: 'Drupal\joinup_debug\Form\SparqlConsoleForm'
  requirements:
    _permission: 'joinup debug - access debug pages'

joinup_debug.vocabulary_index:
  path: '/joinup-debug/vocabulary-index'
  defaults:
    _title: 'Vocabulary Index'
    _form: 'Drupal\joinup_debug\Form\VocabularyIndexForm'
  requirements:
    _permission: 'joinup debug - access debug pages'

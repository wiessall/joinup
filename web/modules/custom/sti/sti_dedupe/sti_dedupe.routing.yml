# ATIO curators: every collection's queue, and innovations to reconcile.
sti_dedupe.collections:
  path: '/admin/content/dedupe'
  defaults:
    _controller: '\Drupal\sti_dedupe\Controller\DedupeController::collections'
    _title: 'Import review'
  requirements:
    _permission: 'review sti duplicates'

sti_dedupe.reconcile:
  path: '/admin/content/dedupe/reconcile/{a}/{b}'
  defaults:
    _form: '\Drupal\sti_dedupe\Form\ReconcileForm'
    _title: 'Reconcile ATIO innovations'
  options:
    parameters:
      a:
        type: 'entity:node'
      b:
        type: 'entity:node'
  requirements:
    _permission: 'review sti duplicates'
    a: \d+
    b: \d+

# One collection's queue: its facilitators (OG permission) and ATIO curators.
sti_dedupe.review:
  path: '/node/{node}/duplicates'
  defaults:
    _controller: '\Drupal\sti_dedupe\Controller\DedupeController::review'
    _title_callback: '\Drupal\sti_dedupe\Controller\DedupeController::reviewTitle'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle:
          - collection
  requirements:
    _custom_access: '\Drupal\sti_dedupe\Controller\DedupeController::access'
    node: \d+

sti_dedupe.resolve:
  path: '/node/{node}/duplicates/{solution}/{candidate}'
  defaults:
    _form: '\Drupal\sti_dedupe\Form\ResolveForm'
    _title: 'Review possible duplicate'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle:
          - collection
      solution:
        type: 'entity:node'
      candidate:
        type: 'entity:node'
  requirements:
    _custom_access: '\Drupal\sti_dedupe\Controller\DedupeController::access'
    node: \d+
    solution: \d+
    candidate: \d+

sti_dedupe.settings:
  path: '/admin/config/sti/dedupe'
  defaults:
    _form: '\Drupal\sti_dedupe\Form\SettingsForm'
    _title: 'Duplicate resolution settings'
  requirements:
    _permission: 'administer site configuration'

sti_dedupe.collection_tab:
  path: '/node/{node}/import-review'
  defaults:
    _controller: '\Drupal\sti_dedupe\Controller\DedupeController::reviewNode'
    _title_callback: '\Drupal\sti_dedupe\Controller\DedupeController::reviewNodeTitle'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle:
          - collection
  requirements:
    _permission: 'review sti duplicates'
    node: \d+
services:
  _defaults:
    autowire: false

  logger.channel.sti_dedupe:
    parent: logger.channel_base
    arguments: ['sti_dedupe']

  sti_dedupe.decisions:
    class: Drupal\sti_dedupe\DecisionStore
    arguments: ['@database', '@current_user', '@datetime.time']
  Drupal\sti_dedupe\DecisionStore: '@sti_dedupe.decisions'

  sti_dedupe.candidates:
    class: Drupal\sti_dedupe\CandidateStore
    arguments: ['@database', '@datetime.time']
  Drupal\sti_dedupe\CandidateStore: '@sti_dedupe.candidates'

  sti_dedupe.replacements:
    class: Drupal\sti_dedupe\ReplacementStore
    arguments: ['@database', '@current_user', '@datetime.time']
  Drupal\sti_dedupe\ReplacementStore: '@sti_dedupe.replacements'

  sti_dedupe.innovation_lookup:
    class: Drupal\sti_dedupe\InnovationLookup
    arguments: ['@entity_type.manager', '@entity_field.manager', '@sti_dedupe.replacements']
  Drupal\sti_dedupe\InnovationLookup: '@sti_dedupe.innovation_lookup'

  sti_dedupe.finder:
    class: Drupal\sti_dedupe\DuplicateFinder
    arguments: ['@entity_type.manager', '@config.factory', '@sti_dedupe.decisions', '@logger.factory']

  sti_dedupe.same_as_claims:
    class: Drupal\sti_dedupe\SameAsClaims
    arguments: ['@entity_type.manager', '@entity_field.manager', '@database', '@datetime.time', '@current_user', '@logger.channel.sti_dedupe']
  Drupal\sti_dedupe\SameAsClaims: '@sti_dedupe.same_as_claims'

  sti_dedupe.linker:
    class: Drupal\sti_dedupe\Linker
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@sti_dedupe.decisions'
      - '@sti_dedupe.candidates'
      - '@sti_dedupe.replacements'
      - '@sti_dedupe.innovation_lookup'
      - '@sti_dedupe.same_as_claims'
      - '@current_user'
      - '@logger.channel.sti_dedupe'

  sti_dedupe.replaced_innovation_subscriber:
    class: Drupal\sti_dedupe\EventSubscriber\ReplacedInnovationSubscriber
    arguments: ['@entity.repository', '@sti_dedupe.replacements']
    tags:
      - { name: event_subscriber }

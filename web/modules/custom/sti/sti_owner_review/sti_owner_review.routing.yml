sti_owner_review.ai_review:
  path: '/node/{node}/ai-review'
  defaults:
    _form: '\Drupal\sti_owner_review\Form\OwnerReviewForm'
    _title: 'Review AI proposal'
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: 'entity:node'
  requirements:
    _permission: 'review owner proposals'
    _custom_access: '\Drupal\sti_owner_review\Form\OwnerReviewForm::access'
    node: \d+

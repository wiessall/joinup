services:
  _defaults:
    autowire: false

  logger.channel.sti_owner_review:
    parent: logger.channel_base
    arguments: ['sti_owner_review']

  sti_owner_review.quality_checks:
    class: Drupal\sti_owner_review\QualityChecks
    arguments: ['@entity_type.manager', '@logger.channel.sti_owner_review']
  Drupal\sti_owner_review\QualityChecks: '@sti_owner_review.quality_checks'

  sti_owner_review.record_status:
    class: Drupal\sti_owner_review\RecordStatus
    arguments: ['@entity_type.manager', '@logger.channel.sti_owner_review']
  Drupal\sti_owner_review\RecordStatus: '@sti_owner_review.record_status'

  sti_owner_review.applier:
    class: Drupal\sti_owner_review\ProposalApplier
    arguments: ['@entity_type.manager', '@current_user', '@datetime.time', '@logger.channel.sti_owner_review', '@sti_owner_review.quality_checks', '@sti_owner_review.record_status']
  Drupal\sti_owner_review\ProposalApplier: '@sti_owner_review.applier'

  sti_owner_review.completeness:
    class: Drupal\sti_owner_review\Completeness
    arguments: ['@entity_type.manager', '@sti_owner_review.record_status', '@logger.channel.sti_owner_review']
  Drupal\sti_owner_review\Completeness: '@sti_owner_review.completeness'

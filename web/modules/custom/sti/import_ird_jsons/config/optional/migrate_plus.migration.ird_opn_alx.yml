langcode: en
status: true
dependencies:
  enforced:
    module:
    - sti_rdf
    - joinup_rdf
    - migrate_plus
    - import_ird_jsons
id: ird_opn_alx
migration_tags:
- IRD
- solution
migration_group: ird_import_group
label: 'IRD import: OpenAlex Works'
source:
  plugin: url
  data_fetcher_plugin: file
  data_parser_plugin: json
  urls:
  - modules/custom/import_ird_jsons/sources/open-alex.json
  constants:
    OG_AUDIENCE_NID: '15'
    OWNER_NID: 33
    CONTACT_NID: 34
    DEFAULT_LANGUAGE_TID: 31
    DEFAULT_DOMAIN_TID: 8
    BUNDLE: solution
  item_selector: records
  fields:
  - name: id
    label: Record ID
    selector: core_fields/id
  - name: title
    label: Title
    selector: core_fields/title
  - name: description
    label: Description
    selector: core_fields/description
  - name: date
    label: Date
    selector: core_fields/date
  - name: url
    label: Landing page
    selector: core_fields/url
  - name: claims
    label: Claims
    selector: claims
  - name: raw_record
    label: Original record
    selector: _raw
  ids:
    id:
      type: string
process:
  title:
    plugin: skip_on_empty
    method: row
    message: 'Skipped: no title'
    source: title
  type:
    plugin: default_value
    default_value: solution
  field_state:
    plugin: default_value
    default_value: published
  description/value:
    plugin: skip_on_empty
    method: row
    source: description
  description/format:
    plugin: default_value
    default_value: full_html
  language:
    plugin: default_value
    default_value: 31
  topic:
    plugin: default_value
    default_value: 8
  og_audience:
    plugin: get
    source: constants/OG_AUDIENCE_NID
  owner:
    plugin: get
    source: constants/OWNER_NID
  contact:
    plugin: get
    source: constants/CONTACT_NID
  landing_page/uri:
    plugin: skip_on_empty
    method: process
    source: url
  field_information_resource_date:
  - plugin: skip_on_empty
    method: process
    source: date
  - plugin: callback
    callable: strtotime
  - plugin: skip_on_empty
    method: process
  - plugin: format_date
    from_format: U
    to_format: Y-m-d
  field_original_internal_id: id
  field_machine_record:
    plugin: callback
    callable: json_encode
    source: raw_record
  _time:
    plugin: callback
    callable: time
    unpack_source: true
    source: {}
  field_last_ingestion_datetime:
    plugin: format_date
    source: '@_time'
    from_format: U
    to_format: U
  field_claims:
    plugin: ird_claims
    collection_id: opn-alx
    source: claims
    field_config:
      doi:
        categorical: false
      display_name:
        categorical: false
      publication_year:
        categorical: true
      ids:
        categorical: true
      primary_location:
        categorical: true
      type:
        categorical: true
      type_crossref:
        categorical: true
      indexed_in:
        categorical: true
        separator: '|'
      open_access:
        categorical: true
      authorships:
        categorical: true
        separator: '|'
      institution_assertions:
        categorical: true
        separator: '|'
      countries_distinct_count:
        categorical: true
      institutions_distinct_count:
        categorical: true
      corresponding_author_ids:
        categorical: true
        separator: '|'
      corresponding_institution_ids:
        categorical: true
        separator: '|'
      apc_list:
        categorical: true
      apc_paid:
        categorical: true
      fwci:
        categorical: true
      has_fulltext:
        categorical: true
      cited_by_count:
        categorical: true
      citation_normalized_percentile:
        categorical: true
      cited_by_percentile_year:
        categorical: true
      biblio:
        categorical: true
      is_retracted:
        categorical: true
      is_paratext:
        categorical: true
      primary_topic:
        categorical: true
      topics:
        categorical: false
        separator: '|'
      keywords:
        categorical: false
        separator: '|'
      concepts:
        categorical: false
        separator: '|'
      mesh:
        categorical: true
        separator: '|'
      locations_count:
        categorical: true
      locations:
        categorical: true
        separator: '|'
      best_oa_location:
        categorical: true
      sustainable_development_goals:
        categorical: true
        separator: '|'
      grants:
        categorical: true
        separator: '|'
      datasets:
        categorical: true
        separator: '|'
      versions:
        categorical: true
        separator: '|'
      referenced_works_count:
        categorical: true
      referenced_works:
        categorical: false
        separator: '|'
      related_works:
        categorical: false
        separator: '|'
      abstract_inverted_index:
        categorical: true
      cited_by_api_url:
        categorical: false
      counts_by_year:
        categorical: true
        separator: '|'
      updated_date:
        categorical: false
      created_date:
        categorical: true
      fulltext_origin:
        categorical: true
      language_names:
        categorical: true
        separator: '|'
destination:
  plugin: entity:node
  default_bundle: solution
  overwrite_properties:
  - field_machine_record
  - field_last_ingestion_datetime
  - field_original_internal_id
  - field_claims
migration_dependencies:
  required: []
  optional: []

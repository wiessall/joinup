sti_rdf.settings:
  type: config_object
  label: 'STI RDF settings'
  mapping:
    annotation_types:
      type: sequence
      label: 'Annotation type descriptors'
      sequence:
        type: mapping
        label: 'Descriptor for one annotation bundle'
        mapping:
          target_field:
            type: string
            label: 'Field on the annotation node referencing the entity being annotated'
          collection_static:
            type: string
            label: 'Literal collection_id for every annotation of this bundle'
            nullable: true
          collection_field:
            type: string
            label: 'Entity reference field on the annotation whose target identifies the collection'
            nullable: true
          collection_id_property:
            type: string
            label: 'Property on the referenced collection entity to use as collection_id (defaults to id)'
            nullable: true
          ignored_fields:
            type: sequence
            label: 'Fields on the annotation to skip when extracting EAV rows'
            sequence:
              type: string

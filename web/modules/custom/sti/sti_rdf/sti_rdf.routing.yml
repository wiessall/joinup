# SKOS mappings a collection issues: proposing, and the Turtle export.
sti_rdf.mappings:
  path: '/node/{node}/mappings'
  defaults:
    _form: '\Drupal\sti_rdf\Form\MappingForm'
    _title: 'Mappings'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle: [collection]
  requirements:
    _entity_access: 'node.update'
    node: \d+

# Every collection the user may edit, with proposals waiting and properties
# still unmapped.
sti_rdf.mappings.overview:
  path: '/admin/content/mappings'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\MappingOverviewController::overview'
    _title: 'Mappings'
  requirements:
    # Rows are filtered by update access on each collection.
    _user_is_logged_in: 'TRUE'

sti_rdf.mappings.export:
  path: '/node/{node}/mappings/export'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\MappingExportController::export'
  options:
    parameters:
      node:
        type: 'entity:node'
        bundle: [collection]
  requirements:
    _entity_access: 'node.view'
    node: \d+

# P0: instance URIs https://sti-portal.fao.org/id/{type}/{uuid} dereference
# here. The type requirement mirrors \Drupal\sti_rdf\StiUri::TYPES; keep the
# two in step (StiUriTest asserts it).
sti_rdf.id:
  path: '/id/{type}/{uuid}'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\IdResolverController::resolve'
  requirements:
    # Open on purpose: instance URIs must dereference for anyone. The
    # controller checks view access on the resolved entity and answers 404.
    _access: 'TRUE'
    type: 'source-record|innovation|annotation|collection|agent|claim|property|concept|mapping|contact|licence'
    uuid: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

# P0: the namespace IRIs dereference to their namespace documents.
sti_rdf.ontology.sti:
  path: '/sti'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\OntologyController::document'
    prefix: sti
  requirements:
    # TODO Agree with the team whether or not (and how) they would like to publish this
    _permission: 'administer site configuration'

sti_rdf.ontology.atio:
  path: '/atio'
  defaults:
    _controller: '\Drupal\sti_rdf\Controller\OntologyController::document'
    prefix: atio
  requirements:
    # TODO Agree with the team whether or not (and how) they would like to publish this
    _permission: 'administer site configuration'

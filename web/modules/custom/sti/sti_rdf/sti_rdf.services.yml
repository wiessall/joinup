services:
  sti_rdf.logger:
    parent: logger.channel_base
    arguments: ['sti_rdf']

  sti_rdf.uri_reminter:
    class: Drupal\sti_rdf\Service\UriReminter #? a fix to work with the existing test data. The final mvp should come without data and import working as expected should make this superfluous?
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@database'
      - '@config.factory'
      - '@sti_rdf.logger'

  sti_rdf.sync_reader:
    class: Drupal\sti_rdf\Service\SyncReader
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
  Drupal\sti_rdf\Service\SyncReaderInterface: '@sti_rdf.sync_reader'

  sti_rdf.graph_synchronizer:
    class: Drupal\sti_rdf\Service\GraphSynchronizer #? one-off artifact to quickly re-sync to the triplestore, shouldn't be needed if migrate works as expected?
    arguments:
      - '@entity_type.manager'
      - '@rdf_sync.synchronizer'
      - '@rdf_sync.mapper'
      - '@entity.memory_cache'

  sti_rdf.sync_importer:
    class: Drupal\sti_rdf\Service\SyncImporter
    arguments:
      - '@config.factory'
      - '@config.storage.sync'

  sti_rdf.ontology_document_builder:
    class: Drupal\sti_rdf\Service\OntologyDocumentBuilder #? WHY?
    arguments:
      - '@sti_rdf.sync_reader'
      - '@extension.list.module'

  sti_rdf.mapping_curation:
    class: Drupal\sti_rdf\Service\MappingCuration
    arguments:
      - '@entity_type.manager'
      - '@rdf_sync.mapper'
      - '@current_user'
      - '@sti_rdf.sync_reader'
  Drupal\sti_rdf\Service\MappingCuration: '@sti_rdf.mapping_curation'

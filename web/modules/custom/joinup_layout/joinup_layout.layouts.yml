  default_region: first
  icon_map:
    - [first, second, third]
    - [two_col_footer]
  regions:
    first:
      label: First
    second:
      label: Second
    third:
      label: Third
    two_col_footer:
      label: Two column footer

joinup_layout_twocolfooter_onecol_50_50:

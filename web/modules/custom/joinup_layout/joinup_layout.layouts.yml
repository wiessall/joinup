joinup_layout_group_heading:
  label: 'Joinup group heading'
  path: layouts/group
  template: joinup-layout--group-heading
  category: Joinup
  default_region: main
  icon_map:
    - [main, aside]
    - [left, right, aside]
  regions:
    main:
      label: main
    left:
      label: Left
    right:
      label: Right
    aside:
      label: Aside

joinup_layout_twocol_60_40:
  label: 'Joinup 60/40'
  path: layouts/twocol-60-40
  template: joinup-layout--twocol-60-40
  library: joinup_layout/twocol_60_40
  category: 'Columns: 2'
  default_region: first
  icon_map:
    - [top]
    - [first, second]
    - [bottom]
  regions:
    top:
      label: Top
    first:
      label: First
    second:
      label: Second
    bottom:
      label: Bottom

joinup_layout_twocolfooter_onecol_67_33:

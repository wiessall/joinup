    top_left:
      label: Top left
    top_right:
      label: Top right
    first_left:
      label: First left
    first_right:
      label: First right
    second:
      label: Second
    third_left:
      label: Third left
    third_right:
      label: Third right
    indicator:
      label: Indicator
    aside:
      label: Aside

joinup_layout_four_column_grid:

    - [first, second]
    - [two_col_footer]
  regions:
    first:
      label: First
    second:
      label: Second
    two_col_footer:
      label: Two column footer

joinup_layout_oss_heading:
  label: 'Joinup OSS heading'
  path: layouts/oss-heading
  template: joinup-layout--oss-heading
  library: joinup_layout/oss_heading
  category: Joinup
  default_region: second
  icon_map:
    - [ top_left, top_right, indicator ]
    - [ first_left, first_right, aside ]
    - [ second, second, aside ]

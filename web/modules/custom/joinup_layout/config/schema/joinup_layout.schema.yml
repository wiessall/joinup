layout_plugin.settings.*:
  type: layout_plugin.settings
  mapping:
    custom_id:
      type: string
      label: 'ID'
    custom_classes:
      type: string
      label: 'Class(es)'
    custom_class_choose:
      type: sequence
      nullable: true
      label: 'CSS classes to choose from'
      sequence:
        type: string
        label: 'CSS class'
    custom_styles:
      type: string
      label: 'Styles'
    custom_data_attributes:
      type: string
      label: 'Data-* attributes'
    regions:
      type: sequence
      label: 'Regions'
      sequence:
        type: mapping
        label: 'Region settings'
        mapping:
          region_id:
            type: string
            label: 'ID'
          region_class_choose:
            type: sequence
            nullable: true
            label: 'CSS classes to choose from'
            sequence:
              type: string
              label: 'CSS class'
          region_classes:
            type: string
            label: 'Class(es)'
          region_styles:
            type: string
            label: 'Styles'
          region_data:
            type: string
            label: 'Data-* attributes'

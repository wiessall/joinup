# The workflow of the community content for a pre moderated parent.
node:pre_moderated:
  id: pre_moderated
  label: "Pre moderated"
  group: community_content
  states:
    __new__:
      label: New
    draft:
      label: Draft
    published:
      label: Published
      published: true
    needs_update:
      label: Needs update
    proposed:
      label: Proposed
    deletion_request:
      label: 'Deletion request'
    archived:
      label: Archived
      published: true
  transitions:
    save_as_draft:
      label: 'Save as draft'
      from: [__new__, draft]
      to: draft
    save_new_draft:
      label: 'Save new draft'
      from: [published]
      to: draft
    propose:
      label: 'Propose'
      from: [__new__, draft, proposed ]
      to: proposed
    propose_from_reported:
      label: 'Propose'
      from: [needs_update]
      to: proposed
    publish:
      label: 'Publish'
      from: [__new__, draft, published]
      to: published
    approve_proposed:
      label: 'Publish'
      from: [proposed]
      to: published
    report:
      label: 'Report'
      from: [published]
      to: needs_update
    # In pre-moderated groups, if a facilitator proposes a new revision this
    # transition will be shown as "Request changes". If a content author
    # proposes a new revision then it will be labeled "Propose changes".
    # Here we only need to provide the 'Propose changes' transition since a
    # facilitator is not subject to moderation, and its workflow is
    # automatically set to post-moderated.
    # @see joinup_community_content_workflow_selector()
    propose_new_revision:
      label: 'Propose changes'
      from: [published]
      to: proposed
    request_deletion:
      label: 'Request deletion'
      from: [published]
      to: deletion_request
    reject_deletion:
      label: 'Reject deletion'
      from: [deletion_request]
      to: published
    archive:
      label: Archive
      from: [published]
      to: archived
    unarchive:
      label: Unarchive
      from: [archived]
      to: __new__
# The workflow of the community content for a post moderated parent.
node:post_moderated:
  id: post_moderated
  label: "Post moderated"
  group: community_content
  states:
    __new__:
      label: New
    draft:
      label: Draft
    published:
      label: Published
      published: true
    needs_update:
      label: Needs update
    proposed:
      label: Proposed
    archived:
      label: Archived
      published: true
  transitions:
    save_as_draft:
      label: 'Save as draft'
      from: [__new__, draft]
      to: draft
    save_new_draft:
      label: 'Save new draft'
      from: [published]
      to: draft
    propose_from_reported:
      label: 'Propose'
      from: [proposed, needs_update]
      to: proposed
    publish:
      label: 'Publish'
      from: [__new__, draft, published]
      to: published
    approve_proposed:
      label: 'Publish'
      from: [proposed]
      to: published
    report:
      label: 'Report'
      from: [published]
      to: needs_update
    request_changes:
      label: 'Request changes'
      from: [published]
      to: proposed
    archive:
      label: Archive
      from: [published]
      to: archived
    unarchive:
      label: Unarchive
      from: [archived]
      to: __new__

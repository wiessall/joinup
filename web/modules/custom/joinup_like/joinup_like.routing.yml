joinup_like.rdf.action_link_flag:
  path: '/joinup-like/flag/{flag}/{entity_id}'
  defaults:
    _controller: '\Drupal\flag\Controller\ActionLinkController::flag'
  methods: [ POST ]
  requirements:
    _flag_access: 'entity:flag{flag}'
    _format: 'html'
    _csrf_token: 'TRUE'
  options:
    parameters:
      entity_id:
        type: decode_rdf_url

joinup_like.rdf.action_link_unflag:
  path: '/joinup-like/unflag/{flag}/{entity_id}'
  defaults:
    _controller: '\Drupal\flag\Controller\ActionLinkController::unflag'
  methods: [ POST ]
  requirements:
    _unflag_access: 'entity:flag{flag}'
    _format: 'html'
    _csrf_token: 'TRUE'
  options:
    parameters:
      entity_id:
        type: decode_rdf_url

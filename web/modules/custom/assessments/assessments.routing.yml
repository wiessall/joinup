assessments.api_docs:
  path: '/api/assessments/v1'
  defaults:
    _controller: '\Drupal\assessments\Controller\AssessmentsApiController::apiDocs'
    _title: 'Assessments API Documentation'
  requirements:
    _user_is_logged_in: 'TRUE'

assessments.migration_list:
  path: '/admin/content/assessment/migration'
  defaults:
    _controller: '\Drupal\assessments\Controller\MigrationComparisonController::list'
    _title: 'Migration comparison'
  requirements:
    _permission: 'view assessment migration comparison'
  options:
    _admin_route: TRUE

assessments.migration_compare:
  path: '/admin/content/assessment/migration/{report_id}'
  defaults:
    _controller: '\Drupal\assessments\Controller\MigrationComparisonController::compare'
    _title: 'Compare migration'
  requirements:
    _permission: 'view assessment migration comparison'
    report_id: \d+
  options:
    _admin_route: TRUE

assessments.moderate:
  path: '/collection/assessments/{assessment_type}/{assessment}/moderate'
  defaults:
    _form: '\Drupal\assessments\Form\AssessmentModerationForm'
    _title: 'Moderate'
  requirements:
    _custom_access: '\Drupal\assessments\Form\AssessmentModerationForm::access'
    assessment_type: report
  options:
    parameters:
      assessment_type:
        type: 'entity:assessment_type'
      assessment:
        type: 'entity:assessment'

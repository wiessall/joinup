Valid:
  payload:
    name: "Legislation waste management"
    provider:
      name: "City of Brussels"
      organisation_type: "local_public_sector_body"
      country: "BE"
    relevant_report:
      - "https://example.com/last-year-report"
      - "https://example.com/middle-east"
    binding_requirement:
      - expression:
          - name: "Legal Act 2024"
            description: "Reference to an EU legal expression"
            documented_in: "https://example.com/eli/act"
        description: "Article 5"
        documents:
          - '__base_url__/sites/default/files/assessment-test/requirement1.pdf'
          - '__base_url__/sites/default/files/assessment-test/requirement2.pdf'
        affects:
          - name: "Digital Monitoring Unit"
            thematic_area: "digital_and_innovation_services"
          - name: "Training Centre"
            thematic_area: "education_and_research"
            country:
              - "BE"
              - "IT"
        has_participation:
          - participant_type:
              - "national_public_sector_body"
            country:
              - "BE"
              - "NL"
              - "LU"
          - participant_type:
              - "national_public_sector_body"
              - "private_businesses"
            country:
              - "EU"
        asset:
          - title: "Portal EU"
            description: "An EU portal interoperable solution"
            landing_page: "https://portal.example.eu"
          - "ad882176-8b1d-4506-9e90-886c5802f1c7"
    results_in:
      legal:
        interpretation: "positive"
        judgement: "Legislation is fully aligned with EU directives"
      organisational:
        interpretation: "positive"
        judgement: "Compliant with conditions"
      semantic:
        interpretation: "negative"
        judgement: "Data models require harmonization across systems"
      technical:
        interpretation: "neutral"
        judgement: "Requires follow-up"
    remaining_barriers: "The city has not yet implemented the new regulations."
    documents:
      - '__base_url__/sites/default/files/assessment-test/report.pdf'
    other_comment: "Still work to be done. Waiting for a new iteration."

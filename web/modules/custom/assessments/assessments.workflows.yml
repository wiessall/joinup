default:
  id: assessment_workflow
  label: 'Assessment type default'
  group: assessment
  states:
    draft:
      label: Draft
      published: false
    review:
      label: In Review
      published: false
    published:
      label: Published
      published: true
  transitions:
    save_draft:
      label: Save as Draft
      from: [draft]
      to: draft
    submit_for_review:
      label: Submit for Review
      from: [draft]
      to: review
    approve:
      label: Approve
      from: [review]
      to: published

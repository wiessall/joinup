default:
  id: assessment_workflow
  label: 'Assessments'
  group: assessments
  states:
    draft:
      label: Draft
      published: false
    review:
      label: In Review
      published: false
    published:
      label: Published
      published: true
  transitions:
    submit_for_review:
      label: Submit for Review
      from: [draft]
      to: review
    require_updates:
      label: Require updates
      from: [review]
      to: draft
    publish:
      label: Publish report
      from: [review]
      to: published

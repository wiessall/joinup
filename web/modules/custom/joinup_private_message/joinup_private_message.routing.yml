joinup_private_message.private_message_settings_page:
  path: '/user/messages/settings'
  defaults:
    _form: '\Drupal\joinup_private_message\Form\PrivateMessageSettingsForm'
    _title: 'Private Messages'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: 'FALSE'
joinup_private_message.unblock:
  path: '/user/messages/settings/unblock/{private_message_ban}'
  defaults:
    _form: '\Drupal\joinup_private_message\Form\ConfirmUnblockUserForm'
    _title: 'Unblock user'
  requirements:
    _permission: 'use private messaging system'
  options:
    parameters:
      private_message_ban:
        type: entity:private_message_ban

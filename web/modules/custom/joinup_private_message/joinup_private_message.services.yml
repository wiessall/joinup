    autowire: true

  Drupal\joinup_private_message\EventSubscriber\RequestSubscriber: { }

  Drupal\joinup_private_message\Routing\PrivateMessageRouteSubscriber: { }

  Drupal\joinup_private_message\ParamConverter\BanConverter:

services:
  joinup_workflow.workflow_helper:
    class: Drupal\joinup_workflow\WorkflowHelper
    arguments: ['@current_user', '@account_switcher', '@entity_field.manager', '@og.membership_manager', '@entity_type.manager', '@datetime.time']
  joinup_workflow.workflow_og_subscriber:
    # Provides access and permissions event handling related to the workflows.
    class: Drupal\joinup_workflow\EventSubscriber\WorkflowOgEventSubscriber
    arguments: ['@entity_type.manager', '@current_user', '@og.membership_manager']
    tags:
      - { name: event_subscriber }
  joinup_workflow.state_machine_button_subscriber:
    class: Drupal\joinup_workflow\EventSubscriber\StateMachineButtonsSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }
  joinup_workflow.content_creation_guard:
    class: Drupal\joinup_workflow\Guard\ContentCreationTransitionGuard
    arguments: ['@current_user', '@joinup_workflow.workflow_helper']
    tags:
      - { name: state_machine.guard, group: community_content }

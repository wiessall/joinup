services:

  _defaults:
    autoconfigure: true
    autowire: true

  joinup_workflow.workflow_helper:
    class: Drupal\joinup_workflow\WorkflowHelper
  Drupal\joinup_workflow\WorkflowHelperInterface: '@joinup_workflow.workflow_helper'

  Drupal\joinup_workflow\EventSubscriber\WorkflowOgEventSubscriber: { }
    # Provides access and permissions event handling related to the workflows.

  Drupal\joinup_workflow\EventSubscriber\StateMachineButtonsSubscriber: {}

  joinup_workflow.content_creation_guard:
    class: Drupal\joinup_workflow\Guard\ContentCreationTransitionGuard
    tags:
      - { name: state_machine.guard, group: community_content }

joinup_invite.update_invitation:
  path: 'invitation/{invitation}/{action}/{hash}'
  defaults:
    _form: '\Drupal\joinup_invite\Form\InvitationAcceptanceForm'
    _title: 'Do you accept the invitation?'
  requirements:
    invitation: \d+
    action: '^accept|reject$'
    _custom_access: '\Drupal\joinup_invite\Form\InvitationAcceptanceForm::access'
  options:
    parameters:
      invitation:
        type: entity:invitation

entity.node.members.invite:
  path: '/node/{node}/members/invite'
  defaults:
    _form: '\Drupal\joinup_invite\Form\InviteToGroupForm'
    _title: 'Invite members'
  requirements:
    _og_user_access_group: 'manage members'
    _joinup_group: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
        bundles:
          - collection
          - solution
    _og_entity_type_id: node

# We have special styling for add forms so use "add_member" instead of just "add" to avoid the styling.
# @see: _joinup_is_create_form_route
entity.node.members.add_members:
  path: '/node/{node}/members/add'
  defaults:
    _form: '\Drupal\joinup_invite\Form\AddToGroupForm'
    _title: 'Add members'
  requirements:
    _permission: 'manage group add members'
    _joinup_group: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
        bundles:
          - collection
          - solution
    _og_entity_type_id: node

joinup_invite.user_auto_complete:
  path: 'joinup_invite/user_auto_complete'
  defaults:
    _controller: '\Drupal\joinup_invite\Controller\UserAutoCompleteController::userAutoComplete'
  requirements:
    _permission: 'access user profiles'

services:
  contact_information.email_confirm:
    class: Drupal\contact_information\ContactInformationEmailConfirm
    arguments: ['@entity_type.manager', '@renderer', '@email_confirmer']
  contact_information.redirected_eu_login.subscriber:
    class: Drupal\contact_information\EventSubscriber\ContactInformationRedirectedEuLoginSubscriber
    arguments: ['@datetime.time', '@request_stack', '@entity_type.manager']
    tags:
      - { name: event_subscriber }
  contact_information.contact_form.route_subscriber:
    class: Drupal\contact_information\EventSubscriber\ContactInformationContactFormRouteSubscriber
    tags:
      - { name: event_subscriber }

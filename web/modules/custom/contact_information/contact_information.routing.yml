entity.node.contact:
  path: '/node/{node}/contact'
  defaults:
    _form: \Drupal\contact_information\Form\ContactForm
    _title: 'Contact us'
  requirements:
    _custom_access: \Drupal\contact_information\Form\ContactForm::access
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection
          - solution

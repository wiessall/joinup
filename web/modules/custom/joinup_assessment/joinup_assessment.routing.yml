joinup_assessment.moderation:
  path:  /collection/assessments/assessment-reports/{submission}
  defaults:
    _form: Drupal\joinup_assessment\Form\AssessmentModerationForm
  requirements:
    _custom_access: Drupal\joinup_assessment\Form\AssessmentModerationForm::access
  options:
    parameters:
      submission:
        type: entity:webform_submission
        bundle:
          - assessment

joinup_assessment.edit:
  path: /assessments/questionnaire/{webform_submission}/edit
  defaults:
    _entity_form: 'webform_submission.edit'
    _title_callback: Drupal\webform\Controller\WebformSubmissionViewController::title
  requirements:
    _entity_access: webform_submission.update
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission
        bundle:
          - assessment

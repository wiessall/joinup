joinup_assessment.edit:
  path: /collection/assessments/assessment-reports/questionnaire/{webform_submission}/edit
  defaults:
    _entity_form: 'webform_submission.edit'
    _title_callback: Drupal\webform\Controller\WebformSubmissionViewController::title
  requirements:
    _entity_access: webform_submission.update
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission
        bundle:
          - assessment

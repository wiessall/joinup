# Collection routing definition
entity.node.subscribe:
  path: /node/{node}/subscribe
  defaults:
    _form: \Drupal\joinup_assessment\Form\SubscribeToCollectionForm
    _title_callback: Drupal\joinup_assessment\Form\SubscribeToCollectionForm::title
  requirements:
    _custom_access: \Drupal\joinup_assessment\Form\SubscribeToCollectionForm::access
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection
joinup_assessment.moderation:
  path: /collection/assessments/assessment-reports/questionnaire/{submission}/moderate
  defaults:
    _form: Drupal\joinup_assessment\Form\AssessmentModerationForm
  requirements:
    _custom_access: Drupal\joinup_assessment\Form\AssessmentModerationForm::access
  options:
    parameters:
      submission:
        type: entity:webform_submission
        bundle:
          - assessment

joinup_assessment.edit:
  path: /collection/assessments/assessment-reports/questionnaire/{webform_submission}/edit
  defaults:
    _entity_form: 'webform_submission.edit'
    _title_callback: Drupal\webform\Controller\WebformSubmissionViewController::title
  requirements:
    _entity_access: webform_submission.update
  options:
    parameters:
      webform_submission:
        type: entity:webform_submission
        bundle:
          - assessment

access glossary data export:
  title: 'Access glossary data export'
  description: 'Users granted with this permission are able to access glossary data export.'

access group reports:
  title: 'Access group reports pages of all groups.'
  restrict access: true

administer shared entities:
  title: Administer shared entities

edit short id after publication:
  title: 'Edit Short ID after initial group publication'
  description: 'Allows a user to edit the Short ID of the collection or solution after the initial publication of the entity.'

manage group add members:
  title: 'Add members to groups'
  description: 'Allows to add members to any group.'

manage group announcements:
  title: 'Manage group announcements'
  restrict access: true

permission_callbacks:
  - \Drupal\joinup_group\JoinupGroupPermissions::groupOwnershipPermissions
  - \Drupal\joinup_group\JoinupGroupPermissions::announcementsPermissions

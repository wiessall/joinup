entity.rdf_entity.member_overview:
  path: 'rdf_entity/{rdf_entity}/members'
  defaults:
    _controller: '\Drupal\joinup_group\Controller\GroupMembersController::membersList'
    _title: 'Members'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\GroupMembersController::access
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
    _og_entity_type_id: rdf_entity

joinup_group.authenticate_to_join:
  path: '/rdf_entity/{rdf_entity}/authenticate-to-join'
  defaults:
    _form: '\Drupal\joinup_group\Form\JoinGroupAnonymousRedirectForm'
    _title_callback: '\Drupal\joinup_group\Form\JoinGroupAnonymousRedirectForm::getTitle'
  requirements:
    _user_is_logged_in: 'FALSE'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution

joinup_group.membership_delete_action.confirm:
  path: '/group/delete/membership'
  defaults:
    _form: 'Drupal\joinup_group\Form\DeleteGroupMembershipConfirmForm'
  requirements:
    _custom_access: 'Drupal\joinup_group\Form\DeleteGroupMembershipConfirmForm::access'

joinup_group.membership_permissions_info:
  path: '/rdf_entity/{rdf_entity}/permissions-info'
  defaults:
    _title: 'Member permissions'
    _form: Drupal\joinup_group\Form\GroupMembershipPermissionsInformationForm
  requirements:
    _entity_access: rdf_entity.view
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution

joinup_group.reports:
  path: '/rdf_entity/{rdf_entity}/reports'
  defaults:
    _controller: Drupal\joinup_group\Controller\GroupReportsController::reports
    _title: 'Reports'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\GroupReportsController::access
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
    _og_entity_type_id: rdf_entity

joinup_group.transfer_group_ownership_confirm:
  path: '/group/transfer/ownership'
  defaults:
    _form: 'Drupal\joinup_group\Form\TransferGroupOwnershipConfirmForm'
    _title: Transfer
  requirements:
    _custom_access: 'Drupal\joinup_group\Form\TransferGroupOwnershipConfirmForm::access'

joinup_group.add_content:
  path: /rdf_entity/{rdf_entity}/{node_type}/add
  defaults:
    _controller: Drupal\joinup_group\Controller\GroupNodeController::add
    _title_callback: Drupal\joinup_group\Controller\GroupNodeController::addTitle
  requirements:
    _custom_access: Drupal\joinup_group\Controller\GroupNodeController::createAccess
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
      node_type:
        type: entity:node_type
        with_config_overrides: TRUE

joinup_group.leave_confirm_form:
  path: '/rdf_entity/{rdf_entity}/leave'
  defaults:
    _form: '\Drupal\joinup_group\Form\LeaveGroupConfirmForm'
    _title: 'Leave group'
  requirements:
    _custom_access: '\Drupal\joinup_group\Form\LeaveGroupConfirmForm::access'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution

joinup_group.settings_form:
  path: '/rdf_entity/{rdf_entity}/settings'
  defaults:
    _controller: Drupal\joinup_group\Controller\GroupSettingsController::settings
    _title_callback: Drupal\joinup_group\Controller\GroupSettingsController::title
  requirements:
    _custom_access: Drupal\joinup_group\Controller\GroupSettingsController::access
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution

entity.rdf_entity.announcement_add:
  path: /rdf_entity/{rdf_entity}/announcements/add
  defaults:
    _controller: Drupal\joinup_group\Controller\AnnouncementsController::editForm
    _title: 'Add announcement'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\AnnouncementsController::access
    _og_user_access_group: 'manage group announcements'
    _joinup_group: 'TRUE'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
    _og_entity_type_id: rdf_entity

entity.rdf_entity.announcement_edit:
  path: /rdf_entity/{rdf_entity}/announcements/edit/{announcement}
  defaults:
    _controller: Drupal\joinup_group\Controller\AnnouncementsController::editForm
    _title: 'Edit announcement'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\AnnouncementsController::access
    _og_user_access_group: 'manage group announcements'
    _joinup_group: 'TRUE'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
      announcement:
        type: entity:message
        bundle:
          - announcement
    _og_entity_type_id: rdf_entity

entity.rdf_entity.announcement_view:
  path: /rdf_entity/{rdf_entity}/announcements/view/{announcement}
  defaults:
    _controller: Drupal\joinup_group\Controller\AnnouncementsController::editForm
    _title: 'View announcement'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\AnnouncementsController::accessReadOnly
    _og_user_access_group: 'manage group announcements'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution
      announcement:
        type: entity:message
        bundle:
          - announcement
    _og_entity_type_id: rdf_entity

entity.rdf_entity.unpublished_content:
  path: 'rdf_entity/{rdf_entity}/unpublished'
  defaults:
    _controller: '\Drupal\joinup_group\Controller\UnpublishedContentPageController::unpublishedContent'
    _title: 'Unpublished content'
  requirements:
    _custom_access: Drupal\joinup_group\Controller\UnpublishedContentPageController::access
    _joinup_group: 'TRUE'
  options:
    parameters:
      rdf_entity:
        type: entity:rdf_entity
        bundle:
          - collection
          - solution

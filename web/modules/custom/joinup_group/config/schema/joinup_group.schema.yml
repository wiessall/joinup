action.configuration.joinup_og_membership_delete_action:
  type: action_configuration_default
  label: 'Delete the selected membership(s) config'

action.configuration.joinup_transfer_group_ownership:
  type: action_configuration_default
  label: 'Transfer the ownership of the group to the selected member'

# Schema for the group sidebar menu block settings.
block.settings.group_menu_block:*:
  type: group_menu_block_default
  label: 'Group sidebar menu block settings'

# Default schema for group menu block settings.
group_menu_block_default:
  type: block_settings
  label: 'Og menu block settings'
  mapping:
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'

views.argument.search_api_group:
  type: views.argument.search_api
  label: 'Search API group'

condition.plugin.group_context:
  type: condition.plugin
  label: Group context condition
  mapping:
    limit_to_groups:
      type: sequence
      label: Limit to groups
      sequence:
        type: string
        label: Group ID

views.argument_validator.joinup_group_user_permission:
  type: views.argument_validator.*
  label: Validates user group and site permissions
  mapping:
    group_permission:
      type: string
      nullable: true
      label: Group permission
    site_permission:
      type: string
      nullable: true
      label: Site permission

views.argument_validator.joinup_group:
  type: views.argument_validator.joinup_group_user_permission
  label: Joinup group

views.argument_validator.joinup_group_announcements_enabled:
  type: views.argument_validator.joinup_group_user_permission
  label: Access to group announcements

views.field.joinup_group_announcement_edit_link:
  type: views.field.entity_link
  label: Announcement edit link

views.access.joinup_group_announcements:
  type: mapping
  label: 'Group announcements access'

field.storage_settings.joinup_group_reference_with_timestamp:
  type: field.storage_settings.entity_reference
  label: 'Reference with timestamp field storage settings'

field.field_settings.joinup_group_reference_with_timestamp:
  type: field.field_settings.entity_reference
  label: 'Reference with timestamp field settings'

field.value.joinup_group_reference_with_timestamp:
  type: field.value.entity_reference
  label: 'Default value'
  mapping:
    timestamp:
      type: timestamp
      label: 'Timestamp'

field.formatter.settings.joinup_group_reference_with_timestamp:
  type: field.formatter.settings.entity_reference_label
  label: 'Reference with timestamp field formatter settings'

field.widget.settings.joinup_group_reference_with_timestamp:
  type: field.widget.settings.entity_reference_autocomplete
  label: 'Reference with timestamp field widget settings'

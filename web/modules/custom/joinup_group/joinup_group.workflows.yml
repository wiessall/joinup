announcement:
  id: announcement
  label: "Announcements workflow"
  group: announcement
  states:
    draft:
      label: Draft
    sent:
      label: Sent
    delivered:
      label: Delivered
    rejected:
      label: Rejected
  transitions:
    send:
      label: Send
      from:
        - draft
      to: sent
    approve:
      label: Approve
      from:
        - sent
      to: delivered
    reject:
      label: Reject
      from:
        - sent
      to: rejected
    undo:
      label: Undo
      from:
        - rejected
      to: sent

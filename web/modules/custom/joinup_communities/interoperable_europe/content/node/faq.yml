                                  field_paragraphs_item_content:
                                    -
                                      entity:
                                        _meta:
                                          version: '1.0'
                                          entity_type: paragraph
                                          uuid: 194017a0-3cba-4dbc-b5b1-fe18d834111d
                                          bundle: simple_paragraph
                                          default_langcode: en
                                        default:
                                          status:
                                            -
                                              value: true
                                          created:
                                            -
                                              value: 1663842329
                                          behavior_settings:
                                            -
                                              value: {  }
                                          revision_translation_affected:
                                            -
                                              value: true
                                          field_body:
                                            -
                                              value: "<p>2020 &nbsp;became a pivotal point in the future of the digital agenda of the EU. In February, the European Commission adopted the Communication ‘<a href=\"https://ec.europa.eu/info/sites/info/files/communication-shaping-europes-digital-future-feb2020_en_4.pdf\" target=\"_blank\">Shaping Europe's digital future</a>’ (COM(2020) 67) under the headline ambition ‘Europe fit for the digital age’. &nbsp;The Communication sets out as a key action the development of a ‘reinforced EU governments interoperability strategy’, aiming to foster coordination and the adoption of common standards for public services and data flows. Throughout the rest of the year, the need for action in the field of interoperability has become even more prominent as a result of the COVID-19 crisis.&nbsp;</p>\r\n\r\n<p>Against this background, the Commission has launched the evaluation of the&nbsp;<a href=\"https://ec.europa.eu/isa2/isa2_en\" target=\"_blank\">ISA²&nbsp;programme</a>&nbsp;and that of the&nbsp;<a href=\"https://ec.europa.eu/isa2/eif_en\" target=\"_blank\">European Interoperability Framework</a>&nbsp;(EIF,&nbsp;<a href=\"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=COM:2017:134:FIN\" target=\"_blank\">COM (2017) 134</a>), as well as an impact assessment for a future public sector interoperability strategy for the EU. &nbsp;</p>\r\n\r\n<p>As the ISA²&nbsp;programme is coming to an end in December 2020, its final evaluation is a legal obligation stemming from the&nbsp;<a href=\"https://eur-lex.europa.eu/eli/dec/2015/2240/oj\" target=\"_blank\">ISA²&nbsp;Decision</a>&nbsp;establishing the programme. Three years having passed since the adoption of the new EIF, now is also the right time to look back and take stock of the achievements of the EIF in the past years. Together, the evaluations aim to provide timely input for shaping up a new strategy to enhance the interoperability of public services in the EU, taking into account the needs of stakeholders as well as the role of emerging technologies.&nbsp;</p>\r\n\r\n<p>The initiative has been included in the <a href=\"https://ec.europa.eu/info/publications/2022-commission-work-programme-key-documents_en\">Commission Work Programme for 2022</a>.</p>\r\n"
                                              format: content_editor
                                  field_paragraphs_item_label:
                                    -
                                      value: 'What is this initiative about? '
                            -
                              entity:
                                _meta:
                                  version: '1.0'
                                  entity_type: paragraph
                                  uuid: 2ac48494-7a04-4467-a870-98d2358ac4ee
                                  bundle: accordion_item
                                  default_langcode: en
                                default:

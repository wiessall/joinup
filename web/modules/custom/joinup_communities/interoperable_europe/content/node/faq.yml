                                  field_paragraphs_item_content:
                                    -
                                      entity:
                                        _meta:
                                          version: '1.0'
                                          entity_type: paragraph
                                          uuid: bab52a00-4d3c-44c5-8364-2e4e958b8d2b
                                          bundle: simple_paragraph
                                          default_langcode: en
                                        default:
                                          status:
                                            -
                                              value: true
                                          created:
                                            -
                                              value: 1663842356
                                          behavior_settings:
                                            -
                                              value: {  }
                                          revision_translation_affected:
                                            -
                                              value: true
                                          field_body:
                                            -
                                              value: "<p>Interoperability is about working together towards a common goal. We believe that the future policy should be co-created with the stakeholders.&nbsp;</p>\r\n\r\n<p><img alt=\"Roadmap of Interoperable Europe\" data-entity-type=\"file\" data-entity-uuid=\"6a35d461-0d99-4657-84fe-1a252a751250\" data-image-style=\"\" src=\"/web/sites/default/files/inline-images/path22_0.png\" /></p>\r\n\r\n<p>A number of consultation activities were&nbsp;carried out, in line with the Commission’s&nbsp;<a href=\"https://ec.europa.eu/info/law/law-making-process/planning-and-proposing-law/better-regulation-why-and-how/better-regulation-guidelines-and-toolbox_en\" target=\"_blank\">Better Regulation agenda</a>. These activities included:</p>\r\n\r\n<ul>\r\n\t<li>several workshops,&nbsp;</li>\r\n\t<li>targeted interviews with stakeholders in the interoperability field,&nbsp;</li>\r\n\t<li>a targeted online survey and</li>\r\n\t<li>a public consultation on the&nbsp;<a href=\"https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/12579-European-Interoperability-Framework-EIF-evaluation-and-EU-governments-interoperability-strategy\" target=\"_blank\">Have your say portal</a>.</li>\r\n</ul>\r\n\r\n<p>We continue discussing the policies in the different events, while we are consolidating it with the other European Commission services to present a proposal before summer 2022.&nbsp;</p>\r\n"
                                              format: content_editor
                                  field_paragraphs_item_label:
                                    -
                                      value: 'I want to be a contributor. Can I contribute to the initiative? '

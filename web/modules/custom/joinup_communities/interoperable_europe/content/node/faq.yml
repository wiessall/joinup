                                          field_body:
                                            -
                                              value: "<p>Interoperable Europe is the initiative of the <strong>European Commission</strong> for a reinforced interoperability policy in the public sector. It is committed to introducing a new cooperative Interoperability policy for Europe that will transform the public administrations and help them in their digital transformation. The initiative is supported by the Digital Europe programme. It continues and expands the mission of the now completed <a href=\"https://ec.europa.eu/isa2/home_en/\">ISA² programme</a>.</p>\r\n"
                                              format: content_editor
                                  field_paragraphs_item_label:
                                    -
                                      value: 'What is Interoperable Europe?'
                            -
                              entity:
                                _meta:
                                  version: '1.0'

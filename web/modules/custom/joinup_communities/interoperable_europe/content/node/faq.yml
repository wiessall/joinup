                                          field_body:
                                            -
                                              value: "<p>If you are interested in public sector interoperability, this is the place to be. On this page you can explore useful information about the progress of the new interoperability policy, initiatives that are supporting the digitalisation of the EU public administrations, best practices related to interoperability, news, events, and more. In addition, Joinup, the European Commission’s one-stop shop for E-Government, is only one click away.</p>\r\n"
                                              format: content_editor
                                  field_paragraphs_item_label:
                                    -
                                      value: 'Interoperable Europe is the initiative of the European Commission for a reinforced interoperability policy in the public sector. What can you find here?'
                            -
                              entity:
                                _meta:
                                  version: '1.0'
                                  entity_type: paragraph
                                  uuid: 23d848bf-c675-4b31-a342-80c05fd86afa
                                  bundle: accordion_item
                                  default_langcode: en
                                default:
                                  status:

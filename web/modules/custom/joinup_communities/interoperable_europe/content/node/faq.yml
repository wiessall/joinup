                                  field_paragraphs_item_content:
                                    -
                                      entity:
                                        _meta:
                                          version: '1.0'
                                          entity_type: paragraph
                                          uuid: 07d1273b-a107-4d09-98db-be16dac09705
                                          bundle: simple_paragraph
                                          default_langcode: en
                                        default:
                                          status:
                                            -
                                              value: true
                                          created:
                                            -
                                              value: 1663842341
                                          behavior_settings:
                                            -
                                              value: {  }
                                          revision_translation_affected:
                                            -
                                              value: true
                                          field_body:
                                            -
                                              value: "<p>Yes, the Centre for European Policy Studies (<a href=\"http://www.ceps.eu/\" target=\"_blank\">CEPS</a>) has conducted three independent studies for&nbsp;<strong>DG DIGIT</strong>&nbsp;of the&nbsp;<strong>European Commission</strong>&nbsp;to support the evaluations of the ISA²&nbsp;programme and the EIF, as well as the impact assessment. The studies have the following objectives: &nbsp;</p>\r\n\r\n<ul>\r\n\t<li><strong>Evaluating the implementation of the ISA²&nbsp;programme,&nbsp;</strong>now public&nbsp;<a href=\"https://ec.europa.eu/isa2/news/study-supporting-final-evaluation-isa%C2%B2-programme-now-available_en\" target=\"_blank\">here</a>,</li>\r\n\t<li><strong>Evaluating the implementation of the EIF&nbsp;</strong>by assessing the set of non-binding rules put forward in the EIF and focusing on five evaluation criteria: effectiveness, efficiency, relevance, coherence and EU added value; now public&nbsp;<a href=\"https://op.europa.eu/en/publication-detail/-/publication/a47f8f6f-4694-11ec-89db-01aa75ed71a1/language-en/format-PDF/source-search\" target=\"_blank\">here</a>,and&nbsp;</li>\r\n\t<li><strong>Defining policy options</strong>&nbsp;for a new interoperability strategy and&nbsp;<strong>assessing their impacts</strong>&nbsp;on specific stakeholder groups and on the functioning of the Single Market, now public&nbsp;<a href=\"https://op.europa.eu/en/publication-detail/-/publication/29d694d4-4696-11ec-89db-01aa75ed71a1/language-en/format-PDF/source-search\" target=\"_blank\">here</a>,.&nbsp;</li>\r\n</ul>\r\n\r\n<p>At the same time the&nbsp;<a href=\"https://ec.europa.eu/transparency/expert-groups-register/screen/expert-groups/consult?lang=en&amp;groupID=3714\">Expert Group on interoperability of European public services</a>&nbsp;- with representatives from all EU member states and observatory countries - was involved in a fruitful co-creation procedure. The Expert Group has issued very clear <a href=\"https://ec.europa.eu/transparency/expert-groups-register/core/api/front/expertGroupAddtitionalInfo/43164/download\">policy recommendations for the next European interoperability policy</a>&nbsp; that together with the supporting studies guide the way towards a future interoperability policy based on stakeholders needs'.</p>\r\n"
                                              format: content_editor
                                  field_paragraphs_item_label:
                                    -
                                      value: 'Will there be an independent study and expert advice? '
                            -
                              entity:
                                _meta:
                                  version: '1.0'
                                  entity_type: paragraph
                                  uuid: c30ebe29-5d70-4bff-b661-4a2502416b28
                                  bundle: accordion_item
                                  default_langcode: en
                                default:
                                  status:

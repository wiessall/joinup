# See \Drupal\Tests\eu_oss_catalogue\Kernel\TranslationTest::testOssSolutionLanguage()

cases:

  No language in publiccode.yml:
    publiccodeYml: {  }
    langcode: en

  No valid language in publiccode.yml:
    publiccodeYml:
      description:
        ja:
          longDescription: 'いいね'
        th:
          longDescription: 'เย็น'
    langcode: en
    # Update by removing Thai language and adding Korean.
    publiccodeYmlUpdated:
      description:
        ja:
          longDescription: 'いいね'
        ko:
          longDescription: '시원한'
    langcodeUpdated: en

  Only one language in publiccode.yml:
    publiccodeYml:
      description:
        it:
          longDescription: 'baz'
    langcode: it
    # Update by removing Italian language and adding German.
    publiccodeYmlUpdated:
      description:
        de:
          longDescription: 'baz'
    langcodeUpdated: de

  Two languages with equal richness:
    publiccodeYml:
      description:
        it:
          longDescription: 'baz'
        en:
          longDescription: 'baz'
    langcode: it
    # Revert the language order.
    publiccodeYmlUpdated:
      description:
        en:
          longDescription: 'baz'
        it:
          longDescription: 'baz'
    langcodeUpdated: en

  The richest language wins:
    publiccodeYml:
      description:
        ro:
          longDescription: 'baz'
        it:
          longDescription: 'baz'
          features:
            - qux
    langcode: it
    # Update by making Romanian language richer.
    publiccodeYmlUpdated:
      description:
        ro:
          longDescription: 'baz'
          features:
            - more
            - features
            - here
        it:
          longDescription: 'baz'
          features:
            - qux
    langcodeUpdated: ro

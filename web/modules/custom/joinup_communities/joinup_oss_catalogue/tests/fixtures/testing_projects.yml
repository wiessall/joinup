# See \Drupal\Tests\eu_oss_catalogue\Kernel\TranslationTest::testOssSolutionLanguage()

cases:
  # No language in publiccode.yml
  - publiccodeYml: {  }
    langcode: en
  # Only one language in publiccode.yml.
  - publiccodeYml:
      description:
        it:
          longDescription: 'baz'
    langcode: it
  # Two languages with equal richness.
  - publiccodeYml:
      description:
        it:
          longDescription: 'baz'
        en:
          longDescription: 'baz'
    langcode: it
  # Same but reverted.
  - publiccodeYml:
      description:
        en:
          longDescription: 'baz'
        it:
          longDescription: 'baz'
    langcode: en
  # Italian is richer than English.
  - publiccodeYml:
      description:
        en:
          longDescription: 'baz'
        it:
          longDescription: 'baz'
          features:
            - qux
    langcode: it

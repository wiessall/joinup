                              value: true
                          field_body:
                            -
                              value: "<p>Projects are selected for inclusion in the Open Source Catalogue based on several criteria, including their relevance, popularity, community support, active development, licensing, and adherence to open source principles. The initiative aims to feature a diverse range of high-quality open source projects across different domains and technologies.</p>\r\n"
                              format: content_editor
                  field_paragraphs_item_label:
                    -
                      value: 'How are projects selected for inclusion in the Open Source Catalogue?'

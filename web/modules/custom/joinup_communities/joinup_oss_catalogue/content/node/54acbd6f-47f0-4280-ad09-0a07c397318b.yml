                          field_body:
                            -
                              value: "<p>You can contribute to the Open Source Catalogue initiative by suggesting open source projects to be included in the catalogue. Additionally, you can assist in reviewing and organizing existing projects, providing documentation, improving project descriptions, or helping maintain and update the catalogue.</p>\r\n"
                              format: content_editor
                  field_paragraphs_item_label:
                    -
                      value: 'How can I contribute to the Open Source Catalogue initiative?'

                          field_body:
                            -
                              value: "<p>An Open Source Catalogue serves as a valuable resource for developers, organizations, and individuals seeking open source solutions for various purposes. It simplifies the process of discovering and evaluating open source projects, ultimately encouraging the adoption of open source software, which can lead to cost-effective, efficient, and collaborative solutions.</p>\r\n"
                              format: content_editor
                  field_paragraphs_item_label:
                    -
                      value: 'Why is an Open Source Catalogue important?'

services:

  _defaults:
    autowire: true
    autoconfigure: true

  Drupal\joinup_oss_catalogue\Access\OssAccessCheck:
    tags:
      - { name: access_check, applies_to: _oss_access_check }

  Drupal\joinup_oss_catalogue\OssRouteSubscriber: { }

  Drupal\joinup_oss_catalogue\JoinupOssCatalogueImagecacheWarmer: {  }

  Drupal\joinup_oss_catalogue\CatalogueSourceProcessor: { }

  Drupal\joinup_oss_catalogue\ParamConverter\CatalogueSourceConverter:
    tags:
      - { name: paramconverter }

  logger.channel.joinup_oss_catalogue:
    parent: logger.channel_base
    arguments: ['joinup_oss_catalogue']

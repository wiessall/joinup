services:

  _defaults:
    autowire: true
    autoconfigure: true

  Drupal\joinup_oss_catalogue\Access\OssAccessCheck:
    tags:
      - { name: access_check, applies_to: _oss_access_check }

  Drupal\joinup_oss_catalogue\OssRouteSubscriber: { }

  joinup_oss_catalogue.oss_solution.imagecache_warmer:
    class: Drupal\joinup_oss_catalogue\JoinupOssCatalogueImagecacheWarmer

  Drupal\joinup_oss_catalogue\ParamConverter\CatalogueSourceConverter:
    tags:
      - { name: paramconverter }

  # TODO: Remove this service in ISAICP-9053.
  Drupal\joinup_oss_catalogue\Access\KillSwitchCheck:
    tags:
      - { name: access_check, applies_to: _eu_oss_catalogue_check_enabled }

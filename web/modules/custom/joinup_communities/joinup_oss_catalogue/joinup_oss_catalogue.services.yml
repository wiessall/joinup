services:
  _defaults:
    autowire: true

  monolog.handler.eu_oss_catalogue:
    class: Drupal\joinup_oss_catalogue\Logger\Handler\EuOssCatalogueHandler
    arguments: ['@entity_type.manager', 100, TRUE]
    tags:
      - { name: needs_destruction }
  joinup_oss_catalogue.access_checker:
    class: Drupal\joinup_oss_catalogue\Access\OssAccessCheck
    tags:
      - { name: access_check, applies_to: _oss_access_check }
  joinup_oss_catalogue.route_subscriber:
    class: Drupal\joinup_oss_catalogue\OssRouteSubscriber
    tags:
      - { name: event_subscriber }

  joinup_oss_catalogue.oss_solution.imagecache_warmer:
    class: Drupal\joinup_oss_catalogue\JoinupOssCatalogueImagecacheWarmer
    arguments:
      - '@queue'

  joinup_oss_catalogue.killswitch_check:
    class: Drupal\joinup_oss_catalogue\Access\KillSwitchCheck
    tags:
      - { name: access_check, applies_to: _eu_oss_catalogue_check_enabled }

condition.plugin.eif_solutions_page:
  type: condition.plugin
  label: 'EIF Solutions condition plugin'
  mapping:
    eif_solutions:
      type: boolean
      label: 'EIF Solution'

eif.eif_wrapper_type.*:
  type: config_entity
  label: 'EIF Wrapper type'
  mapping:
    id:
      type: string
      label: 'Machine-readable name'
    label:
      type: label
      label: 'Label'

field.storage_settings.eif_qualified_recommendation:
  type: field.storage_settings.entity_reference
  label: 'EIF qualified recommendation'
field.field_settings.eif_qualified_recommendation:
  type: field.field_settings.entity_reference
  label: 'EIF qualified recommendation'
  mapping:
    allowed_formats:
      type: sequence
      label: 'Allowed text formats'
      sequence:
        type: string
field.widget.settings.eif_qualified_recommendation:
  type: field.widget.settings.text_textarea
  label: 'EIF qualified recommendation select'

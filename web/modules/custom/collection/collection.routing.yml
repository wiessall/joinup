# Collection routing definition
entity.node.subscribe:
  path: /node/{node}/subscribe
  defaults:
    _form: \Drupal\collection\Form\SubscribeToCollectionForm
    _title_callback: Drupal\collection\Form\SubscribeToCollectionForm::title
  requirements:
    _custom_access: \Drupal\collection\Form\SubscribeToCollectionForm::access
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection
entity.node.glossary:
  path: /node/{node}/glossary/{letter}
  defaults:
    _controller: Drupal\collection\Controller\GlossaryController::glossary
    _title_callback: Drupal\collection\Controller\GlossaryController::title
    letter: null
  requirements:
    _custom_access: Drupal\collection\Controller\GlossaryController::access
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection
collection.code_of_conduct_consent:
  path: '/node/{node}/code-of-conduct-consent'
  defaults:
    _form: '\Drupal\collection\Form\CodeOfConductConsentForm'
    _title: 'Important information'
  requirements:
    _custom_access: '\Drupal\collection\Form\CodeOfConductConsentForm::access'
    _user_is_logged_in: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - collection

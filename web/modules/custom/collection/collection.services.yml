services:

  _defaults:
    autoconfigure: true
    autowire: true

  cache_context.collection:
    class: Drupal\collection\Cache\CollectionCacheContext
    tags:
      - { name: cache.context }

  cache_context.collection_owner:
    class: Drupal\collection\Cache\Context\CollectionOwnerCacheContext
    arguments: ['@current_user', '@entity_type.manager', '@og.membership_manager', '@database', '@private_key']
    tags:
      - { name: 'cache.context'}

  Drupal\collection\EventSubscriber\CollectionEventSubscriber: { }

  Drupal\collection\EventSubscriber\CollectionRedirectSubscriber: { }

  Drupal\collection\Guard\CollectionTransitionGuard:
    tags:
      - { name: state_machine.guard, group: collection }

  Drupal\collection\EventSubscriber\CollectionGroupSubscriber: { }

  Drupal\collection\EventSubscriber\CollectionGroupMenuLinksSubscriber: { }

  joinup_collection.lazy_builders:
    class: Drupal\collection\CollectionLazyBuilders

  logger.channel.collection:
    parent: logger.channel_base
    arguments: ['collection']

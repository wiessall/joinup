collection_workflow:
  id: collection_workflow
  label: "Collection"
  group: collection
  states:
    # @todo Remove the __new__ state.
    __new__:
      label: New
    draft:
      label: Draft
      published: false
    proposed:
      label: Proposed
      published: false
    published:
      label: Published
      published: true
    archival_request:
      label: Request archival
      published: true
    archived:
      label: Archived
      published: true
  transitions:
    draft:
      label: Save as draft
      from: [__new__, draft, proposed, published]
      to: draft
    propose:
      label: Propose
      from: [__new__, draft, proposed, published]
      to: proposed
    validate:
      label: Publish
      from: [__new__, draft, proposed, archival_request]
      to: published
    update_published:
      label: Publish
      from: [published]
      to: published
    request_archival:
      label: Request archival
      from: [published]
      to: archival_request
    archive:
      label: Archive
      from: [archival_request]
      to: archived

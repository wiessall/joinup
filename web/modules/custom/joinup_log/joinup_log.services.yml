services:
  monolog.handler.business_handler:
    class: Drupal\joinup_log\Logger\Handler\BusinessHandler
    arguments: [ '@entity_type.manager', '@joinup_group.group_manager', '@logger.log_message_parser' ]
    tags:
      - { name: needs_destruction }
  joinup_log.actions_log_group_report:
    class: Drupal\joinup_log\EventSubscriber\ActionsLogGroupReportSubscriber
    tags:
      - { name: event_subscriber }

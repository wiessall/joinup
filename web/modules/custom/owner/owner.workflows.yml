# The workflow of the owner entity.
owner_workflow:
  id: owner_workflow
  label: "Default"
  group: owner
  states:
    # The state used as initial.
    __new__:
      label: New
    # State used to flag content that is being reviewed.
    needs_update:
      label: Needs update
    published:
      label: Published
      published: true
    deletion_request:
      label: Deletion request
  transitions:
    validate:
      label: Publish
      from: [__new__, deletion_request]
      to: published
    request_changes:
      label: Request changes
      from: [published]
      to: needs_update
    approve_changes:
      label: Approve changes
      from: [needs_update]
      to: published
    request_deletion:
      label: Request deletion
      from: [published]
      to: deletion_request

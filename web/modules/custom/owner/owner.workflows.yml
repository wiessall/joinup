# The workflow of the owner entity.
owner_workflow:
  id: owner_workflow
  label: "Owner"
  group: owner
  states:
    # State used to flag content that is being reviewed.
    needs_update:
      label: Needs update
    published:
      label: Published
      published: true
    deletion_request:
      label: Deletion request
  transitions:
    validate:
      label: Publish
      from: [deletion_request, published]
      to: published
    request_changes:
      label: Request changes
      from: [published]
      to: needs_update
    approve_changes:
      label: Approve changes
      from: [needs_update]
      to: published
    request_deletion:
      label: Request deletion
      from: [published]
      to: deletion_request
    update_needs_changes:
      label: Update
      from: [needs_update]
      to: needs_update
    retract_deletion_request:
      label: Retract deletion request
      from: [deletion_request]
      to: published

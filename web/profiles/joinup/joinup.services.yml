services:
  _defaults:
    autoconfigure: true
  cache_context.community_content_author:
    class: 'Drupal\joinup\Cache\Context\CommunityContentAuthorCacheContext'
    arguments: ['@current_user', '@entity_type.manager']
    tags:
      - { name: 'cache.context'}
  Drupal\joinup\Routing\RouteSubscriber: { }
  joinup.node_creation_routes.access:
    class: Drupal\joinup\Access\NodeCreationRoutesAccess
    tags:
      - { name: access_check, applies_to: _node_creation_route }

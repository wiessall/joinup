# The route definition of the Collection propose form is located in the Joinup
# profile rather than in the Collection module to avoid a circular dependency.
# This route depends on the JoinupController, but Joinup already depends on the
# Collection module.
node.propose_form:
  path: '/propose/{node_type}'
  defaults:
    _controller: '\Drupal\joinup\Controller\JoinupController::proposeEntity'
    _title: 'Propose an node entity'
  requirements:
    _custom_access: '\Drupal\joinup\Controller\JoinupController::createAccess'
  options:
    parameters:
      node_type:
        type: entity:node_type
        with_config_overrides: TRUE

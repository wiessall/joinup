openapi: 3.0.3
info:
  title: Assessments API
  description: API for submitting assessment statements and related entities in Joinup.
  version: 1.0.0
servers:
  - url: https://{host}
    variables:
      host:
        default: example.com
paths:
  /assessments/compose:
    post:
      summary: Create an assessment with nested entities
      description: Creates an assessment together with referenced organization, requirement, statements and optional participants, agents, expressions. Transactional operation. Always creates new entities; does not reuse existing ones even if UUIDs are provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentComposeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentComposeResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
components:
  schemas:
    AssessmentStatement:
      type: object
      properties:
        name:
          type: string
          description: Title of the statement
        description:
          type: string
          description: Body text of the statement
        status:
          type: boolean
          example: true
        services:
          type: array
          description: Optional services affected/related to this statement.
          items:
            $ref: '#/components/schemas/Service'
        uuid:
          type: string
          format: uuid
          description: If provided and exists, the statement will be updated (upsert).
      required:
        - name
    PublicOrganization:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        classification:
          type: string
          enum: [government, non_profit, private_sector, other]
        status:
          type: boolean
        uuid:
          type: string
          format: uuid
      required:
        - label
    BindingRequirement:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        status:
          type: boolean
        participant:
          type: array
          description: Participant(s) involved in the requirement. Each can include nested agents.
          items:
            $ref: '#/components/schemas/Participant'
        has_participation:
          type: array
          description: Affected service(s) for this requirement.
          items:
            $ref: '#/components/schemas/Service'
        assets:
          type: array
          description: Optional assets related to this binding requirement.
          items:
            $ref: '#/components/schemas/Asset'
        uuid:
          type: string
          format: uuid
      required:
        - label
    Asset:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        description:
          type: string
        identifier:
          type: string
        asset_type:
          type: string
          enum: [software, dataset, specification, service, other]
        asset_uri:
          type: string
          format: uri
        uuid:
          type: string
          format: uuid
      required:
        - label
    GenericChild:
      type: object
      description: Generic shape for participants, services, agents, expressions. Accepts free-form fields per entity type.
      additionalProperties: true
      properties:
        uuid:
          type: string
          format: uuid
    Agent:
      type: object
      properties:
        name:
          type: string
        agent_type:
          type: string
          enum: [person, organisation, system]
        uuid:
          type: string
          format: uuid
    Participant:
      type: object
      properties:
        identifier:
          type: string
        role:
          type: string
          description: Role code or label for the participation
        code:
          type: string
        description:
          type: string
        agent:
          oneOf:
            - $ref: '#/components/schemas/Agent'
            - type: array
              items:
                $ref: '#/components/schemas/Agent'
        uuid:
          type: string
          format: uuid
    Service:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: boolean
        geolocation:
          type: string
        thematic_area:
          type: string
        uuid:
          type: string
          format: uuid
      required:
        - identifier
        - name
    AssessmentComposeRequest:
      type: object
      properties:
        status:
          type: boolean
        organization:
          $ref: '#/components/schemas/PublicOrganization'
        requirement:
          $ref: '#/components/schemas/BindingRequirement'
        statements:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentStatement'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/GenericChild'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/GenericChild'
        expressions:
          type: array
          items:
            $ref: '#/components/schemas/GenericChild'
      required:
        - organization
        - requirement
    AssessmentComposeResponse:
      type: object
      properties:
        assessment:
          type: object
          description: The created assessment entity (raw Drupal array form).
        organization:
          type: object
        requirement:
          type: object
        statements:
          type: array
          items:
            type: object
        participants:
          type: array
          items:
            type: object
        agents:
          type: array
          items:
            type: object
        expressions:
          type: array
          items:
            type: object

            uuid: b99c2317-850f-40f9-a4f5-a37e7df86571
            region: aside
            configuration:
              id: 'field_block:node:oss_solution:oss_vitality_index_range'
              label: 'Vitality index range'
              label_display: '0'
              provider: layout_builder
              context_mapping:
                entity: layout_builder.entity
                view_mode: view_mode
              formatter:
                type: vitality_index_chart
                label: hidden
                settings:
                  info:
                    value: '<p>The vitality index indicates the degree of activity carried out in the last time period on each OSS Solution repository indexed in the Catalogue.</p><p>It reproduces exactly (in its definition and calculation) that envisaged by the guidelines on acquisition and reuse of software for Public Administrations defined by the <a href="https://www.agid.gov.it/it/agenzia" target="_blank">Agency for Digital Italy - AGID</a>, and currently officially implemented within the <a href="https://developers.italia.it/en/software" target="blank">Developers.Italia OSS Solutions Catalogue</a>.</p><p>This vitality index is calculated on the time window of the last 60 days (and updated once a week within this catalogue) taking into consideration the following four categories:</p><ul><li><strong>Code activity</strong>: the number of commits and merges per day,</li><li><strong>Release history</strong>: the number of releases per day,</li><li><strong>User community</strong>: the number of unique authors,</li><li><strong>Longevity</strong>: the age of the project,</li></ul><p>The ranges of each measurement can be found in the file <a href="https://github.com/italia/publiccode-crawler/blob/main/vitality-ranges.yml" target="blank">vitality-ranges.yml</a>.</p>'
                    format: text_html
                third_party_settings:
                  template_suggestion:
                    template_suggestion: ''
            weight: 1
            additional: {  }

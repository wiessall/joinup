confirmation_lifetime: 0
confirmation_request:
  subject: 'Request for confirmation of email address from [site:name]'
  body: "We have received a request to validate the contact email address ([email-confirmer:confirmation-mail]) on [site:name] website at [site:url] in order to enable its Contact form. This dedicated form will allow users to get in touch with you in a quick, secure and privacy-friendly way. Unless this step is completed, you will not be able to receive any messages from users or members interested on [site:name].\r\nPlease, reply to this request using the link below.\r\n\r\n[email-confirmer:confirmation-url]\r\n\r\nIf you think this action is not clear or not due, please contact Joinup Support at https://joinup.ec.europa.eu/contact.\r\n\r\nBest regards,\r\nThe Joinup Team"
confirmation_response:
  skip_confirmation_form: false
  questions:
    pending: 'Proceed to confirm your email address.'
    expired: 'This email confirmation process has expired.'
    cancelled: 'This email confirmation process was cancelled.'
    confirmed: 'Your email address was confirmed.'
  url:
    confirm: '<front>'
    cancel: '<front>'
    error: '<front>'

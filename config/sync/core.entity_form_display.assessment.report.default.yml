    group_page2help:
      children: {  }
      label: Page2Help
      region: content
      parent_name: group_binding_requirements
      weight: 4
      format_type: markup
      format_settings:
        classes: form-wrapper
        show_empty_fields: true
        id: ''
        label_as_html: false
        markup:
          value: '<div><p>This section collects information on the assessed binding requirements.</p><p>The concept of ‘Binding requirements’ is defined in Article 2(15) IEA as:</p><ul><li>an obligation, prohibition, condition, criterion or limit;</li><li>of a legal, organisational, semantic or technical nature;</li><li>which is set by a Union entity or a public sector body;</li><li>concerning one or more trans-European digital public services; and</li><li>which has an effect on cross-border interoperability.</li></ul><p>For more information please consult the guidelines.</p></div><div><h2>Trans-European digital public service(s) concerned</h2><p>Services are to be considered trans-European digital public services when they fulfil the cumulative requirements set out in Article 2(2) of the IEA.</p><p>‘<em>Digital services provided by Union entities or public sector bodies to one another or to natural or legal persons in the Union, and requiring interaction across Member State borders, among Union entities or between Union entities and public sector bodies, by means of their network and information systems.</em>’ – Article 2(2) IEA</p></div>'

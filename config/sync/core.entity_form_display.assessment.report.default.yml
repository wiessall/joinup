      region: content
      parent_name: group_binding_requirements
      weight: 6
      format_type: markup
      format_settings:
        classes: form-wrapper
        show_empty_fields: true
        id: ''
        label_as_html: false
        markup:
          value: '<h4>Identification of binding requirements assessed</h4><p>List the binding requirement(s) assessed.</p>'
          format: content_editor
    group_assessments_statements:
      children:
        - legal_interoperability
        - organisational_interoperability
        - semantic_interoperability
        - technical_interoperability
      label: 'Assessments statements'
      region: content
      parent_name: group_statements
      weight: 20
      format_type: markup
      format_settings:
        classes: form-wrapper
        show_empty_fields: true
        id: ''
        label_as_html: false
        markup:
          value: '<div><h2>Identified effects on cross-border interoperability</h2></div><div><p>The Interoperable Europe Act requires the identification of effects on cross-border interoperability, i.e., on the legal, organisational, semantic and technical interoperability of digital public services that exchange data across borders.</p><p>Taking the EIF as the main starting point for your assessment means considering the extent to which the proposed requirements enable or hinder interoperability. This could also show whether additional requirements are needed. As explained above, it is necessary to keep in mind that <strong>the assessment does not need to show the way towards full interoperability, but it should help detect ways towards </strong><em><strong>more </strong></em><strong>interoperability.</strong></p><p>Please tick the most appropriate and provide a brief description.</p></div>'
          format: content_editor

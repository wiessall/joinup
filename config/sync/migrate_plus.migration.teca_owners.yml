      plugin: entity_generate
      entity_type: taxonomy_term
      bundle_key: vid
      bundle: country
      value_key: name
      ignore_case: true
  link/uri:
    plugin: skip_on_empty
    method: process
    source: link
  owner_type:
    -
      plugin: skip_on_empty
      method: process
      source: owner_type
    -
      plugin: sub_process
      process:
        target_id:
          plugin: entity_generate
          source: value
          entity_type: taxonomy_term
          bundle_key: vid
          bundle: owner_type
          value_key: name
          ignore_case: true
destination:

user_before_deletion_subject: 'Important Notice - Action Required to Retain Your Interoperable Europe Portal Account'
user_before_deletion_text: "Dear user,\r\n\r\nAs part of our regular maintenance on the Interoperable Europe Portal and in order to ensure the highest level of security on the platform, we routinely review account activity. Our records indicate that your account has been inactive for an extended period of time. Consequently, it is scheduled for deletion in one week from today.\r\n\r\nShould you wish to maintain your account, please click <a href=\"https://interoperable-europe.ec.europa.eu/caslogin?destination=/home\">here</a> in order to log in to your account before the described deletion date. Your login will automatically exclude your account from the deletion process. \r\nShould you have any questions or need assistance, please feel free to contact our support team by clicking on the <a href=\"https://interoperable-europe.ec.europa.eu/contact?destination=/home\">Contact Portal Support form</a>.\r\n\r\nBest regards, \r\nInteroperable Europe Support team"

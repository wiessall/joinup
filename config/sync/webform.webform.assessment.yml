  2_binding_requirements:
    '#type': webform_wizard_page
    '#title': '2. Binding requirements'
    '#prev_button_label': Previous
    '#next_button_label': Next
    intro_section_three:
      '#type': processed_text
      '#text': '<p>This section collects information on the assessed binding requirements.</p><p>The concept of ‘Binding requirements’ is defined in Article 2(15) IEA as:</p><ul><li>an obligation, prohibition, condition, criterion or limit;</li><li>of a legal, organisational, semantic or technical nature;</li><li>which is set by a Union entity or a public sector body;</li><li>concerning one or more trans-European digital public services; and </li><li>which has an effect on cross-border interoperability.</li></ul><p>For more information please consult the guidelines.</p>'
      '#format': content_editor
    trans_european_digital_public_services_concerned:
      '#type': processed_text
      '#text': '<h2>Trans-European digital public service(s) concerned</h2><p>Services are to be considered trans-European digital public services when they fulfil the cumulative requirements set out in Article 2(2) of the IEA.</p><p>‘<em>Digital services provided by Union entities or public sector bodies to one another or to natural or legal persons in the Union, and requiring interaction across Member State borders, among Union entities or between Union entities and public sector bodies, by means of their network and information systems.</em>’ – Article 2(2) IEA</p>'
      '#format': content_editor
    horizontal_rule:
      '#type': webform_horizontal_rule
    binding_requirements_identified_concern:
      '#type': radios
      '#title': 'The binding requirements identified concern:'
      '#options':
        'Limited trans-European digital public services (1-5 specific TEDP services)': 'Limited trans-European digital public services (1-5 specific TEDP services)'
        'Potentially many trans-European digital public services (6 or more TEDP services)': 'Potentially many trans-European digital public services (6 or more TEDP services)'
      '#options__properties': ''
    trans_european_digital_public_service_concerned:
      '#type': textfield
      '#title': 'Specify the trans-European digital public service(s) concerned:'
      '#multiple': true
      '#states':
        visible:
          ':input[name="binding_requirements_identified_concern"]':
            value: 'Limited trans-European digital public services (1-5 specific TEDP services)'
      '#multiple__sorting': false
      '#multiple__operations': false
      '#multiple__add_more_input': false
    concerned_application_domain_sector:
      '#type': checkboxes
      '#title': 'Specify the concerned function of trans-European digital public service(s):'
      '#options':
        Defense: Defense
        'Economic affairs': 'Economic affairs'
        Education: Education
        'Environmental Protection': 'Environmental Protection'
        'General public services': 'General public services'
        Health: Health
        'Housing and Community Amenities': 'Housing and Community Amenities'
        'Public Order and Safety': 'Public Order and Safety'
        'Recreation, Culture, and Religion': 'Recreation, Culture, and Religion'
        'Social Protection': 'Social Protection'
      '#required': true
      '#options__properties': ''
    binding_requirements_assessed_identification:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Identification of binding requirements assessed</h2>'
      '#format': content_editor
    binding_requirement_assessed:
      '#type': webform_custom_composite
      '#title': 'List the binding requirement(s) assessed.'
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#element':
        number_1:
          '#type': number
          '#title': Nr.
          '#description': 'Number each requirement'
          '#min': 1
          '#attributes':
            oninput: "validity.valid||(value='');"
        legal_reference:
          '#type': textfield
          '#title': 'Provide a legal reference for the binding requirement, if available'
        description_1:
          '#type': textfield
          '#title': 'Provide a short description or a title for the binding requirements for the purpose of referring back to the specific requirement in the assessment process'
          '#maxlength': 1024
        relevant_1:
          '#type': webform_checkboxes_other
          '#options':
            Data: Data
            Systems: Systems
          '#title': 'Binding requirement affects (select all relevant)'
    stakeholders_affected:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Public and/or private stakeholders affected</h2>'
      '#format': content_editor
    data_processed_by:
      '#type': checkboxes
      '#title': 'Select the groups of stakeholders to which binding requirement(s) are relevant:'
      '#options':
        'Local public sector body': 'Local public sector body'
        'Regional public sector body': 'Regional public sector body'
        'National public sector body': 'National public sector body'
        'European Union institution': 'European Union institution'
        'European Union agency': 'European Union agency'
        'European Union body': 'European Union body'
        'Private Businesses ': 'Private Businesses '
      '#options__properties': ''
    geographical_origin:
      '#type': webform_custom_composite
      '#title': 'Select the stakeholder’s country'
      '#multiple__header': false
      '#multiple__item_label': ''
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add country'
      '#label_attributes':
        class:
          - mb-0
      '#access_create_roles':
        - authenticated
      '#access_view_roles':
        - authenticated
      '#element':
        geographical_origin:
          '#type': select
          '#options':
            'All EU': 'All EU'
            Austria: Austria
            Belgium: Belgium
            Bulgaria: Bulgaria
            Croatia: Croatia
            Cyprus: Cyprus
            Czechia: Czechia
            Denmark: Denmark
            Estonia: Estonia
            Finland: Finland
            France: France
            Germany: Germany
            Greece: Greece
            Hungary: Hungary
            Ireland: Ireland
            Italy: Italy
            Latvia: Latvia
            Lithuania: Lithuania
            Luxembourg: Luxembourg
            Malta: Malta
            Netherlands: Netherlands
            Poland: Poland
            Portugal: Portugal
            Romania: Romania
            Slovakia: Slovakia
            Slovenia: Slovenia
            Spain: Spain
            Sweden: Sweden
          '#title': 'Choose a country'
    cross_border_interoperability_effects:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Identified effects on cross-border interoperability</h2>'
      '#format': content_editor
    interoperable_europe_identification:
      '#type': processed_text
      '#text': '<p>The Interoperable Europe Act requires the identification of effects on cross-border interoperability, i.e., on the legal, organisational, semantic and technical interoperability of digital public services that exchange data across borders.</p><p>Taking the EIF as the main starting point for your assessment means considering the extent to which the proposed requirements enable or hinder interoperability. This could also show whether additional requirements are needed. As explained above, it is necessary to keep in mind that <strong>the assessment does not need to show the way towards full interoperability, but it should help detect ways towards </strong><em><strong>more </strong></em><strong>interoperability.</strong></p><p>Please tick the most appropriate and provide a brief description.</p>'
      '#format': content_editor
    identified_effects_cross_border_legal:
      '#type': webform_custom_composite
      '#title': 'Identified effects on cross-border legal interoperability'
      '#multiple': false
      '#multiple__sorting': false
      '#multiple__operations': false
      '#multiple__add_more': false
      '#element':
        legal_options:
          '#type': radios
          '#options':
            Beneficial: Beneficial
            Negligible: Negligible
            Risky: Risky
          '#title': 'Tick the most appropriate '
        organisational_options:
          '#type': textarea
          '#title': 'Provide a justification'
    identified_effects_cross_border_organisational:
      '#type': webform_custom_composite
      '#title': 'Identified effects on cross-border organisational interoperability'
      '#multiple': false
      '#multiple__sorting': false
      '#multiple__operations': false
      '#multiple__add_more': false
      '#element':
        legal_options:
          '#type': radios
          '#options':
            Beneficial: Beneficial
            Negligible: Negligible
            Risky: Risky
          '#title': 'Tick the most appropriate '
        organisational_options:
          '#type': textarea
          '#title': 'Provide a justification'
    identified_effects_cross_border_semantic:
      '#type': webform_custom_composite
      '#title': 'Identified effects on cross-border semantic interoperability'
      '#multiple': false
      '#multiple__sorting': false
      '#multiple__operations': false
      '#multiple__add_more': false
      '#element':
        legal_options:
          '#type': radios
          '#options':
            Beneficial: Beneficial
            Negligible: Negligible
            Risky: Risky
          '#title': 'Tick the most appropriate '
        organisational_options:
          '#type': textarea
          '#title': 'Provide a justification'
    identified_effects_cross_border_technical:
      '#type': webform_custom_composite
      '#title': 'Identified effects on cross-border technical interoperability'
      '#multiple': false
      '#multiple__sorting': false
      '#multiple__operations': false
      '#multiple__add_more': false
      '#element':
        legal_options:
          '#type': radios
          '#options':
            Beneficial: Beneficial
            Negligible: Negligible
            Risky: Risky
          '#title': 'Tick the most appropriate '
        organisational_options:
          '#type': textarea
          '#title': 'Provide a justification'
  3_results:
    '#type': webform_wizard_page
    '#title': '3. Results'
    '#prev_button_label': Previous
    '#next_button_label': Next
    intro_section_four:
      '#type': processed_text
      '#text': '<p>This section refers to the results of the interoperability assessment of binding requirement(s) required within the Interoperable Europe Act.</p>'
      '#format': content_editor
    interoperable_solutions_identified_for_use:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Interoperable Europe solutions identified for use:</h2>'
      '#format': content_editor
    interoperable_solutions_identified_for_use_text:
      '#type': processed_text
      '#text': '<p>Interoperable Europe Solutions are recommended solutions by the Interoperable Europe Board that support the interoperability of trans-European digital public services across the EU. For example, inter alia, these solutions could be open standards or specifications, specific software, guidelines or frameworks.</p><p>Currently, the formation of the Interoperable Europe Board is still pending. Consequently, there are no officially recommended Interoperable Europe solutions at this point. Updates will be provided as soon as the process is initiated and the Board has made its recommendations;</p>'
      '#format': content_editor
    relevant_interoperability_solutions:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Other relevant interoperability solutions, where applicable, including machine-to-machine interfaces</h2>'
      '#format': content_editor
    interoperability_solutions:
      '#type': webform_markup
      '#markup': '<h3>Identify the interoperability solutions mandatory to use for the implementation of the assessed binding requirement:</h3>'
    portal_solutions:
      '#type': entity_autocomplete
      '#title': 'Internal Solutions in the Portal  '
      '#multiple': true
      '#description': '<p class="h4">Internal Solutions in the Portal (<a href="/search?f%5B0%5D=type%3Asolution" target="_blank" rel="noopener noreferrer">Search</a> in the Interoperable Europe Portal)</p>'
      '#title_display': invisible
      '#description_display': before
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#target_type': node
      '#selection_handler': 'default:node'
      '#selection_settings':
        target_bundles:
          solution: solution
    portal_solutions_link:
      '#type': webform_link
      '#title': 'Solutions not in the Portal (link)'
      '#multiple': true
      '#multiple__min_items': 1
      '#multiple__empty_items': 0
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#title__title': 'Solution Title'
      '#url__title': 'Solution URL'
      '#format': custom
      '#format_html': |
        {% if element.url and element.title %}
        {{item.value}}
        {% elseif element.title %}
        {{element.title}}
        {% elseif element.url %}
        {{element.url}}
        {% endif %}
    remaining_barriers_to_crossborder_interoperability:
      '#type': processed_text
      '#prefix': '<p>&nbsp;</p>'
      '#text': '<h2>Remaining barriers to cross-border interoperability</h2>'
      '#format': content_editor
    remaining_barriers:
      '#type': radios
      '#title': 'Have you discovered any remaining barriers to cross-border interoperability?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#required': true
      '#options__properties': ''
    remaining_barriers_description:
      '#type': textarea
      '#title': 'Remaining barriers'
      '#states':
        visible:
          ':input[name="remaining_barriers"]':
            value: 'Yes'
  annexes:
    '#type': webform_wizard_page
    '#title': '4. Supporting documents'
    intro_documents:
      '#type': webform_markup
      '#markup': '<p>In this section you can upload documents supporting your assessment.</p>'
    binding_requirement_documents:

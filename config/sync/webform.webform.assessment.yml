        'Standardised framework based on EIF (e.g. National Interoperability': 'Standardised framework based on EIF (e.g. National Interoperability'
        'Standardised process based on EIF (e.g. digital checks)': 'Standardised process based on EIF (e.g. digital checks)'
        'Standardised tool based on EIF (e.g. IMAPS or IQUAT)': 'Standardised tool based on EIF (e.g. IMAPS or IQUAT)'
        'None of the above': 'None of the above'
      '#empty_option': '-Select-'

    interoperable_europe_solutions_are_recommended_solutions_by_the_:
      '#type': processed_text
      '#text': '<p>Interoperable Europe Solutions are recommended solutions by the Interoperable Europe Board that support the interoperability of trans-European digital public services across the EU. For example, inter alia, these solutions could be open standards or specifications, specific software, guidelines or frameworks.</p><p>Currently, the formation of the Interoperable Europe Board is still pending. Consequently, there are no officially recommended Interoperable Europe solutions at this point. Updates will be provided as soon as the process is initiated and the Board has made its recommendations;</p>'
      '#format': content_editor
    other_relevant_interoperability_solutions_where_applicable:

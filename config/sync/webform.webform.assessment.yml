        'European Union Agency for Law Enforcement Training': 'European Union Agency for Law Enforcement Training'
        'European Union Agency for Railways': 'European Union Agency for Railways'
        'European Union Agency for the Operational Management of Large-Scale IT Systems in the Area of Freedom, Security and Justice': 'European Union Agency for the Operational Management of Large-Scale IT Systems in the Area of Freedom, Security and Justice'

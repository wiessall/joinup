third_party_settings:
  search_api_solr:
    finalize: true
    commit_before_finalize: false
    commit_after_finalize: true
    debug_finalize: false
    highlighter:
      maxAnalyzedChars: 51200
      fragmenter: gap
      usePhraseHighlighter: true
      highlightMultiTerm: true
      preserveMulti: false
      regex:
        slop: 0.5
        pattern: blank
        maxAnalyzedChars: 10000
      highlight:
        mergeContiguous: false
        requireFieldMatch: false
        snippets: 3
        fragsize: 0
    mlt:
      mintf: 1
      mindf: 1
      maxdf: 0
      maxdfpct: 0
      minwl: 0
      maxwl: 0
      maxqt: 100
      maxntp: 2000
      boost: false
      interestingTerms: none
    term_modifiers:
      slop: 10000000
      fuzzy: 2
      fuzzy_analyzer: true
    advanced:
      index_prefix: ''
      collection: ''
      timezone: ''
    multilingual:
      limit_to_content_language: false
      include_language_independent: true
      use_language_undefined_as_fallback_language: false
      specific_languages:
        bg: '0'
        hr: '0'
        cs: '0'
        da: '0'
        nl: '0'
        en: '0'
        et: '0'
        fi: '0'
        fr: '0'
        de: '0'
        el: '0'
        hu: '0'
        ga: '0'
        it: '0'
        lv: '0'
        lt: '0'
        mt: '0'
        pl: '0'
        pt: '0'
        ro: '0'
        sk: '0'
        sl: '0'
        es: '0'
        sv: '0'
      use_universal_collation: false

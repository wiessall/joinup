id: public_sector_tech_watch
title: 'Public Sector Tech Watch'
description: ''
categories: {  }
elements: |-
  submitter_information:
    '#type': webform_section
    '#title': 'Submitter information'
    '#description': '<p>Prefilled fields are inherited from your account as “Joinup registered user”</p>'
    '#title_tag': h3
    flexbox_01:
      '#type': webform_flexbox
      '#attributes':
        class:
          - m-0
      first_name:
        '#type': textfield
        '#title': 'First name'
        '#required': true
        '#default_value': '[current-user:field_user_first_name:value]'
      last_name:
        '#type': textfield
        '#title': 'Last name'
        '#required': true
        '#default_value': '[current-user:field_user_family_name:value]'
    flexbox_02:
      '#type': webform_flexbox
      '#attributes':
        class:
          - m-0
      contact_email:
        '#type': email
        '#title': 'Contact email'
        '#required': true
        '#default_value': '[current-user:mail]'
      submitter_organisation:
        '#type': textfield
        '#title': 'Submitter organisation'
  case_information:
    '#type': webform_section
    '#title': 'Case Information'
    '#title_tag': h3
    flexbox_03:
      '#type': webform_flexbox
      '#attributes':
        class:
          - m-0
      case_title:
        '#type': textfield
        '#title': 'Case title'
        '#description': '<p>Provide a concise title summarising the purpose or application of the technology you are adopting in the public sector in Europe"</p>'
        '#required': true
      technology:
        '#type': webform_select_other
        '#title': Technology
        '#options':
          'Artificial Intelligence': 'Artificial Intelligence'
          Blockchain: Blockchain
          Metaverse: Metaverse
          'Augmented Reality/Virtual Reality': 'Augmented Reality/Virtual Reality'
          'Quantum Computing': 'Quantum Computing'
        '#other__option_label': 'Other (please specify)'
        '#required': true
        '#wrapper_type': form_element
    public_sector_organisation_responsible_for_the_case:
      '#type': webform_custom_composite
      '#title': 'Public Sector Organisation responsible for the case'
      '#required': true
      '#multiple__item_label': 'Public Sector Organisation'
      '#multiple__min_items': 1
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add organisation'
      '#wrapper_type': form_element
      '#element':
        public_sector_organisation:
          '#type': textfield
          '#required': true
          '#title': 'Public sector organisation'
          '#description': 'Please provide the name of the public sector organisation where the technology is used'
        at_which_level_is_the_responsible:
          '#type': webform_checkboxes_other
          '#options':
            'Central Government': 'Central Government'
            'Regional Government': 'Regional Government'
            'Local Government': 'Local Government'
            Academic-Research: Academic-Research
            'Community led': 'Community led'
            'Consortium (e.g. EU-financed project)': 'Consortium (e.g. EU-financed project)'
          '#title': 'At which level is the responsible organisation operating?'
          '#wrapper_type': form_element
          '#other__option_label': 'Other (please specify)'
    geographical_coverage_section:
      '#type': webform_custom_composite
      '#title': 'Geographical coverage'
      '#required': true
      '#multiple__header': false
      '#multiple__item_label': ''
      '#multiple__min_items': 1
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add country'
      '#wrapper_type': form_element
      '#element':
        geographical_coverage:
          '#type': webform_select_other
          '#options':
            Albania: Albania
            Andorra: Andorra
            Armenia: Armenia
            Austria: Austria
            Azerbaijan: Azerbaijan
            Belarus: Belarus
            Belgium: Belgium
            'Bosnia and Herzegovina': 'Bosnia and Herzegovina'
            Bulgaria: Bulgaria
            Croatia: Croatia
            Cyprus: Cyprus
            Czechia: Czechia
            Denmark: Denmark
            Estonia: Estonia
            'European Union': 'European Union'
            Finland: Finland
            France: France
            Georgia: Georgia
            Germany: Germany
            Greece: Greece
            Hungary: Hungary
            Iceland: Iceland
            Ireland: Ireland
            Italy: Italy
            Kazakhstan: Kazakhstan
            Kosovo: Kosovo
            Latvia: Latvia
            Liechtenstein: Liechtenstein
            Lithuania: Lithuania
            Luxembourg: Luxembourg
            Malta: Malta
            Moldova: Moldova
            Monaco: Monaco
            Montenegro: Montenegro
            Netherlands: Netherlands
            'North Macedonia': 'North Macedonia'
            Norway: Norway
            Poland: Poland
            Portugal: Portugal
            Romania: Romania
            Russia: Russia
            'San Marino': 'San Marino'
            Serbia: Serbia
            Slovakia: Slovakia
            Slovenia: Slovenia
            Spain: Spain
            Sweden: Sweden
            Switzerland: Switzerland
            Turkey: Turkey
            Ukraine: Ukraine
            'United Kingdom': 'United Kingdom'
            'Vatican City': 'Vatican City'
          '#required': true
          '#title': 'Choose a country'
          '#other__option_label': 'Other (please specify)'
    flexbox_06:
      '#type': webform_flexbox
      '#attributes':
        class:
          - m-0
      geographical_extent:
        '#type': select
        '#title': 'Geographical extent'
        '#description': '<p>The geographical extent refers to the geographical layer where the solution is deployed. For example if the solutions is deployed by a municipality the level is local, independently from administrative level of the responsible organisation.</p>'
        '#options':
          National: National
          Regional: Regional
          Local: Local
          'Across Countries': 'Across Countries'
          European: European
      functions_of_government:
        '#type': select
        '#title': 'Functions of Government'
        '#description': '<p>For more information on Functions of Government please visit this <a href="https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Glossary:Classification_of_the_functions_of_government_(COFOG)" target="_blank">Glossary</a></p>'
        '#options':
          Defence: Defence
          'Economic Affairs': 'Economic Affairs'
          'Education, Environmental protection': 'Education, Environmental protection'
          'General public services': 'General public services'
          Health: Health
          'Housing and community amenities': 'Housing and community amenities'
          'Public order and safety': 'Public order and safety'
          'Recreation, culture, and religion': 'Recreation, culture, and religion'
          'Social protection': 'Social protection'
    source_url:
      '#type': webform_custom_composite
      '#title': 'Source (URL)'
      '#required': true
      '#multiple__header': false
      '#multiple__item_label': 'Source URL'
      '#multiple__min_items': 1
      '#multiple__sorting': false
      '#multiple__add': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add another source'
      '#wrapper_type': form_element
      '#element':
        source_url_item:
          '#type': url
          '#title': 'Source (URL)'
          '#description': 'Please provide here the complete link to external sources which describe the case (reports, case studies, presentations, news articles, web page describing the solution etc). At least one URL is needed to publish the case in the database.'
          '#title_display': invisible
    description:
      '#type': textarea
      '#title': Description
      '#description': '<p>Please provide a description of the case, highlighting the objectives, organisations involved, challenges, impact and reasons for utilizing the technology. Max 4000 characters.</p>'
      '#maxlength': 4000
      '#rows': 3
      '#required': true
    flexbox_05:
      '#type': webform_flexbox
      '#attributes':
        class:
          - m-0
      is_the_technological_solution_available:
        '#type': radios
        '#title': 'Is the technological solution available as Open Source?'
        '#options': yes_no
        '#options_display': two_columns
        '#required': true
        '#wrapper_type': form_element
      status:
        '#type': select
        '#title': Status
        '#options':
          'In development': 'In development'
          Implemented: Implemented
          'Not in use anymore': 'Not in use anymore'
          Pilot: Pilot
          Planned: Planned
        '#required': true
    which_area_does_the_solution_impact:
      '#type': radios
      '#title': 'Which area does the solution impact the most?'
      '#options':
        'Public service quality': 'Public service quality -- The solution improves the relationship between the public administration and citizens, namely it has a direct impact on citizens and external stakeholders'
        'Administrative efficiency': 'Administrative efficiency -- The solution improves the efficiency of the administration in terms of either relationships within one single public administration, between different branches of one public administration and/or between different public administrations.'
      '#required': true
      '#wrapper_type': form_element
    improved_public_service:
      '#type': checkboxes
      '#title': 'Improved Public Service'
      '#multiple': 3
      '#description': '<small class="description form-text text-muted">More specifically, what benefit or expected benefit this solution produced or might produce? (Please select up to the three most relevant answers)</small>'
      '#description_display': before
      '#options':
        'Services are more personalised': 'Services are more personalised'
        'Services are more citizen-centred services': 'Services are more citizen-centred services'
        'Quality of Public Sector Information (PSI) and services increases': 'Quality of Public Sector Information (PSI) and services increases'
        'Public services are more responsive, efficient, and cost-effective': 'Public services are more responsive, efficient, and cost-effective'
        'New services or channels are created': 'New services or channels are created'
      '#required': true
      '#states':
        visible:
          ':input[name="which_area_does_the_solution_impact"]':
            value: 'Public service quality'
      '#wrapper_type': form_element
    improved_administrative_efficiency:
      '#type': checkboxes
      '#title': 'Improved administrative efficiency'
      '#multiple': 3
      '#description': '<small class="description form-text text-muted">More specifically, what benefit or expected benefit this solution produced or might produce? (Please select up to the three most relevant answers)</small>'
      '#description_display': before
      '#options':
        'Costs can be reduced': 'Costs can be reduced'
        'Government operations are more responsive': 'Government operations are more responsive'
        'Management of public resources is improved': 'Management of public resources is improved'
        'Quality of processes or systems is improved': 'Quality of processes or systems is improved'
        'Collaboration and communication are improved': 'Collaboration and communication are improved'
        'Risk of corruption and abuse of the law by public servants is reduced or eliminated': 'Risk of corruption and abuse of the law by public servants is reduced or eliminated'
        'Greater fairness, honesty and equality is enabled': 'Greater fairness, honesty and equality is enabled'
      '#required': true
      '#states':
        visible:
          ':input[name="which_area_does_the_solution_impact"]':
            value: 'Administrative efficiency'
      '#wrapper_type': form_element
    did_the_solution_or_will_the_solution_increase_the_openness:
      '#type': checkboxes
      '#title': 'Did the solution or will the solution increase the openness of government?'
      '#options':
        'Yes, it increased / will increase transparency of public sector operations': 'Yes, it increased / will increase transparency of public sector operations'
        'Yes, it increased / will increase public participation in government actions and policy making': 'Yes, it increased / will increase public participation in government actions and policy making'
        'Yes, it improved / will increase public control and influence on government actions and policies': 'Yes, it improved / will increase public control and influence on government actions and policies'
        'None of the above / I don’t know': 'None of the above / I don’t know'
      '#required': true
      '#wrapper_type': form_element
    did_you_take_inspiration_from_the_eu_model_contractual:
      '#type': radios
      '#title': 'Did you take inspiration from the <a href="https://public-buyers-community.ec.europa.eu/communities/procurement-ai/resources/eu-model-contractual-ai-clauses-pilot-procurements-ai" target="_blank">EU Model Contractual AI</a> procurement clauses developed by the <a href="https://public-buyers-community.ec.europa.eu/communities/procurement-ai" target="_blank">Community of Procurement of AI</a> and supported by the <a href="https://commission.europa.eu/index_en" target="_blank">European Commission</a> for procuring the AI solution?'
      '#description': '<p>If you want to know more about the clauses, join the <a href="https://public-buyers-community.ec.europa.eu/communities/procurement-ai" target="_blank">Community</a></p>'
      '#options':
        'No, we developed the solution internally': 'No, we developed the solution internally'
        'No, we procured the solution (or part of it) but we were not aware of those clauses': 'No, we procured the solution (or part of it) but we were not aware of those clauses'
        'No, we procured the solution (or part of it), we were aware of the clauses but they did not fit the purpose': 'No, we procured the solution (or part of it), we were aware of the clauses but they did not fit the purpose'
        'Yes, we procured the solution (or part of it) and we used/took inspiration from the existing procurement clauses': 'Yes, we procured the solution (or part of it) and we used/took inspiration from the existing procurement clauses'
        'I don’t know / not applicable': 'I don’t know / not applicable'
      '#wrapper_type': form_element
    additional_info:
      '#type': managed_file
      '#title': 'Additional info'
      '#multiple': true
      '#file_placeholder': '<p style="background:#ffffff;line-height:108%;margin-bottom:0cm;">Please upload here all the material (if any) on the case that can be useful to know more about it. Moreover, please feel free to share any other request or comments you might have</p>'
      '#max_filesize': '10'
      '#file_extensions': 'azw css csv dbf doc docx dtd.sgml dtd.xml e00 eps epub fmx2 fmx3 fmx4 gif gml gzip indd jpeg jpg json kml kmz mdb mobi mop mxd odf ods odt op.datpro owl pdf pdfa1a pdfa1b pdfx png pps ppsx ppt pptx ps psd rdf rdf.turtle rdf.xml rss rtf schema.xml sgml sko'
  terms_and_conditions:
    '#type': webform_section
    '#title': 'Terms and Conditions'
    '#title_tag': h3
    i_have_read_and_agreed_to_the_joinup_legal_notice:
      '#type': checkbox
      '#title': 'I have read and agreed to the <a href="/joinup/legal-notice">Joinup Legal Notice</a> and <a href="/collection/joinup/specific-privacy-statement">the Joinup Privacy Statement</a>.'
      '#required': true
    i_consent_my_case_to_be_included:
      '#type': checkbox
      '#title': 'I consent my case to be included among the candidates of the "Best Case" award".'
  send_yourself_a_copy:
    '#type': webform_section
    '#title': 'Send yourself a copy'
    '#title_tag': h3
    send_me_an_email:
      '#type': checkbox
      '#title': 'Send me an email with a copy of this form'

            context_mapping: {  }
            markup:
              value: '<p>Interoperable Europe Portal Collections are spaces where you can collaborate with others sharing your same interests around a certain domain, and contain all the contents of any kind related to that domain (solutions, news, newsletters and announcements of events and documents of various kinds).</p><h2>How Collections work</h2><p>Actions you can take as a collection owner:</p><ul><li>Choose who can see and join your Collection, if you create it with restricted membership conditions;</li><li>Add other people as moderators and owners of the Collection;</li><li>Accept or reject users'' proposal to add their solution your collection, based on relevance and <a href="/joinup/eligibility-criteria">eligibility criteria</a>;</li><li>Remove members from your Collection;</li><li>Moderate posts and comments in your Collection;</li><li>Delete your Collection</li></ul><p>What others can do when they join your Collection:</p><ul><li>See what other people have posted to that Collection</li><li>Comment on posts in that Collection</li><li>Leave that Collection at any time</li></ul><p>Please note that the creation of Collections is subject to moderation by the Interoperable Europe Portal team, and the following criteria will be checked:</p><ul><li>If there are existing collections pertaining to the same domains as yours;</li><li>If there is already a collection with content similar to that which you intend to include;</li></ul>'

id: entity_browser
name: 'Entity Browser'
description: ''
read_only: false
field_settings:
  abstract:
    label: Abstract
    datasource_id: 'entity:node'
    property_path: abstract
    type: 'solr_text_custom:ngram'
    dependencies:
      config:
        - field.storage.node.abstract
  aggregated_field:
    label: 'Aggregated field'
    property_path: aggregated_field
    type: string
    configuration:
      type: concat
      separator: |+
      fields:
        - 'entity:node/title'
  description:
    label: Description
    datasource_id: 'entity:node'
    property_path: 'description:processed'
    type: 'solr_text_custom:ngram'
    dependencies:
      config:
        - field.storage.node.description
  domain:
    label: Domain
    datasource_id: 'entity:node'
    property_path: domain
    type: integer
    dependencies:
      config:
        - field.storage.node.domain
  entity_bundle:
    label: 'Entity bundle'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
  entity_status:
    label: Status
    datasource_id: 'entity:node'
    property_path: field_state
    type: string
    dependencies:
      config:
        - field.storage.node.field_state
  interoperable_flag:
    label: 'Interoperable flag'
    datasource_id: 'entity:node'
    property_path: interoperable_flag
    type: boolean
  keywords:
    label: Keywords
    datasource_id: 'entity:node'
    property_path: 'keywords:entity:name'
    type: 'solr_text_custom:ngram'
    dependencies:
      config:
        - field.storage.node.keywords
      module:
        - taxonomy
  status:
    label: Published
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    dependencies:
      module:
        - node
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: 'solr_text_custom:ngram'
    dependencies:
      module:
        - node
datasource_settings:
  'entity:flagging':
    bundles:
      default: true
      selected:
        - interoperability
  'entity:node':
    bundles:
      default: false
      selected:
        - solution
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }

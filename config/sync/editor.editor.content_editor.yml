uuid: 637f142a-129f-4e3e-89fc-3eb4d29608cf
langcode: en
status: true
dependencies:
  config:
    - filter.format.content_editor
  module:
    - ckeditor5
format: content_editor
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - style
      - bold
      - italic
      - removeFormat
      - '|'
      - link
      - contactus
      - '|'
      - bulletedList
      - numberedList
      - outdent
      - indent
      - '|'
      - blockQuote
      - drupalInsertFile
      - drupalMedia
      - insertTable
      - '|'
      - undo
      - redo
      - '|'
      - sourceEditing
      - '|'
      - code
      - codeBlock
  plugins:
    ckeditor5_codeBlock:
      languages:
        -
          label: 'Plain text'
          language: plaintext
        -
          label: C
          language: c
        -
          label: 'C#'
          language: cs
        -
          label: C++
          language: cpp
        -
          label: CSS
          language: css
        -
          label: Diff
          language: diff
        -
          label: HTML
          language: html
        -
          label: Java
          language: java
        -
          label: JavaScript
          language: javascript
        -
          label: PHP
          language: php
        -
          label: Python
          language: python
        -
          label: Ruby
          language: ruby
        -
          label: TypeScript
          language: typescript
        -
          label: XML
          language: xml
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags:
        - '<cite>'
        - '<q>'
        - '<dl>'
        - '<dt>'
        - '<dd>'
        - '<map name>'
        - '<area alt coords href hreflang rel shape>'
        - '<blockquote cite>'
        - '<ul type>'
        - '<ol type>'
        - '<h1>'
        - '<h2 id>'
        - '<h3 id>'
        - '<h4 id>'
        - '<h5 id>'
        - '<h6 id>'
        - '<img alt usemap>'
        - '<a hreflang accesskey id rel target title>'
        - '<iframe src allowfullscreen mozallowfullscreen webkitallowfullscreen width height frameborder>'
    ckeditor5_style:
      styles:
        -
          label: 'Equal width columns'
          element: '<table class="table--columns-equal">'
    editor_file_file:
      status: true
      scheme: public
      directory: inline-files
      extensions: 'txt pdf doc docx xls xlsx ods odt ppt pptx vsd zip tar gz png jpg jpeg mp4 avi'
      max_size: ''
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
    media_media:
      allow_view_mode_override: true
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: '10 MB'
  max_dimensions:
    width: 0
    height: 0

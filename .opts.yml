# This file is used by Toolkit pipelines, allowing to override the upgrade
# procedure, pre-upgrade steps, cron execution command and extra OS packages
# inside the container.
# See https://webgate.ec.europa.eu/fpfis/wikis/display/MULTISITE/Pipeline+configuration+and+override.
# See \EcEuropa\Toolkit\TaskRunner\Commands\CloneCommands::runDeploy().
upgrade_commands:
  default:
    - ./vendor/bin/drush state:set system.maintenance_mode 1 --input-format=integer --yes
    - touch disable-config-readonly
    - ./vendor/bin/drush deploy --yes
    - ./vendor/bin/drush search-api:reset-tracker --yes
    - ./vendor/bin/drush joinup:node-access-rebuild
    - rm disable-config-readonly
    - ./vendor/bin/drush site-alert:disable
    - ./vendor/bin/drush state:set system.maintenance_mode 0 --input-format=integer --yes
  append:
    production:
      - test $(./vendor/bin/drush core:requirements --severity=1 --ignore="update status,joinup_core_root_user_blocked,search_api_solr_schema_joinup_modifications" --field=title | wc -l) = "0" || (echo "Status Report shows errors & warnings" && ./vendor/bin/drush core:requirements --severity=1 --ignore="update status,joinup_core_root_user_blocked,search_api_solr_schema_joinup_modifications" && exit 1)
    acceptance:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - rm disable-config-readonly
      - test $(./vendor/bin/drush core:requirements --severity=1 --ignore="update status,joinup_core_root_user_blocked,search_api_solr_schema_joinup_modifications" --field=title | wc -l) = "0" || (echo "Status Report shows errors & warnings" && ./vendor/bin/drush core:requirements --severity=1 --ignore="update status,joinup_core_root_user_blocked,search_api_solr_schema_joinup_modifications" && exit 1)
    ephemeral:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - rm disable-config-readonly

php_version: 7.4
extra_pkgs:
  - php7.4-apcu

mysql_version: 8.0

solr: True
solr_version: 8
solr_core: custom
solr_rollback: True
solr_refresh_acc: True
solr_asda: True

virtuoso_image: registry.fpfis.eu/ec-europa/digit-joinup-reference:virtuoso
virtuoso_rollback: True
virtuoso_refresh_acc: True
virtuoso_asda: True

composer_version: 2

install_clean: True
install_clone: True
dev_install_clone: True
dev_install_clean: True

selenium_version: '4.2.2'

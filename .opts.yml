# This file is used by Toolkit pipelines, allowing to override the upgrade
# procedure, pre-upgrade steps, cron execution command and extra OS packages
# inside the container.
# See https://webgate.ec.europa.eu/fpfis/wikis/display/MULTISITE/Pipeline+configuration+and+override.
# See \EcEuropa\Toolkit\TaskRunner\Commands\CloneCommands::runDeploy().
upgrade_commands:
  default:
    - touch disable-config-readonly

    # BEGIN: Remove in ISAICP-8376
    # field.storage.node.field_shared_in
    - vendor/bin/drush sql:query "CREATE TABLE n__field_shared_in LIKE node__field_shared_in"
    - vendor/bin/drush sql:query "INSERT INTO n__field_shared_in SELECT * FROM node__field_shared_in"
    - vendor/bin/drush sql:query "TRUNCATE node__field_shared_in"
    - vendor/bin/drush sql:query "CREATE TABLE nr__field_shared_in LIKE node_revision__field_shared_in"
    - vendor/bin/drush sql:query "INSERT INTO nr__field_shared_in SELECT * FROM node_revision__field_shared_in"
    - vendor/bin/drush sql:query "TRUNCATE node_revision__field_shared_in"
    # field.storage.node.field_news_referenced_solution
    - vendor/bin/drush sql:query "CREATE TABLE n__field_news_referenced_solution LIKE node__field_news_referenced_solution"
    - vendor/bin/drush sql:query "INSERT INTO n__field_news_referenced_solution SELECT * FROM node__field_news_referenced_solution"
    - vendor/bin/drush sql:query "TRUNCATE node__field_news_referenced_solution"
    - vendor/bin/drush sql:query "CREATE TABLE nr__field_news_referenced_solution LIKE node_revision__field_news_referenced_solution"
    - vendor/bin/drush sql:query "INSERT INTO nr__field_news_referenced_solution SELECT * FROM node_revision__field_news_referenced_solution"
    - vendor/bin/drush sql:query "TRUNCATE node_revision__field_news_referenced_solution"
    # field.storage.node.og_audience
    - vendor/bin/drush sql:query "CREATE TABLE n__og_audience LIKE node__og_audience"
    - vendor/bin/drush sql:query "INSERT INTO n__og_audience SELECT * FROM node__og_audience"
    - vendor/bin/drush sql:query "TRUNCATE node__og_audience"
    - vendor/bin/drush sql:query "CREATE TABLE nr__og_audience LIKE node_revision__og_audience"
    - vendor/bin/drush sql:query "INSERT INTO nr__og_audience SELECT * FROM node_revision__og_audience"
    - vendor/bin/drush sql:query "TRUNCATE node_revision__og_audience"
    # field.storage.media.og_audience
    - vendor/bin/drush sql:query "CREATE TABLE m__og_audience LIKE media__og_audience"
    - vendor/bin/drush sql:query "INSERT INTO m__og_audience SELECT * FROM media__og_audience"
    - vendor/bin/drush sql:query "TRUNCATE media__og_audience"
    - vendor/bin/drush sql:query "CREATE TABLE mr__og_audience LIKE media_revision__og_audience"
    - vendor/bin/drush sql:query "INSERT INTO mr__og_audience SELECT * FROM media_revision__og_audience"
    - vendor/bin/drush sql:query "TRUNCATE media_revision__og_audience"
    # field.storage.ogmenu_instance.og_audience
    - vendor/bin/drush sql:query "CREATE TABLE o__og_audience LIKE ogmenu_instance__og_audience"
    - vendor/bin/drush sql:query "INSERT INTO o__og_audience SELECT * FROM ogmenu_instance__og_audience"
    - vendor/bin/drush sql:query "TRUNCATE ogmenu_instance__og_audience"
    # END: Remove in ISAICP-8376

    - ./vendor/bin/drush deploy --yes

    # BEGIN: Remove in ISAICP-8376
    - ./vendor/bin/drush rdf_sync:synchronize node --bundle=solution,collection
    # END: Remove in ISAICP-8376

    - ./vendor/bin/drush search-api:reset-tracker --yes
    - ./vendor/bin/drush joinup:node-access-rebuild
    - ./vendor/bin/drush joinup:search-api-tasks
    - ./vendor/bin/drush twigc --yes
    - rm disable-config-readonly
    - ./vendor/bin/drush joinup:unpublish-alert --category
    - ./scripts/check_status_report.php
  append:
    production:
      - touch disable-eu-oss-catalogue
    acceptance:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly
      # Remove this line when deploying to POC.
      - touch disable-eu-oss-catalogue
      - ./vendor/bin/drush eu-oss:fetch developers_italia
      - ./vendor/bin/drush eu-oss:fetch hosting_platform:open_code
      - ./vendor/bin/drush queue:run eu_oss_catalogue
      - ./vendor/bin/drush queue:run joinup_oss_catalogue_imagecache_warmer
    ephemeral:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly
      - ./vendor/bin/drush eu-oss:fetch developers_italia
      - ./vendor/bin/drush eu-oss:fetch hosting_platform:open_code
      - ./vendor/bin/drush queue:run eu_oss_catalogue
      - ./vendor/bin/drush queue:run joinup_oss_catalogue_imagecache_warmer

php_version: 8.3
extra_pkgs:
  - php8.3-apcu
  - git

mysql_version: "8.0"
mydumper: True

solr: True
solr_version: 8
solr_core: custom
solr_rollback: True
solr_refresh_acc: True
solr_asda: True

virtuoso_image: registry.fpfis.eu/ec-europa/digit-joinup-reference:virtuoso
virtuoso_rollback: True
virtuoso_refresh_acc: True
virtuoso_asda: True

composer_version: 2

install_clean: True
install_clone: True
dev_install_clone: True
dev_install_clean: True
phpunit_clone: False
phpunit_clean: True

# Keep this version in sync with .ddev/docker-compose.selenium-chrome.yaml.
selenium_version: '4.23'

memcached: True

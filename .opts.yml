# This file is used by Toolkit pipelines, allowing to override the upgrade
# procedure, pre-upgrade steps, cron execution command and extra OS packages
# inside the container.
# See https://webgate.ec.europa.eu/fpfis/wikis/display/MULTISITE/Pipeline+configuration+and+override.
# See \EcEuropa\Toolkit\TaskRunner\Commands\CloneCommands::runDeploy().
upgrade_commands:
  default:
    - touch disable-config-readonly

    # BEGIN: Remove after release, in ISAICP-8572.
    - ./vendor/bin/drush sql:query "CREATE TABLE node__isaicp_8569 LIKE node__distribution_parent"
    - ./vendor/bin/drush sql:query "CREATE TABLE node_revision__isaicp_8569 LIKE node_revision__distribution_parent"
    - ./vendor/bin/drush sql:query "INSERT INTO node__isaicp_8569 (bundle, entity_id, revision_id, langcode, delta, distribution_parent_target_id) SELECT bundle, entity_id, revision_id, langcode, delta, distribution_parent_target_id FROM node__distribution_parent"
    - ./vendor/bin/drush sql:query "INSERT INTO node_revision__isaicp_8569 (bundle, entity_id, revision_id, langcode, delta, distribution_parent_target_id) SELECT bundle, entity_id, revision_id, langcode, delta, distribution_parent_target_id FROM node_revision__distribution_parent"
    # END: Remove after release, in ISAICP-8572.

    - ./vendor/bin/drush deploy --yes

    # BEGIN: Remove after release, in ISAICP-8572.
    - ./vendor/bin/drush sql:query "INSERT INTO node__release (bundle, entity_id, revision_id, langcode, delta, release_target_id) SELECT bundle, entity_id, revision_id, langcode, delta, CAST(distribution_parent_target_id AS UNSIGNED) FROM node__isaicp_8569 WHERE distribution_parent_target_id REGEXP '^[0-9]+$'"
    - ./vendor/bin/drush sql:query "INSERT INTO node_revision__release (bundle, entity_id, revision_id, langcode, delta, release_target_id) SELECT bundle, entity_id, revision_id, langcode, delta, CAST(distribution_parent_target_id AS UNSIGNED) FROM node_revision__isaicp_8569 WHERE distribution_parent_target_id REGEXP '^[0-9]+$'"
    - ./vendor/bin/drush sql:query "DROP TABLE node__isaicp_8569"
    - ./vendor/bin/drush sql:query "DROP TABLE node_revision__isaicp_8569"
    - ./vendor/bin/drush rdf_sync:synchronize node --bundle=release
    # END: Remove after release, in ISAICP-8572.

    - ./vendor/bin/drush search-api:reset-tracker --yes
    - ./vendor/bin/drush joinup:node-access-rebuild
    - ./vendor/bin/drush twigc --yes
    - rm disable-config-readonly
    - ./vendor/bin/drush joinup:unpublish-alert --category
    - ./scripts/check_status_report.php
  append:
    acceptance:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly
    ephemeral:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly

php_version: 8.3
extra_pkgs:
  - php8.3-apcu

mysql_version: "8.0"
mydumper: True
# Revert after v1.111.0 is deployed
refresh_database: False

solr: True
solr_version: 8
solr_core: custom
solr_rollback: True
# Revert after v1.111.0 is deployed
solr_refresh_acc: False
solr_asda: True

virtuoso_image: registry.fpfis.eu/ec-europa/digit-joinup-reference:virtuoso
virtuoso_rollback: True
# Revert after v1.111.0 is deployed
virtuoso_refresh_acc: True
virtuoso_asda: True

composer_version: 2

install_clean: True
install_clone: True
dev_install_clone: True
dev_install_clean: True
phpunit_clone: False
phpunit_clean: True

# Keep this version in sync with .ddev/docker-compose.selenium-chrome.yaml.
selenium_version: '4.5.0'

memcached: True

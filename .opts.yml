# This file is used by Toolkit pipelines, allowing to override the upgrade
# procedure, pre-upgrade steps, cron execution command and extra OS packages
# inside the container.
# See https://webgate.ec.europa.eu/fpfis/wikis/display/MULTISITE/Pipeline+configuration+and+override.
# See \EcEuropa\Toolkit\TaskRunner\Commands\CloneCommands::runDeploy().
upgrade_commands:
  default:
    - touch disable-config-readonly

    # TODO: Restore `./vendor/bin/drush deploy --yes` instead of the commands
    # between BEGIN <-> END block, in ISAICP-8376.
    # BEGIN
    - ./vendor/bin/drush updatedb --yes
    - ./vendor/bin/drush config:import --yes
    - ./vendor/bin/drush cache:rebuild
    - ./vendor/bin/drush rdf_sync:mode none
    - ./vendor/bin/drush joinup:create-locked-vocabulary-terms
    - ./vendor/bin/drush deploy:hook --yes
    - ./vendor/bin/drush joinup:sync-locked-vocabulary-terms
    - ./vendor/bin/drush rdf_sync:synchronize taxonomy_term --bundle=legal_type,topic
    - ./vendor/bin/drush rdf_sync:mode delayed
    # END

    - ./vendor/bin/drush search-api:reset-tracker --yes
    - ./vendor/bin/drush joinup:node-access-rebuild
    - rm disable-config-readonly
    - ./vendor/bin/drush joinup:unpublish-alert --category
    - ./scripts/check_status_report.php
  append:
    acceptance:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly
    ephemeral:
      - touch disable-config-readonly
      - ./vendor/bin/drush joinup:acc
      - ./vendor/bin/drush cache:rebuild
      - rm disable-config-readonly

php_version: 8.2
extra_pkgs:
  - php8.2-apcu

mysql_version: "8.0"
mydumper: True

solr: True
solr_version: 8
solr_core: custom
solr_rollback: True
solr_refresh_acc: True
solr_asda: True

virtuoso_image: registry.fpfis.eu/ec-europa/digit-joinup-reference:virtuoso
virtuoso_rollback: True
virtuoso_refresh_acc: True
virtuoso_asda: True

composer_version: 2

install_clean: True
install_clone: True
dev_install_clone: True
dev_install_clean: True
phpunit_clone: False
phpunit_clean: True

selenium_version: '4.5.0'

memcached: True

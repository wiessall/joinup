<!-- Resolution rules box -->
<rect x="6" y="570" width="340" height="200" rx="8" class="rule"/>
<text x="176" y="588" text-anchor="middle" font-size="10" font-family="Arial" font-weight="600" fill="#185FA5">SPARQL resolution rules (v0.9)</text>
<line x1="6" y1="592" x2="346" y2="592" stroke="#185FA5" stroke-width="0.4"/>
<text x="14" y="608" font-size="9" font-family="Courier New, monospace" fill="#27500A">rule/ResolvePrioritySource</text>
<text x="14" y="622" font-size="8" font-family="Arial" fill="#5F5E5A">  SELECT claim with lowest priorityRank</text>
<text x="14" y="636" font-size="8" font-family="Arial" fill="#5F5E5A">  CONSTRUCT { ?innov ?prop ?value }</text>
<text x="14" y="650" font-size="8" font-family="Arial" fill="#5F5E5A">  SET claimWasSelected = true/false</text>
<text x="14" y="668" font-size="9" font-family="Courier New, monospace" fill="#27500A">rule/ResolveAdditiveUnion</text>
<text x="14" y="682" font-size="8" font-family="Arial" fill="#5F5E5A">  CONSTRUCT all distinct values</text>
<text x="14" y="698" font-size="8" font-family="Arial" fill="#5F5E5A">  All claimWasSelected = true</text>
<text x="14" y="716" font-size="9" font-family="Courier New, monospace" fill="#27500A">rule/ResolveMajorityVote</text>
<text x="14" y="730" font-size="8" font-family="Arial" fill="#5F5E5A">  COUNT claims per value; pick highest count</text>
<text x="14" y="746" font-size="9" font-family="Courier New, monospace" fill="#27500A">rule/ResolveConvertAndPrioritize</text>
<text x="14" y="760" font-size="8" font-family="Arial" fill="#5F5E5A">  Apply TaxonomyMapping → PrioritySource</text>


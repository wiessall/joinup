<!-- Legend -->
<rect x="6" y="788" width="668" height="258" rx="6" fill="#F8F8F2" stroke="#D3D1C7" stroke-width="0.7"/>
<text class="note" x="18" y="806" font-weight="500">v0.9 — Automated Resolution Layer</text>
<line x1="6" y1="810" x2="674" y2="810" stroke="#D3D1C7" stroke-width="0.4"/>

<text class="note" x="18" y="826" font-weight="500" fill="#185FA5">FieldResolutionPolicy pattern</text>
<text class="note" x="18" y="842">Declared once per (DataSource, property) via sti_atio:hasResolutionPolicy.</text>
<text class="note" x="18" y="858">priorityRank (integer) determines source precedence for PrioritySource strategy.</text>
<text class="note" x="18" y="874">Global defaults declared on property URIs via sti_atio:defaultResolutionStrategy.</text>

<text class="note" x="18" y="894" font-weight="500" fill="#3B6D11">8 resolution strategies</text>
<text class="note" x="18" y="910">PrioritySource — lowest rank wins  |  MostRecent — latest harvest wins</text>
<text class="note" x="18" y="926">MajorityVote — most common value  |  AdditiveUnion — all values asserted (multi-valued)</text>
<text class="note" x="18" y="942">ConvertAndPrioritize — TaxonomyMapping then PrioritySource</text>
<text class="note" x="18" y="958">Floor / Ceiling — min or max value (ordinal or numeric)</text>
<text class="note" x="18" y="974">Average — arithmetic mean (numeric ONLY: estimatedUsers, NOT TRL)</text>

<text class="note" x="18" y="994" font-weight="500" fill="#993C1D">WARNING: Average is NOT appropriate for ordinal concept scales (TRL, adoption levels)</text>
<text class="note" x="18" y="1010" fill="#993C1D">The mean of TRL-5 and TRL-7 is not a valid TRL concept. Use Floor, Ceiling, or MajorityVote.</text>

<text class="note" x="18" y="1030" fill="#888780">@prefix sti_atio: &lt;https://sti-portal.fao.org/ontology/sti-atio#&gt;  |  v0.9</text>
<text class="note" x="18" y="1046" fill="#888780">2,011 triples  |  64 classes  |  117 object properties  |  91 datatype properties</text>
</svg>

<title>sti_atio v0.9 — Automated Field Resolution Layer</title>
<desc>RDF graph in standard notation showing the FieldResolutionPolicy pattern. Two DataSources declare resolution policies (priorityRank) and default strategies are declared on properties. SPARQL resolution rules assert canonical values on Innovation. FieldClaims record which strategy was applied and whether their value was selected.</desc>

<rect x="18" y="803" width="38" height="16" rx="8" class="atio"/>
<text class="note" x="62" y="815">sti_atio:Innovation (real-world, public graph) — NOT prov:Entity</text>
<rect x="18" y="825" width="38" height="16" rx="8" class="rec"/>
<text class="note" x="62" y="837">sti_atio:InnovationRecord (information object, provenance graph) — prov:Entity + foaf:Document</text>
<rect x="18" y="847" width="38" height="14" rx="6" class="clm"/>
<text class="note" x="62" y="859">sti_atio:FieldClaim (provenance graph) — claimSubject → Innovation; hasFieldClaim from Record</text>
<rect x="18" y="869" width="38" height="16" rx="8" class="prov"/>
<text class="note" x="62" y="881">Pipeline entity (AIExtractedInnovation, prov:Entity)</text>
<rect x="18" y="891" width="38" height="12" rx="6" class="strat"/>
<text class="note" x="62" y="901">Resolution strategy (automated, v0.9)</text>

<text class="note" x="18" y="922" font-weight="500" fill="#185FA5">Key v0.9 structural changes vs previous instance mapping</text>
<text class="note" x="18" y="938" fill="#5F5E5A">atioi:d5bb4237...  a sti_atio:Innovation   (was: atio:Innovation — single node carrying everything)</text>
<text class="note" x="18" y="954" fill="#5F5E5A">atioir:d5bb4237... a sti_atio:InnovationRecord  (NEW — data management node)</text>
<text class="note" x="18" y="970" fill="#5F5E5A">atioi:... sti_atio:isDescribedBy atioir:...   (NEW — foaf:isPrimaryTopicOf sub-property)</text>
<text class="note" x="18" y="986" fill="#5F5E5A">Record carries: recordPublishedAt, recordCurationStatus, recordDerivedFromExtracted…</text>
<text class="note" x="18" y="1002" fill="#5F5E5A">Innovation carries: all real-world semantic properties (readiness, type, country, SDG…)</text>
<text class="note" x="18" y="1018" fill="#5F5E5A">FieldClaim.claimSubject → Innovation  (semantic subject of the claim)</text>
<text class="note" x="18" y="1034" fill="#5F5E5A">InnovationRecord.hasFieldClaim → FieldClaim  (container/grouping link)</text>

<text class="note" x="18" y="1054" font-weight="500" fill="#3B6D11">Resolution strategies (v0.9 — automated, no manual curation)</text>
<text class="note" x="18" y="1070" fill="#3B6D11">PrioritySource: readinessLevel, adoptionLevel, investmentType, innovationStage</text>
<text class="note" x="18" y="1086" fill="#3B6D11">AdditiveUnion: thematicArea, useCase, challengeAddressed, innovativeFeature, impactSDG, prospectiveUser</text>
<text class="note" x="18" y="1102" fill="#3B6D11">Geography (originCountry, adoptionCountry, language): claimEligible=false, normalised at ingestion</text>

<text class="note" x="18" y="1122" fill="#888780">Namespace: @prefix sti_atio: &lt;https://sti-portal.fao.org/ontology/sti-atio#&gt;</text>
<text class="note" x="18" y="1138" fill="#888780">261 triples total  |  atioi: = innovations/  |  atioir: = innovation-records/</text>
<text class="note" x="18" y="1154" fill="#888780">atioterm: URIs are placeholders — resolve via Drupal taxonomy API</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="1180" viewBox="0 0 680 1180" xmlns="http://www.w3.org/2000/svg">
<title>Farm Suite (Greenovator) — RDF instance graph v0.9, standard node-edge notation</title>
<desc>RDF graph showing Farm Suite split into Innovation (real-world, teal) and InnovationRecord (data, blue) connected by isDescribedBy. FieldClaims carry claimSubject back to Innovation. Pipeline entities in amber. All using sti_atio: namespace.</desc>
<defs>

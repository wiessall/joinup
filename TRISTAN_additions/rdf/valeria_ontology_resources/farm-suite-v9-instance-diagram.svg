</marker>
<style>
rect{fill:white;}
text{font-family:"Courier New",monospace;font-size:10px;fill:#2C2C2A;}
.pred{font-size:9px;fill:#3B6D11;font-style:italic;}
.type{font-size:9px;fill:#534AB7;}
.note{font-size:9px;fill:#444441;font-family:Arial,sans-serif;}
.nr  {fill:#E6F1FB;stroke:#185FA5;stroke-width:1;}
.atio{fill:#E1F5EE;stroke:#1D9E75;stroke-width:1.5;}
.rec {fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5;}
.clm {fill:#EEEDFE;stroke:#7F77DD;stroke-width:1;}
.prov{fill:#FAEEDA;stroke:#BA7517;stroke-width:1.2;}

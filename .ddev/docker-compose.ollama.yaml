services:
  ollama:
    image: ollama/ollama
    volumes:
      - /home/tristan/.ollama:/root/.ollama
    networks:
      ddev_default: null
      default: null
    restart: "no"
    container_name: ddev-${DDEV_SITENAE}-ollama
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

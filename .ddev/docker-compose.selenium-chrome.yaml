#ddev-generated
# Remove the line above if you don't want this file to be overwritten when you run
# ddev get ddev/ddev-selenium-standalone-chrome
#
# This file comes from https://github.com/ddev/ddev-selenium-standalone-chrome
#

services:
  selenium-chrome:
    # Keep this version in sync with .opts.yml.
    # Note ISAICP-9647: pinned since 4.29.0 (Chrome 134) has a bug causing Behat
    # to proceed before the page fully loads, especially after POST requests.
    # See https://issues.chromium.org/issues/402796660
    image: selenium/standalone-chrome:4.28.1
    platform: linux/amd64  # Force AMD64 architecture
    container_name: ddev-${DDEV_SITENAME}-selenium-chrome
    expose:
      #      The internal noVNC port, which operates over HTTP so it can be exposed
      #      through the router.
      - 7900
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTPS_EXPOSE=7900:7900
      - HTTP_EXPOSE=7910:7900
      - SE_VNC_NO_PASSWORD=1
      - SCREEN_WIDTH=1600
      - SCREEN_HEIGHT=1200
    external_links:
      - ddev-router:${DDEV_SITENAME}.${DDEV_TLD}
    # To enable VNC access for traditional VNC clients like macOS "Screen Sharing",
    # uncomment the following two lines.
    #ports:
    #  - "5900:5900"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
      - ".:/mnt/ddev_config"
      - "ddev-global-cache:/mnt/ddev-global-cache"
    command:
      - bash
      - -c
      - |
        # Import mkcert root CA into Chrome NSS DB (to avoid certificate errors).
        mkdir -p /home/seluser/.pki/nssdb
        certutil -d sql:/home/seluser/.pki/nssdb -A -t "C,," -n mkcert -i /mnt/ddev-global-cache/mkcert/rootCA.pem || true
        # Start Selenium normally.
        exec /opt/bin/entry_point.sh

  web:
    links:
      - selenium-chrome

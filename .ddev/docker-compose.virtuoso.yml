services:

  virtuoso:
    container_name: ddev-${DDEV_SITENAME}-virtuoso
    image: openlink/virtuoso-opensource-7:7
    labels:
        com.ddev.site-name: ${DDEV_SITENAME}
        com.ddev.approot: ${DDEV_APPROOT}
    expose:
      - 1111
      - 8890
    ports:
      - "8890:8890"
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: '8890:8890'
      DBA_PASSWORD: dba
      DAV_PASSWORD: dav
      # Virtuoso .ini overrides. Pattern: VIRT_$SECTION_$KEY: $VALUE
      # See https://hub.docker.com/r/openlink/virtuoso-opensource-7
      VIRT_HTTPServer_KeepAliveTimeout: 60
      VIRT_Parameters_DirsAllowed: ., ../vad
      VIRT_Parameters_MaxDirtyBuffers: 250000
      VIRT_Parameters_NumberOfBuffers: 340000
      VIRT_Parameters_O_DIRECT: 1
      VIRT_Parameters_ThreadCleanupInterval: 1
      VIRT_Replication_ServerEnable: 0
      VIRT_SPARQL_DefaultQuery: 'SELECT ?g ?s ?p ?o WHERE { GRAPH ?g { ?s ?p ?o . } } LIMIT 500'
      VIRT_SPARQL_MaxConstructTriples: 1000000
      VIRT_SPARQL_MaxQueryExecutionTime: 120
      VIRT_SPARQL_ResultSetMaxRows: 1000000
    volumes:
      - virtuoso:/opt/virtuoso-opensource/database
      - ./virtuoso/entrypoint.sh:/opt/virtuoso-opensource/bin/virtuoso-entrypoint.sh
      - ./virtuoso/snapshot:/opt/virtuoso-opensource/tmp
      - ./virtuoso/initdb.d:/opt/virtuoso-opensource/initdb.d
      # Needed to recognize .ddev/commands/virtuoso container commands.
      - .:/mnt/ddev_config
volumes:
  virtuoso:

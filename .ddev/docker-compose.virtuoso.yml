services:

  virtuoso:
    container_name: ddev-${DDEV_SITENAME}-virtuoso
    build:
      context: ./virtuoso
    labels:
        com.ddev.site-name: ${DDEV_SITENAME}
        com.ddev.approot: ${DDEV_APPROOT}
    expose:
      - 1111
      - 8890
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: '8890:8890'
      SPARQL_UPDATE: 'true'
      # Virtuoso .ini overrides. Pattern: VIRT_$SECTION_$KEY=$VALUE
      # See https://hub.docker.com/r/tenforce/virtuoso
      VIRT_Parameters_O_DIRECT: 1
      VIRT_Parameters_ThreadCleanupInterval: 1
      VIRT_Parameters_NumberOfBuffers: 340000
      VIRT_Parameters_MaxDirtyBuffers: 250000
      VIRT_Replication_ServerEnable: 0
      VIRT_SPARQL_ResultSetMaxRows: 1000000
    volumes:
      - ./virtuoso/snapshot:/data/backups
      - ./virtuoso/script/entrypoint.sh:/entrypoint.sh
      # Needed to recognize .ddev/commands/virtuoso container commands.
      - .:/mnt/ddev_config
    command:
      - '/bin/bash'
      - '-c'
      - 'chmod +x /entrypoint.sh && /entrypoint.sh'

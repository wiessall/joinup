name: joinup
type: drupal10
docroot: web
php_version: "8.2"
webserver_type: apache-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mysql
    version: "8.0"
hooks:
    post-start:
        - exec: nvm install 20
        - exec: nvm install-latest-npm
    pre-start:
        - exec-host: rm -f .ddev/solr-standalone/conf
        - exec-host: ln -s ../../resources/solr/conf .ddev/solr-standalone/
webimage_extra_packages: [php-apcu]
use_dns_when_possible: true
timezone: Europe/Brussels
composer_version: "2"
disable_settings_management: true
web_environment:
    - DRUPAL_TRUSTED_HOST_PATTERNS=joinup.ddev.site

# DDEV instance configuration documentation:
# - Basic: https://ddev.readthedocs.io/en/stable/users/configuration/config/
# - Extend/override: https://ddev.readthedocs.io/en/stable/users/extend/customization-extendibility/#extending-configyaml-with-custom-configyaml-files

ddev_version_constraint: ">=v1.23.0"
name: joinup
type: drupal
docroot: web
php_version: "8.3"
webimage_extra_packages:
    - php-apcu
    # Both required by mydumper.
    - libatomic1
    - zstd

# It's not possible to use fpfis/httpd-php because DDEV is strongly advising
# against using a non-DDEV image. But this has no impact on the Joinup code runs
# in CI/CD or on production.
# See:
# - https://ddev.readthedocs.io/en/latest/users/configuration/config/#webimage
# - https://github.com/ddev/ddev/issues/5497
webserver_type: apache-fpm
xdebug_enabled: false

# Tip: Run `ddev describe -j | jq -r .raw.dbinfo.published_port` to get the port
# exposed on host. DDEV is assigning a random, unused port, for each instance.
database:
    type: mysql
    version: "8.0"

timezone: Europe/Brussels
additional_hostnames: [ ]
additional_fqdns: [ ]
use_dns_when_possible: true
composer_version: "2"
web_environment: [ ]
disable_settings_management: true
nodejs_version: "20"

hooks:
    pre-start:
        # Symlink the Solr config to be exposed into container. The Digit CI
        # retrieves the Apache Solr configuration from resources/solr/conf dir.
        -   exec-host: rm -f .ddev/solr-standalone/conf
        -   exec-host: ln -s ../../resources/solr/conf .ddev/solr-standalone/

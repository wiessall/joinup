# DDEV instance configuration documentation:
# - Basic: https://ddev.readthedocs.io/en/stable/users/configuration/config/
# - Extend/override: https://ddev.readthedocs.io/en/stable/users/extend/customization-extendibility/#extending-configyaml-with-custom-configyaml-files

ddev_version_constraint: ">=v1.23.0"
type: drupal
docroot: web
php_version: "8.3"
webimage_extra_packages:
    - php-apcu
    # Both required by mydumper.
    - libatomic1
    - zstd
    # Required by python2.
    - mime-support

# It's not possible to use fpfis/httpd-php because DDEV is strongly advising
# against using a non-DDEV image. But this has no impact on the Interoperable Europe Portal code runs
# in CI/CD or on production.
# See:
# - https://ddev.readthedocs.io/en/latest/users/configuration/config/#webimage
# - https://github.com/ddev/ddev/issues/5497
webserver_type: apache-fpm
xdebug_enabled: false

# Tip: Run `ddev describe -j | jq -r .raw.dbinfo.published_port` to get the port
# exposed on host. DDEV is assigning a random, unused port, for each instance.
database:
    type: mysql
    version: "8.0"

timezone: Europe/Brussels
additional_hostnames: [ ]
additional_fqdns: [ ]
project_tld: ddev.local
use_dns_when_possible: false
composer_version: "2"
web_environment:
    - DRUPAL_TRUSTED_HOST_PATTERNS=.*
    - DRUPAL_BASE_URL=https://${DDEV_SITENAME}.${DDEV_TLD}
    - DRUPAL_FILE_TEMP_PATH=/var/www/html/tmp
    - DRUPAL_DATABASE_HOST=db
    - DRUPAL_DATABASE_USERNAME=db
    - DRUPAL_DATABASE_PASSWORD=db
    - DRUPAL_DATABASE_NAME=db
    - DRUPAL_SPARQL_HOSTNAME=virtuoso
    - DRUPAL_SPARQL_USER_READONLY=SPARQL_RO
    - DRUPAL_SPARQL_PASSWORD_READONLY=readonly
    - SEARCH_API_SERVER_SS_SOLR_HOST=solr-standalone
    - SYMFONY_DEPRECATIONS_HELPER=max[total]=0&ignoreFile=core/.deprecation-ignore.txt
    - WEBDRIVER_URL=http://selenium-chrome:4444/wd/hub
    - DTT_API_URL=http://selenium-chrome:4444/wd/hub
    - ARTIFACTS_DIR=/var/www/html/tmp
    # Set the following to "on" to enable HTTPS in the DDEV web container. The
    # superglobal variable base_url is constructed by checking the HTTPS server
    # variable, and \Drupal\Core\File\FileUrlGenerator::generateAbsoluteString()
    # uses this superglobal variable to generate URLs. If HTTPS is not enabled in
    # the web container, the base_url will be constructed with "http" instead of
    # "https", and the URLs generated by \Drupal\Core\File\FileUrlGenerator will
    # be "http" instead of "https".
    # @see \Drupal\Core\DrupalKernel::initializeRequestGlobals()
    # @see \Symfony\Component\HttpFoundation\Request::isSecure()
    # @see \Drupal\Core\File\FileUrlGenerator::generateAbsoluteString()
    - HTTPS=on
    # Always allow xdebug with drush, since ddev works by enabling/disabling the
    # PHP extension already.
    - DRUSH_ALLOW_XDEBUG=1
disable_settings_management: true
nodejs_version: "20"
# Affects only macOS developers.
performance_mode: global

upload_dirs:
  - sites/default/files
  - ../private

hooks:
    pre-start:
        # Symlink the Solr config to be exposed into container. The Digit CI
        # retrieves the Apache Solr configuration from resources/solr/conf dir.
        -   exec-host: rm -f .ddev/solr-standalone/conf
        -   exec-host: ln -s ../../resources/solr/conf .ddev/solr-standalone/

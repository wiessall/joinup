services:
  joinup.behat_environment.subscriber:
    class: Drupal\joinup\Listener\BehatEnvironmentListener
    tags:
      - { name: event_dispatcher.subscriber }
  joinup.feature_time_logger.subscriber:
    class: Drupal\joinup\Listener\FeatureTimeLoggerListener
    arguments: ['%paths.base%', '@cli.input',  '@cli.output']
    tags:
      - { name: event_dispatcher.subscriber }

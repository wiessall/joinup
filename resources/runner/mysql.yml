# MySQL configs and commands.

mysql:
  dumpfile: ${joinup.db_dir}/mysql/mysql.sql
commands:

  # Unpack and prepare the MySQL dump.
  mysql:unpack-dump:
    # Cleanup any stale data.
    - task: remove
      file: ${mysql.dumpfile}
    # Unpack and organize.
    - task: exec
      command: gunzip -c ${toolkit.tmp_folder}/mysql.gz > ${mysql.dumpfile}
    # Remove the MySQL trigger definer.
    - task: exec
      command: perl -i -pe 's/DEFINER="[^"]+"@"[^"]+"//g' ${mysql.dumpfile}
    # Support MySQL 8.
    - task: exec
      command: perl -i -pe 's/,NO_AUTO_CREATE_USER//g' ${mysql.dumpfile}

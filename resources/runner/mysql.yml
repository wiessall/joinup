# MySQL configs and commands.

mysql:
  dumpfile: ${joinup.db_dir}/mysql/mysql.sql
commands:

  # Downloads, unpacks and prepares the MySQL dump.
  mysql:download-dump:
    # Cleanup any stale data.
    - task: remove
      file: ${mysql.dumpfile}
    # Unpack and organize.
    - task: exec
      command: gunzip -c ${joinup.db_dir}/mysql.gz > ${mysql.dumpfile}
    # Remove the MySQL trigger definer.
    - task: exec
      command: perl -i -pe 's/DEFINER="[^"]+"@"[^"]+"//g' ${toolkit.clone.dumpfile}
    # Support MySQL 8.
    - task: exec
      command: perl -i -pe 's/,NO_AUTO_CREATE_USER//g' ${toolkit.clone.dumpfile}
    # Cleanup.
    - task: remove
      file: ${joinup.db_dir}/mysql.gz

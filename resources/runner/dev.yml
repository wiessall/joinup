# Development configs and commands

dev:
  # Controls when static code analysis (grumphp) runs.
  # Options: pre-push / pre-commit / disable.
  git_hook_on: pre-push
  modules:
    - admin_toolbar
    - config_update
    - devel
    - field_ui
    - masquerade
    - memcache_admin
    - og_ui
    - page_manager_ui
    - stage_file_proxy
    - views_ui

commands:

  # Downloads all backends backups.
  dev:download-databases:
    - task: run
      command: toolkit:download-dump
      options:
        yes: null
    - task: run
      command: mysql:unpack-dump
    - task: run
      command: virtuoso:download-snapshot
    - task: run
      command: solr:download-snapshot

  dev:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${dev.modules}

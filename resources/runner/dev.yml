# Development configs and commands

phpstan:
  bin: ${joinup.dir}/vendor/bin/phpstan

dev:
  modules:
    - admin_toolbar
    - config_update
    - devel
    - field_ui
    - masquerade
    - memcache_admin
    - page_manager_ui
    - stage_file_proxy
    - views_ui

rector:
  bin: ${joinup.dir}/vendor/bin/rector

commands:

  # Downloads all backends backups.
  dev:download-databases:
    - task: run
      command: toolkit:download-dump
      options:
        yes: null
    - task: run
      command: mysql:unpack-dump
    - task: run
      command: virtuoso:download-snapshot
    - task: run
      command: solr:download-snapshot

  dev:install-modules:
    - task: run
      command: config-readonly:disable
    - task: run
      command: drush:module-install
      arguments: ${dev.modules}
    - task: run
      command: config-readonly:enable

  dev:demo-users:
    - task: run
      command: config-readonly:disable
    # Make sure CAS mock server module is installed.
    - task: run
      command: drush:module-install
      arguments: joinup_cas_mock_server
    # Administrator user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - administrator
      options:
        mail: administrator@example.com
        password: administrator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - administrator
        - administrator
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - administrator
      options:
        email: administrator@example.com
        password: administrator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - administrator
        - administrator
      options:
        yes: null
        root: ${joinup.site_dir}
    # Developer user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - developer
      options:
        mail: developer@example.com
        password: developer
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - developer
      options:
        email: developer@example.com
        password: developer
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - developer
        - developer
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - developer
        - developer
      options:
        yes: null
        root: ${joinup.site_dir}
    # Moderator user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - moderator
      options:
        mail: moderator@example.com
        password: moderator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - moderator
        - moderator
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - moderator
      options:
        email: moderator@example.com
        password: moderator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - moderator
        - moderator
      options:
        yes: null
        root: ${joinup.site_dir}
    # User without any roles.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - user
      options:
        mail: user@example.com
        password: user
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - user
      options:
        email: user@example.com
        password: user
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - user
        - user
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: run
      command: config-readonly:enable

  dev:import-sparql-fixtures:
    - task: run
      command: virtuoso:import-fixtures
      arguments:
        - resources/adms/adms-definition.rdf

  dev:rector:
    - task: exec
      command: ${rector.bin} process --memory-limit=-1 src/ tests/src/ web/modules/custom/ web/profiles/joinup/ web/themes/ventuno/ web/themes/iop/
    - task: run
      command: testing:phpcs-setup
      # Not all Rector changes are Drupal coding standards compliant.
    - task: exec
      command: ${phpcs.file.phpcbf.bin}
      # Show what wasn't fixed automatically.
    - task: exec
      command: ${phpcs.file.bin}

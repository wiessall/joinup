# Development configs and commands

dev:
  # Controls when static code analysis (grumphp) runs.
  # Options: pre-push / pre-commit / disable.
  git_hook_on: pre-push
  modules:
    - admin_toolbar
    - config_update
    - devel
    - field_ui
    - masquerade
    - memcache_admin
    - og_ui
    - page_manager_ui
    - stage_file_proxy
    - views_ui
    - restui

commands:

  # Downloads all backends backups.
  dev:download-databases:
    - task: run
      command: toolkit:download-dump
      options:
        yes: null
    - task: run
      command: mysql:unpack-dump
    - task: run
      command: virtuoso:download-snapshot
    - task: run
      command: solr:download-snapshot

  dev:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${dev.modules}

  dev:demo-users:
    # Make sure CAS mock server module is installed.
    - task: run
      command: drush:module-install
      arguments: joinup_cas_mock_server
    # Administrator user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - administrator
      options:
        mail: administrator@example.com
        password: administrator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - administrator
        - administrator
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - administrator
      options:
        email: administrator@example.com
        password: administrator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - administrator
        - administrator
      options:
        yes: null
        root: ${joinup.site_dir}
    # Developer user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - developer
      options:
        mail: developer@example.com
        password: developer
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - developer
      options:
        email: developer@example.com
        password: developer
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - developer
        - developer
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - developer
        - developer
      options:
        yes: null
        root: ${joinup.site_dir}
    # Moderator user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - moderator
      options:
        mail: moderator@example.com
        password: moderator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - moderator
        - moderator
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - moderator
      options:
        email: moderator@example.com
        password: moderator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - moderator
        - moderator
      options:
        yes: null
        root: ${joinup.site_dir}
    # User without any roles.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - user
      options:
        mail: user@example.com
        password: user
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - user
      options:
        email: user@example.com
        password: user
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - user
        - user
      options:
        yes: null
        root: ${joinup.site_dir}
      # Translator user.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:create
        - translator
      options:
        mail: translator@example.com
        password: translator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - translator
        - translator
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:user-create
        - translator
      options:
        email: translator@example.com
        password: translator
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas:set-cas-username
        - translator
        - translator
      options:
        yes: null
        root: ${joinup.site_dir}

# Toolkit overrides.

toolkit:
  project_id: digit-joinup
  tmp_folder: ${joinup.dir}/tmp
  clone:
    dumpfile: mysql.tar
    nextcloud:
      services:
        - mysql
        - solr
  components:
    # Disable 'toolkit-components' job check for outdated packages. The Interoperable Europe Portal
    # dependencies policy is to update all dependencies after each release.
    outdated:
      check: false

  build:
    dist:
      commands:
        # Recursively remove .git directories.
        - task: exec
          command: find ${toolkit.build.dist.root} -type d -name .git -prune -exec rm -rf {} \;
        # More cleanup.
        - task: exec
          command: rm
          arguments:
            - ${toolkit.build.dist.root}/.editorconfig
            - ${toolkit.build.dist.root}/.gitattributes
            - ${toolkit.build.dist.root}/.gitignore
            - ${toolkit.build.dist.root}/bcl-builder.config.js
            - ${toolkit.build.dist.root}/package.json
            - ${toolkit.build.dist.root}/package-lock.json
        - task: remove
          file: ${toolkit.build.dist.root}/node_modules

  test:
    phpunit:
      commands:
        after:
          - task: exec
            command: ${drush.bin} pmu joinup_test_content -y
          - task: exec
            command: ${drush.bin} en default_content joinup_test_content -y
          - task: exec
            command: SELENIUM_REMOTE_URL=$WEBDRIVER_URL ./node_modules/.bin/playwright test --retries=3
          - task: exec
            command: ${drush.bin} pmu default_content joinup_test_content -y
          # To resolve issues, inspect $raw_violations using xdebug breakpoints in:
          # @see \Drupal\config_inspector\Commands\InspectorCommands::inspect
          - { task: exec, command: "${drush.bin} config:inspect --only-error --format=csv | grep -v \"^>\" | grep -v \"^$\" | tail -n +2 | grep -q \".\" && exit 1 || exit 0" }

  install:
    clone:
      commands:
        before:
          - task: exec
            command: ${drush.bin} memcache:flush-all
          - task: run
            command: drupal:settings
            arguments:
              - install
        after:
          - task: run
            command: testing:install-modules
          - task: exec
            command: ${drush.bin}
            arguments:
              - cas-mock-server:start
            options:
              yes: null
              root: ${joinup.site_dir}
          - task: exec
            command: ${drush.bin}
            arguments:
              - php:eval
              - if (node_access_needs_rebuild()) { node_access_rebuild(); }
          - task: run
            command: drupal:settings
            arguments:
              - site-clone
          - task: exec
            command: test ! -z "$CI" || vendor/bin/run solr:build-core-config

commands:

  # Overrides the toolkit:build-dev command.
  toolkit:build-dev:
    - task: exec
      command: mkdir ${joinup.files_public_dir} -p -m ug=rwx,o=
    - task: copy
      from: ${joinup.site_dir}/sites/default/default.services.yml
      to: ${joinup.site_dir}/sites/default/services.yml
    - task: run
      command: dev:setup-git-hook
    - task: process
      source: ${joinup.dir}/behat.yml.dist
      destination: ${joinup.dir}/behat.yml
    - task: exec
      command: mkdir ${joinup.files_private_dir} -p -m ug=rwx,o=
    - task: exec
      command: mkdir ${joinup.files_temp_dir} -p -m ug=rwx,o=

  # Overrides toolkit:install-clean.
  toolkit:install-clean:
    - task: exec
      command: ${drush.bin} memcache:flush-all
    - task: run
      command: drupal:settings
      arguments:
        - install
    - task: run
      command: drupal:site-install
      options:
        existing-config: null
    - task: run
      command: testing:install-modules
    - task: run
      command: drupal:settings
      arguments:
        - site-clean
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:start
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - php:eval
        - if (node_access_needs_rebuild()) { node_access_rebuild(); }
    # UID1 is a regular user, but for local development we keep its powers.
    - task: exec
      command: ${drush.bin}
      arguments:
        - user:role:add
        - developer
      options:
        uid: 1
    - task: exec
      command: test ! -z "$CI" || vendor/bin/run solr:build-core-config
    - task: exec
      command: chmod u=rw,g=r,o= ${joinup.files_private_dir}/simple_oauth/private.key ${joinup.files_private_dir}/simple_oauth/public.key

  # Replace toolkit test commands to use GrumPHP.
  toolkit:test-phpcs:
    # Handle a potential case where the repo has been shallow cloned. Typically,
    # this happens in GitLab pipelines, where the repos are shallow cloned for
    # performance reasons. A shallow clone repository prevents us to get the
    # latest Git tag as no tags are available. But we require this info during
    # the coding standards check.
    # See \Joinup\CodingStandards\Sniffs\NamingConventions\ValidUpdateNameSniff
    - { task: exec, command: test "$(git rev-parse --is-shallow-repository)" = "false" || git fetch --unshallow }
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpcs" }
  toolkit:test-phpmd:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpmd" }
  toolkit:test-phpstan:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpstan" }
  toolkit:lint-css:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-css" }
  toolkit:lint-gherkin:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-gherkin" }
  toolkit:lint-js:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-js" }
  toolkit:lint-php:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-php" }
  toolkit:lint-twig:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-twig" }
  toolkit:lint-yaml:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=lint-yaml" }

  # Extra commands to run on Gitlab after qa-code-review.
  toolkit:post-qa-code-review:
    - task: run
      command: toolkit:lint-css
    - task: run
      command: toolkit:lint-twig
    - task: run
      command: toolkit:lint-gherkin
    - task: run
      command: testing:unused-behat

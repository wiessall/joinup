# Toolkit overrides.

toolkit:
  project_id: digit-joinup
  tmp_folder: ${joinup.dir}/tmp
  clone:
    asda_url: ${env.ASDA_URL}
    dumpfile: ${mysql.dump_dir}/mysql.sql

  build:
    dist:
      commands:
        # Recursively remove .git directories.
        - task: exec
          command: find ${toolkit.build.dist.root} -type d -name .git -prune -exec rm -rf {} \;
        # More cleanup.
        - task: exec
          command: rm
          arguments:
            - ${toolkit.build.dist.root}/.editorconfig
            - ${toolkit.build.dist.root}/.gitattributes
            - ${toolkit.build.dist.root}/.gitignore
            # Drupal Finder, and consequently Drush, are still needing
            # composer.json to locate the root dir. Remove only composer.lock.
            - ${toolkit.build.dist.root}/composer.lock
        # Build theme assets.
        - task: exec
          command: cd ${toolkit.build.dist.root}/web/themes/ventuno && npm ci
        # Remove theme development dependencies.
        - task: remove
          file: ${toolkit.build.dist.root}/web/themes/ventuno/node_modules
        - task: remove
          file: ${toolkit.build.dist.root}/web/themes/ventuno/package.json
        - task: remove
          file: ${toolkit.build.dist.root}/web/themes/ventuno/package-lock.json

command:
  toolkit:
    download-dump:
      options:
        asda-url: https://asda.fpfis.tech.ec.europa.eu/ec-europa/digit-joinup-reference/dumps
        dumpfile: ${mysql.dump_dir}/mysql.sql
    install-dump:
      options:
        dumpfile: ${mysql.dump_dir}/mysql.sql

commands:

  # Overrides the toolkit:build-dev command.
  toolkit:build-dev:
    - task: mkdir
      dir: ${joinup.files_public_dir}
      mode: 0775
    - task: copy
      from: ${joinup.site_dir}/sites/default/default.services.yml
      to: ${joinup.site_dir}/sites/default/services.yml
    - task: run
      command: testing:phpcs-setup
    - task: run
      command: testing:phpcs-git-hook
    - task: process
      source: ${joinup.dir}/behat.yml.dist
      destination: ${joinup.dir}/behat.yml
    - task: mkdir
      dir: ${joinup.files_private_dir}
    - task: mkdir
      dir: ${env.DRUPAL_FILE_TEMP_PATH}
    - task: run
      command: joinup:build-assets

  # Overrides toolkit:install-clean.
  toolkit:install-clean:
    - task: run
      command: joinup:environment
    - task: run
      command: sparql:empty
    - task: run
      command: solr:empty
    - task: run
      command: redis:flush-all
    - task: run
      command: drupal:settings
      arguments:
        - install
    - task: run
      command: config-readonly:disable
    - task: run
      command: drupal:site-install
    - task: run
      command: dev:import-sparql-fixtures
    # This is a safety net for the eventuality a developer lacks a mail catcher
    # tool on their local environment. See the 'Development mail collector'
    # `settings.php` section from `resources/runner/drupal.yml` for details.
    - task: run
      command: drush:module-install
      arguments:
        - devel
    - task: run
      command: testing:install-modules
    - task: run
      command: drupal:settings
      arguments:
        - site-clean
    # Checks for extensions metadata deprecations. Note that we run this after
    # site install as we need a bootstrapped Drupal.
    - task: exec
      command: ${drush.bin} joinup:check-extension-metadata-deprecation
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:start
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - php:eval
        - if (node_access_needs_rebuild()) { node_access_rebuild(); }
    - task: run
      command: config-readonly:enable
    - task: exec
      command: ${drush.bin}
      arguments:
        - core:requirements

  # Overrides the toolkit:install-clone command.
  toolkit:install-clone:
    - task: run
      command: joinup:environment
    - task: run
      command: redis:flush-all
    - task: run
      command: drupal:settings
      arguments:
        - install
    - task: run
      command: toolkit:install-dump
    - task: run
      command: toolkit:run-deploy
    # The `toolkit:run-deploy` command has enabled config read-only.
    - task: run
      command: config-readonly:disable
    # This is a safety net for the eventuality a developer lacks a mail catcher
    # tool on their local environment. See the 'Development mail collector'
    # `settings.php` section from `resources/runner/drupal.yml` for details.
    - task: run
      command: drush:module-install
      arguments:
        - devel
    - task: run
      command: testing:install-modules
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:start
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - php:eval
        - if (node_access_needs_rebuild()) { node_access_rebuild(); }
    - task: run
      command: drupal:settings
      arguments:
        - site-clone
    - task: run
      command: config-readonly:enable
    - task: exec
      command: ${drush.bin}
      arguments:
        - core:requirements

  # Overrides the toolkit:test-phpcs command.
  toolkit:test-phpcs:
    # Handle a potential case where the repo has been shallow cloned. Typically,
    # this happens in GitLab pipelines, where the repos are shallow cloned for
    # performance reasons. A shallow clone repository prevents us to get the
    # latest Git tag as no tags are available. But we require this info during
    # the coding standards check.
    # See \Joinup\CodingStandards\Sniffs\NamingConventions\ValidUpdateNameSniff
    - task: exec
      command: test "$(git rev-parse --is-shallow-repository)" = "false" || git fetch --unshallow
    - task: run
      command: testing:phpcs-setup
    - task: exec
      command: ${phpcs.file.bin}
    # This is a temporary solution as the Digit QA pipeline doesn't run JS lint.
    # Todo: Remove this task in DROPSEC-2040.
    # See: https://citnet.tech.ec.europa.eu/CITnet/jira/browse/DROPSEC-2040.
    - task: run
      command: toolkit:lint-js
    # - task: run
    #  command: testing:check-deprecated-code
    # - task: run
    #   command: testing:check-deprecated-code-contrib

  # Lints JS files  using ESLint.
  toolkit:lint-js:
    - task: exec
      command: ${joinup.dir}/node_modules/.bin/eslint --config .eslintrc.json --ext js .

  # Fixes JS files using ESLint.
  toolkit:fix-js:
    - task: exec
      command: ${joinup.dir}/node_modules/.bin/eslint --config .eslintrc.json --ext js --fix .

  # Lints YAML files using ESLint.
  toolkit:lint-yaml:
    - task: exec
      command: ${joinup.dir}/node_modules/.bin/eslint --config .eslintrc.json --ext yml .

  # Fixes YAML files using ESLint.
  toolkit:fix-yaml:
    - task: exec
      command: ${joinup.dir}/node_modules/.bin/eslint --config .eslintrc.json --ext yml --fix .

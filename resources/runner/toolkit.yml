# Toolkit overrides.

toolkit:
  project_id: digit-joinup
  tmp_folder: ${joinup.dir}/tmp
  clone:
    dumpfile: mysql.tar
    nextcloud:
      services:
        - mysql
        - solr
        - virtuoso
  components:
    # Disable 'toolkit-components' job check for outdated packages. The Joinup
    # dependencies policy is to update all dependencies after each release.
    outdated:
      check: false

  build:
    dist:
      commands:
        # Recursively remove .git directories.
        - task: exec
          command: find ${toolkit.build.dist.root} -type d -name .git -prune -exec rm -rf {} \;
        # More cleanup.
        - task: exec
          command: rm
          arguments:
            - ${toolkit.build.dist.root}/.editorconfig
            - ${toolkit.build.dist.root}/.gitattributes
            - ${toolkit.build.dist.root}/.gitignore
            - ${toolkit.build.dist.root}/bcl-builder.config.js
            - ${toolkit.build.dist.root}/package.json
            - ${toolkit.build.dist.root}/package-lock.json
            # Drupal Finder, and consequently Drush, are still needing
            # composer.json to locate the root dir. Remove only composer.lock.
            - ${toolkit.build.dist.root}/composer.lock
        - task: remove
          file: ${toolkit.build.dist.root}/node_modules

  install:
    clone:
      commands:
        before:
          - task: run
            command: joinup:environment
          - task: exec
            command: ${drush.bin} memcache:flush-all
          - task: run
            command: drupal:settings
            arguments:
              - install
        after:
          # The `toolkit:run-deploy` command has enabled config read-only.
          - task: run
            command: config-readonly:disable
          - task: run
            command: testing:install-modules
          - task: exec
            command: ${drush.bin}
            arguments:
              - cas-mock-server:start
            options:
              yes: null
              root: ${joinup.site_dir}
          - task: exec
            command: ${drush.bin}
            arguments:
              - php:eval
              - if (node_access_needs_rebuild()) { node_access_rebuild(); }
          - task: run
            command: drupal:settings
            arguments:
              - site-clone
          - task: run
            command: config-readonly:enable
          - task: exec
            command: test ! -z "$CI" || vendor/bin/run solr:build-core-config

commands:

  # Overrides the toolkit:build-dev command.
  toolkit:build-dev:
    - task: exec
      command: mkdir ${joinup.files_public_dir} -p -m ug=rwx,o=
    - task: copy
      from: ${joinup.site_dir}/sites/default/default.services.yml
      to: ${joinup.site_dir}/sites/default/services.yml
    - task: run
      command: dev:setup-git-hook
    - task: process
      source: ${joinup.dir}/behat.yml.dist
      destination: ${joinup.dir}/behat.yml
    - task: exec
      command: mkdir ${joinup.files_private_dir} -p -m ug=rwx,o=
    - task: exec
      command: mkdir ${joinup.files_temp_dir} -p -m ug=rwx,o=

  # Overrides toolkit:install-clean.
  toolkit:install-clean:
    - task: run
      command: joinup:environment
    # Temporary fix.
    - task: run
      command: sparql:query
      arguments:
        - 'DELETE { GRAPH ?g { ?s ?p ?o . }} WHERE { GRAPH ?g { ?s ?p ?o . } FILTER (STRSTARTS(STR(?g), "no prefix"))}'
    - task: run
      command: sparql:empty
    - task: exec
      command: ${drush.bin} memcache:flush-all
    - task: run
      command: drupal:settings
      arguments:
        - install
    - task: run
      command: config-readonly:disable
    - task: run
      command: drupal:site-install
      options:
        existing-config: null
    - task: run
      command: dev:import-sparql-fixtures
    - task: run
      command: testing:install-modules
    - task: run
      command: drupal:settings
      arguments:
        - site-clean
    # Checks for extensions metadata deprecations. Note that we run this after
    # site install as we need a bootstrapped Drupal.
    # TODO: Re-enable this check when PHP is 8.2.14 or 8.2.15, in ISAICP-8337.
    # See Re-enable this check when PHP is 8.2.14 or 8.2.15.
    # See https://github.com/php/php-src/issues/8251
    # - task: exec
    #   command: ${drush.bin} joinup:check-extension-metadata-deprecation
    - task: exec
      command: ${drush.bin}
      arguments:
        - cas-mock-server:start
      options:
        yes: null
        root: ${joinup.site_dir}
    - task: exec
      command: ${drush.bin}
      arguments:
        - php:eval
        - if (node_access_needs_rebuild()) { node_access_rebuild(); }
    - task: run
      command: config-readonly:enable
    - task: exec
      command: test ! -z "$CI" || vendor/bin/run solr:build-core-config

  # Replace toolkit test commands to use GrumPHP.
  toolkit:test-phpcs:
    # Handle a potential case where the repo has been shallow cloned. Typically,
    # this happens in GitLab pipelines, where the repos are shallow cloned for
    # performance reasons. A shallow clone repository prevents us to get the
    # latest Git tag as no tags are available. But we require this info during
    # the coding standards check.
    # See \Joinup\CodingStandards\Sniffs\NamingConventions\ValidUpdateNameSniff
    - { task: exec, command: test "$(git rev-parse --is-shallow-repository)" = "false" || git fetch --unshallow }
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpcs" }
  toolkit:test-phpmd:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpmd" }
  toolkit:test-phpstan:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phpstan" }
  toolkit:lint-php:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=phplint" }
  toolkit:lint-js:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=eslint" }
  toolkit:lint-yaml:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=yamllint" }
  toolkit:lint-css:
    - { task: exec, command: "${runner.bin_dir}/grumphp run --tasks=stylelint" }

  # Extra commands to run on Gitlab after qa-code-review.
  toolkit:post-qa-code-review:
    - task: run
      command: toolkit:lint-css
    - task: run
      command: testing:lint-twig
    - task: run
      command: testing:unused-behat

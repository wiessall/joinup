# Config readonly settings and commands.

# Set this config to `false` in your runner.yml to permanently disable the
# config read-only feature on your development environment.
config_readonly: true

commands:

  # Config readonly kill-switch.
  config-readonly:enable:
    - task: exec
      command: (test "${config_readonly}" = "1" && rm -f ${joinup.files_private_dir}/file-switcher/disable-config-readonly) || true

  config-readonly:disable:
    - task: mkdir
      dir: ${joinup.files_private_dir}/file-switcher
    - task: touch
      file: ${joinup.files_private_dir}/file-switcher/disable-config-readonly

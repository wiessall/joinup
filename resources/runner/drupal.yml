# Basic Drupal settings and commands.

command:
  drupal:
    options:
      sites-subdir: default

drupal:
  root: web
  base_url: ${env.DRUPAL_BASE_URL}
  site:
    name: ${env.DRUPAL_SITE_NAME}
    mail: ${env.DRUPAL_SITE_MAIL}
    profile: ${env.DRUPAL_SITE_PROFILE}
    locale: en
    existing_config: true
    skip_permissions_setup: true
  account:
    name: ${env.DRUPAL_ACCOUNT_NAME}
    password: ${env.DRUPAL_ACCOUNT_PASSWORD}
  database:
    scheme: mysql
    host: ${env.DRUPAL_DATABASE_HOST}
    port: ${env.DRUPAL_DATABASE_PORT}
    name: ${env.DRUPAL_DATABASE_NAME}
    user: ${env.DRUPAL_DATABASE_USERNAME}
    password: ${env.DRUPAL_DATABASE_PASSWORD}
  settings:
    presets:
      install:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - OpenEuropa Newsroom Newsletter Settings
        - Custom error handler
        - Permissions
        - Null mail collector
        - EU OSS Catalogue
      site-clone:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - OpenEuropa Newsroom Newsletter Settings
        - Custom error handler
        - Permissions
        - OpenEuropa Webtools Geocoding Cache
        - GitHub Token Setup
        - Verbose error logging
        - Development mail collector
        - Memcache
        - Custom queue services
        - Monolog
        - EU OSS Catalogue
        - Stage file proxy
      site-clean:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - Custom error handler
        - Permissions
        - Development
        - OpenEuropa Newsroom Newsletter Mock
        - OpenEuropa Newsroom Newsletter Settings
        - OpenEuropa Webtools Geocoding Cache
        - GitHub Token Setup
        - Verbose error logging
        - Development mail collector
        - Memcache
        - Custom queue services
        - Monolog
        - EU OSS Catalogue
      behat:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Testing configuration alters
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - Custom error handler
        - Permissions
        - Development
        - OpenEuropa Newsroom Newsletter Mock
        - OpenEuropa Newsroom Newsletter Settings
        - OpenEuropa Webtools Geocoding Cache
        - GitHub Token Setup
        - Memcache
        - Custom queue services
        - Test mail collector
        - Monolog
        - EU OSS Catalogue
      error_page_test:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - Custom error handler
        - Permissions
        - Development
        - OpenEuropa Newsroom Newsletter Mock
        - OpenEuropa Newsroom Newsletter Settings
        - OpenEuropa Webtools Geocoding Cache
        - GitHub Feed Cache
        - Memcache
        - Pipe errors to a temporary file
        - Custom queue services
        - Test mail collector
        - Monolog
        - EU OSS Catalogue
      phpunit:
        - Main settings
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - Custom error handler
        - Permissions
        - Development
        - OpenEuropa Newsroom Newsletter Mock
        - OpenEuropa Newsroom Newsletter Settings
        - OpenEuropa Webtools Geocoding Cache
        - GitHub Feed Cache
        - Verbose error logging
        - Custom queue services
        - Test mail collector
        - EU OSS Catalogue
      prod:
        - Main settings
        - Site email
        - Databases
        - RDF/SPARQL backend
        - Configuration
        - Search API
        - OpenEuropa Newsroom Newsletter Settings
        - European Commission eTranslation
        - OpenEuropa Webtools Analytics
        - GitHub Token Setup
        - Custom error handler
        - Memcache
        - Custom queue services
        - Mail transport
        - Monolog
        - Dashboard agent
        - Varnish purge
        - Reverse proxy
        - EU OSS Catalogue
      acc-override:
        - Stage file proxy
    header: |
      <?php

      /**
       * @file
       * Drupal settings file.
       *
       * This file is automatically generated by `drupal:settings` task runner
       * command and should not be edited manually.
       *
       * The Drupal settings are documented in the `default.settings.php` file.
       *
       * @see web/sites/default/default.settings.php
       */

      /** @var string $app_root */
      /** @var string $site_path */
    footer: |
      // Load environment development override configuration, if available. Keep this
      // code block at the end of this file to take full effect.
      if (file_exists("$app_root/$site_path/settings.override.php")) {
        include "$app_root/$site_path/settings.override.php";
      }
    sections:
      Main settings: |
        if (!$hash_salt = getenv('DRUPAL_HASH_SALT')) {
          $hash_salt = \Drupal\Component\Utility\Crypt::randomBytesBase64(55);
          $env_file = "{$app_root}/../.env.pipeline";
          if (!file_exists($env_file)) {
            file_put_contents($env_file, "DRUPAL_HASH_SALT={$hash_salt}");
          }
        }
        $settings['hash_salt'] = $hash_salt;
        $settings['container_yamls'][] = "$app_root/$site_path/services.yml";
        $settings['file_scan_ignore_directories'] = [
          'node_modules',
          'bower_components',
        ];
        $settings['entity_update_batch_size'] = 50;
        $settings['entity_update_backup'] = TRUE;

        // File system settings.
        $settings['file_private_path'] = getenv('DRUPAL_PRIVATE_FILE_SYSTEM');
        $settings['file_temp_path'] = getenv('DRUPAL_FILE_TEMP_PATH');

        if ($trusted_host_patterns = getenv('DRUPAL_TRUSTED_HOST_PATTERNS')) {
          $settings['trusted_host_patterns'] = [$trusted_host_patterns];
        }

        // Expiration of cached forms is 3 hours.
        $settings['form_cache_expiration'] = 10800;

        // State cache.
        $settings['state_cache'] = TRUE;

        // Disable Piwik API calls until ISAICP-6944.
        // @see https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-6944
        $settings['joinup.parse_cached_computed_field'] = FALSE;
      Configuration: |
        $settings['config_exclude_modules'] = [
          'action',
          'admin_toolbar',
          'admin_toolbar_tools',
          'blazy_ui',
          'cas_mock_server',
          'composer_deploy',
          'config_inspector',
          'config_update',
          'config_update_ui',
          'dblog',
          'default_content',
          'devel',
          'filecache',
          'http_request_mock',
          'joinup_cas_mock_server',
          'joinup_test',
          'masquerade',
          'memcache_admin',
          'og_ui',
          'page_manager_ui',
          'slick_ui',
          'stage_file_proxy',
          'update',
          'upgrade_status',
          'views_ui',
        ];
        // Location of the site configuration files.
        $settings['config_sync_directory'] = '../config/sync';
      Testing configuration alters: |
        // Enable test_mode.
        $config['joinup_test.settings']['test_mode'] = TRUE;

        // In order to ensure that tests assert dates correctly even in edge cases, we
        // set the website default timezone to UTC and the same in tests too so that
        // even edge cases produce expected results.
        // @see \Drupal\joinup\Context\JoinupCoreContext::setDefaultTimezone()
        $config['system.date']['timezone']['default'] = 'UTC';
      Databases: |
        $databases['default']['default'] = [
          'database' => getenv('DRUPAL_DATABASE_NAME'),
          'username' => getenv('DRUPAL_DATABASE_USERNAME'),
          'password' => getenv('DRUPAL_DATABASE_PASSWORD'),
          'host' => getenv('DRUPAL_DATABASE_HOST'),
          'port' => getenv('DRUPAL_DATABASE_PORT'),
          'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
          'driver' => 'mysql',
          'init_commands' => [
            'isolation_level' => 'SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED',
          ],
        ];

      RDF/SPARQL backend: |
        $settings['sparql']['protocol'] = getenv('DRUPAL_SPARQL_PROTOCOL') ?: 'http';
        $settings['sparql']['hostname'] = getenv('DRUPAL_SPARQL_HOSTNAME');
        $settings['sparql']['port'] = (int) getenv('DRUPAL_SPARQL_PORT');
        $settings['sparql']['user_readonly'] = getenv('DRUPAL_SPARQL_USER_READONLY');
        $settings['sparql']['password_readonly'] = getenv('DRUPAL_SPARQL_PASSWORD_READONLY');
        $config['rdf_sync.settings']['endpoint']['host'] = $settings['sparql']['hostname'];
        $config['rdf_sync.settings']['endpoint']['port'] = $settings['sparql']['port'];

        // @todo Remove this connection in ISAICP-8376.
        $databases['sparql_default']['default'] = [
          'host' => $settings['sparql']['hostname'],
          'port' => $settings['sparql']['port'],
          'namespace' => 'Drupal\\joinup_sparql\\Driver\\Database\\joinup_sparql',
          'driver' => 'sparql',
        ];
      Permissions: |
        $settings['skip_permissions_hardening'] = TRUE;
      Null mail collector: |
        $config['system.mail']['interface']['default'] = 'null';
        $config['mailsystem.settings']['defaults']['sender'] = 'null';
      Development mail collector: |
        $config['system.mail']['interface']['default'] = 'php_mail';
        $config['mailsystem.settings']['defaults']['sender'] = 'php_mail';
      Test mail collector: |
        $config['system.mail']['interface']['default'] = 'test_mail_collector';
        $config['mailsystem.settings']['defaults']['sender'] = 'test_mail_collector';
      Mail transport: |
        $config['mailsystem.settings']['defaults']['sender'] = 'php_mail';
      Site email:
        $config['system.site']['mail'] = getenv('DRUPAL_SITE_MAIL');
      Search API: |
        // Adding a fallback for the scheme in case it is not properly
        // consumed by the production environment.
        $config['search_api.server.joinup']['backend_config']['connector_config']['scheme'] = getenv('SEARCH_API_SERVER_SS_SOLR_SCHEME') ?: 'http';
        $config['search_api.server.joinup']['backend_config']['connector_config']['host'] = getenv('SEARCH_API_SERVER_SS_SOLR_HOST');
        $config['search_api.server.joinup']['backend_config']['connector_config']['port'] = (int) getenv('SEARCH_API_SERVER_SS_SOLR_PORT');
        // Since Search API Solr 3.x, the Solr endpoint '/solr' (V1 API) has been
        // dropped in favour of '/'. The Solarium library automatically appends the
        // 'solr' part in Endpoint::getCoreBaseUri(). We  prevent changes of
        // environment variables of deployment servers and pipelines by hardcoding
        // the value.
        // @see search_api_solr_update_8309()
        // @see \Solarium\Core\Client\Endpoint::getCoreBaseUri()
        // @see \Joinup\TaskRunner\Commands\SolrCommands::getUrl()
        $config['search_api.server.joinup']['backend_config']['connector_config']['path'] = '/';
        $config['search_api.server.joinup']['backend_config']['connector_config']['core'] = getenv('SEARCH_API_SERVER_SS_SOLR_CORE');
      European Commission eTranslation: |
        $config['tmgmt.translator.ec_etranslation']['settings']['username'] = getenv('TMGMT_ETRANSLATION_USERNAME') ?: '';
        $config['tmgmt.translator.ec_etranslation']['settings']['password'] = getenv('TMGMT_ETRANSLATION_PASSWORD') ?: '';
      OpenEuropa Webtools Analytics: |
        $config['oe_webtools_analytics.settings']['siteID'] = getenv('OE_WEBTOOLS_ANALYTICS_SITE_ID');
        $config['oe_webtools_analytics.settings']['sitePath'] = getenv('OE_WEBTOOLS_ANALYTICS_SITE_PATH');
        $config['oe_webtools_analytics.settings']['instance'] = getenv('OE_WEBTOOLS_ANALYTICS_SITE_INSTANCE');
        $config['sparql_endpoint_piwik.settings']['base_uri'] = getenv('OE_WEBTOOLS_ANALYTICS_SITE_PATH');
        $config['sparql_endpoint_piwik.settings']['site_id'] = getenv('OE_WEBTOOLS_ANALYTICS_SITE_ID');
      Memcache: |
        if ($memcache_hosts = getenv('DRUPAL_MEMCACHE_HOSTS')) {
          $settings['cache']['default'] = 'cache.backend.memcache';
          $settings['memcache']['servers'] = array_fill_keys(explode(',', $memcache_hosts), 'default');
        }
      Custom error handler: |
        $settings['error_page']['uuid'] = TRUE;
        $settings['error_page']['template_dir'] = DRUPAL_ROOT . '/../resources/error_page';
        set_error_handler(['Drupal\error_page\ErrorPageErrorHandler', 'handleError']);
        set_exception_handler(['Drupal\error_page\ErrorPageErrorHandler', 'handleException']);
      Pipe errors to a temporary file: |
        $settings['error_page']['log']['method'] = 3;
        $settings['error_page']['log']['destination'] = 'php://temp';
      OpenEuropa Newsroom Newsletter Mock: |
        $config['oe_newsroom_newsletter.subscriber']['class'] = 'Drupal\oe_newsroom_newsletter\NewsletterSubscriber\MockNewsletterSubscriber';
      OpenEuropa Newsroom Newsletter Settings: |
        $settings['oe_newsroom_universe_keys'] = getenv('OE_NEWSROOM_UNIVERSE_KEYS');
      OpenEuropa Webtools Geocoding Cache: |
        $settings['cache']['bins']['geocoder'] = 'cache.backend.file_system';
        $settings['filecache']['directory']['bins']['geocoder'] = '../tests/fixtures/geocoding/cache';
        $settings['filecache']['strategy']['bins']['geocoder'] = 'persist';
      GitHub Token Setup: |
        $config['github_feed.settings']['token'] = getenv('JOINUP_GITHUB_TOKEN') ?: '';
      Development: |
        $settings['extension_discovery_scan_tests'] = TRUE;
      Verbose error logging: |
        $config['system.logging']['error_level'] = 'verbose';
      Monolog: |
        $settings['container_yamls'][] = 'modules/custom/joinup_core/joinup_core.monolog.services.yml';
      Custom queue services: |
        $settings['queue_service_joinup_group:group_update'] = 'joinup_group.group_aware_queue';
        $settings['queue_service_joinup_group:group_content_update'] = 'joinup_group.group_aware_queue';
      Dashboard agent: |
        $settings["oe_dashboard_agent.token"] = getenv('DASHBOARD_TOKEN');
        $settings["oe_dashboard_agent.allowed_ips"] = explode(',', getenv('DASHBOARD_ALLOWED_IPS'));
      Varnish purge: |
        if (!empty(getenv('DRUPAL_VARNISH_HOSTS'))) {
          $config['system.performance']['cache']['page']['max_age'] = 2764800;
          $config['dropsolid_purge.config']['site_name'] = getenv('DRUPAL_SITE_NAME');
          $config['dropsolid_purge.config']['site_environment'] = getenv('DRUPAL_ENVIRONMENT');
          $config['dropsolid_purge.config']['site_group'] = getenv('DRUPAL_VARNISH_GROUP');
          $load_balancers = [];
          $drupal_flush_cred = getenv('DRUPAL_FLUSH_CREDS');
          foreach (explode(',', getenv('DRUPAL_VARNISH_HOSTS')) as $ip) {
            $load_balancers[$ip] = [
              'ip' => $drupal_flush_cred . '@' . trim($ip),
              'protocol' => 'http',
              'port' => '7790',
            ];
          }
          $config['dropsolid_purge.config']['loadbalancers'] = $load_balancers;
        }
      Reverse proxy: |
        $settings['reverse_proxy'] = (bool) getenv('DRUPAL_REVERSE_PROXY_ENABLE');
        $settings['reverse_proxy_addresses'] = array_filter(explode(',', (string) getenv('DRUPAL_REVERSE_PROXY_ADDRESSES')));
      EU OSS Catalogue: |
        $settings['eu_oss_catalogue']['platform_github']['access_token'] = getenv('JOINUP_GITHUB_TOKEN');
      Stage file proxy: |
        $config['stage_file_proxy.settings']['hotlink'] = TRUE;
        $config['stage_file_proxy.settings']['origin'] = 'https://interoperable-europe.ec.europa.eu';
        $config['stage_file_proxy.settings']['verify'] = FALSE;
        $config['stage_file_proxy.settings']['origin_dir'] = 'sites/default/files';

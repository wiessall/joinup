# Testing configs and commands.

testing:
  modules:
    - cas_mock_server
    - composer_deploy
    - dblog
    - filecache
    - joinup_cas_mock_server
    - joinup_test
    - upgrade_status

behat:
  screenshots:
    local:
      dir: ${env.ARTIFACTS_DIR}
  # Either 'firefox' or 'chrome'.
  browser_name: chrome
  formatter:
    name: progress

phpcs:
  file:
    bin: ${joinup.dir}/vendor/bin/phpcs
    config: ${joinup.dir}/phpcs.xml
    standard: ${joinup.dir}/phpcs-ruleset.xml.dist
    global: ${joinup.dir}/vendor/squizlabs/php_codesniffer/CodeSniffer.conf
    phpcbf:
      bin: ${joinup.dir}/vendor/bin/phpcbf
  check:
    extensions:
      - css
      - inc
      - info
      - install
      - js
      - module
      - php
      - profile
      - test
      - theme
    files:
      - ${joinup.dir}/tests/src
      - ${joinup.dir}/src
      - ${joinup.site_dir}/modules
      - ${joinup.site_dir}/profiles
      - ${joinup.site_dir}/themes
  ignore:
    - ${joinup.site_dir}/modules/contrib
    - ${joinup.site_dir}/themes/contrib
    - ${joinup.site_dir}/themes/joinup/scss
    - ${joinup.site_dir}/themes/joinup/node_modules
    - ${joinup.site_dir}/themes/ventuno/css
    - ${joinup.site_dir}/themes/ventuno/node_modules
    - ${joinup.site_dir}/modules/custom/joinup_communities/tallinn/lib
  report: full
  options:
    # Show the progress of the run.
    - p
  arguments:
    # The number of files to check in parallel. A good initial value is the
    # number of available processor cores. If the system has fast storage then
    # this can be increased further.
    parallel: 1
  # Set this config to `true` in your `runner.yml` in order to enable running
  # PHP coding standards on Git push. Due to the complexity of the docker
  # environment, having git run from the host but having the scripts that need
  # to be run from the container, it is very hard to catch all cases. For this
  # reason, this is disabled by default.
  run_on_push: false

commands:

  # Adds a Git hook that enforces coding standards check on push.
  testing:phpcs-git-hook:
    - task: remove
      file: ${joinup.dir}/.git/hooks/pre-push
    - task: exec
      command: (test "${phpcs.run_on_push}" = "1" && ln -s ../../scripts/git/pre_push ${joinup.dir}/.git/hooks/pre-push) || true

  # Scans the code base for deprecated code.
  testing:check-deprecated-code:
    - task: exec
      command: ${phpstan.bin} --memory-limit=1G --debug -vvv --no-progress analyse src tests/src web/modules/custom web/profiles web/themes/ventuno web/themes/joinup

  testing:check-deprecated-code-contrib:
    - task: exec
      # Mute the returning error code as is used only for reporting.
      command: ${phpstan.bin} --memory-limit=2G --no-progress analyse web/modules/contrib web/themes/contrib || true

  testing:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${testing.modules}

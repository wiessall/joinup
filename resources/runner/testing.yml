# Testing configs and commands.

testing:
  modules:
    - cas_mock_server
    - composer_deploy
    - dblog
    - filecache
    - http_request_mock
    - joinup_cas_mock_server
    - joinup_test
    # TODO: Re-enable this check when PHP is 8.2.14 or 8.2.15, in ISAICP-8337.
    # See https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-8337
    # See https://github.com/php/php-src/issues/8251
    # - upgrade_status

behat:
  screenshots:
    local:
      dir: ${joinup.site_dir}/sites/simpletest/behat
  # Either 'firefox' or 'chrome'.
  browser_name: chrome
  formatter:
    name: progress
  selenium:
    webdriver_url: ${env.WEBDRIVER_URL}

commands:
  testing:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${testing.modules}

  # Checks for any unused step definitions, see profile in behat.yml.dist.
  testing:unused-behat:
    - task: exec
      command: |
        tmp_file=$(mktemp)
        ${joinup.dir}/vendor/bin/behat --profile=unused --dry-run | tee $tmp_file
        if grep -q "unused step definition" $tmp_file; then exit 1; fi

  # Lints features files using Gherkin Rules.
  testing:lint-features:
    - task: exec
      command: npm run lint:gherkin

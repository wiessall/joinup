# Testing configs and commands.

testing:
  modules:
    - cas_mock_server
    - composer_deploy
    - dblog
    - filecache
    - http_request_mock
    - joinup_cas_mock_server
    - joinup_test
    # TODO: Re-enable this check when PHP is 8.2.14 or 8.2.15, in ISAICP-8337.
    # See https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-8337
    # See https://github.com/php/php-src/issues/8251
    # - upgrade_status

behat:
  screenshots:
    local:
      dir: ${joinup.site_dir}/sites/simpletest/behat
  # Either 'firefox' or 'chrome'.
  browser_name: chrome
  formatter:
    name: progress
  selenium:
    webdriver_url: ${env.WEBDRIVER_URL}

git_hook:
  # In `runner.yml`, specify pre-push/pre-commit or false to disable entirely.
  run_on: pre-push

commands:

  # Setup Git hook enforcing coding standards check on push/commit.
  testing:setup-git-hook:
    - task: remove
      file: ${joinup.dir}/.git/hooks/pre-push
    - task: exec
      command: |
        # Reset state.
        rm -f "${joinup.dir}/.git/hooks/pre-push"
        ${runner.bin_dir}/grumphp git:deinit --quiet || true
        # Activate.
        if [ "${git_hook.run_on}" = "pre-push" ]; then
          ln -s ../../scripts/git/pre_push "${joinup.dir}/.git/hooks/pre-push"
          echo "Static code analysis active on git pre-push hook."
        elif [ "${git_hook.run_on}" = "pre-commit" ]; then
          ${runner.bin_dir}/grumphp git:init
          echo "Static code analysis active on git pre-commit hook."
        else
          echo "Static code analysis is disabled. Specify git_hook.run_on: pre-push/pre-commit to enable."
        fi

  testing:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${testing.modules}

  # Lints Twig files using Twig Coding Standard Rules.
  testing:lint-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint

  # Fixes Twig files using Twig Coding Standard Rules.
  testing:fix-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint --fix

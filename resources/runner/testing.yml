# Testing configs and commands.

testing:
  modules:
    - cas_mock_server
    - composer_deploy
    - dblog
    - filecache
    - http_request_mock
    - joinup_cas_mock_server
    - joinup_test
    # TODO: Re-enable this check when PHP is 8.2.14 or 8.2.15, in ISAICP-8337.
    # See https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-8337
    # See https://github.com/php/php-src/issues/8251
    # - upgrade_status

behat:
  screenshots:
    local:
      dir: ${joinup.site_dir}/sites/simpletest/behat
  # Either 'firefox' or 'chrome'.
  browser_name: chrome
  formatter:
    name: progress
  selenium:
    webdriver_url: ${env.WEBDRIVER_URL}

commands:
  testing:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${testing.modules}

  # Lints Twig files using Twig Coding Standard Rules.
  testing:lint-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint

  # Fixes Twig files using Twig Coding Standard Rules.
  testing:fix-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint --fix

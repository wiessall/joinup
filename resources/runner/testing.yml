# Testing configs and commands.

testing:
  modules:
    - cas_mock_server
    - composer_deploy
    - dblog
    - filecache
    - http_request_mock
    - joinup_cas_mock_server
    - joinup_test
    # TODO: Re-enable this check when PHP is 8.2.14 or 8.2.15, in ISAICP-8337.
    # See https://citnet.tech.ec.europa.eu/CITnet/jira/browse/ISAICP-8337
    # See https://github.com/php/php-src/issues/8251
    # - upgrade_status

behat:
  screenshots:
    local:
      dir: ${joinup.site_dir}/sites/simpletest/behat
  # Either 'firefox' or 'chrome'.
  browser_name: chrome
  formatter:
    name: progress
  selenium:
    webdriver_url: ${env.WEBDRIVER_URL}

phpcs:
  file:
    bin: ${joinup.dir}/vendor/bin/phpcs
    config: ${joinup.dir}/phpcs.xml
    standard: ${joinup.dir}/phpcs-ruleset.xml.dist
    global: ${joinup.dir}/vendor/squizlabs/php_codesniffer/CodeSniffer.conf
    phpcbf:
      bin: ${joinup.dir}/vendor/bin/phpcbf
  check:
    extensions:
      - inc
      - install
      - module
      - php
      - profile
      - theme
    files:
      - ${joinup.dir}/tests/src
      - ${joinup.dir}/src
      - ${joinup.site_dir}/modules/custom
      - ${joinup.site_dir}/profiles/joinup
      - ${joinup.site_dir}/themes/iop
      - ${joinup.site_dir}/themes/ventuno
  ignore:
    - '*/iop/assets/*'
    - '*/iop/node_modules/*'
    - '*/ventuno/assets/*'
    - '*/ventuno/node_modules/*'
  report: full
  options:
    # Show the progress of the run.
    - p
  arguments:
    # The number of files to check in parallel. A good initial value is the
    # number of available processor cores. If the system has fast storage then
    # this can be increased further.
    parallel: 1
  # Set this config to `false` in your `runner.yml` in order to disable running
  # PHP coding standards on Git push.
  run_on_push: true

commands:

  # Adds a Git hook that enforces coding standards check on push.
  testing:phpcs-git-hook:
    - task: remove
      file: ${joinup.dir}/.git/hooks/pre-push
    - task: exec
      command: (test "${phpcs.run_on_push}" = "1" && ln -s ../../scripts/git/pre_push ${joinup.dir}/.git/hooks/pre-push) || true

  testing:install-modules:
    - task: run
      command: drush:module-install
      arguments: ${testing.modules}

  # Lints Twig files using Twig Coding Standard Rules.
  testing:lint-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint

  # Fixes Twig files using Twig Coding Standard Rules.
  testing:fix-twig:
    - task: exec
      command: ${joinup.dir}/vendor/bin/twig-cs-fixer lint --fix

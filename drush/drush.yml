# The Drush configuration file
#
# Docs at https://github.com/drush-ops/drush/blob/master/examples/example.drush.yml

options:
  uri: ${env.DRUPAL_BASE_URL}
  verbose: ${env.DRUSH_VERBOSE}

command:
  sql:
    sanitize:
      options:
        # User's first/last names are sanitized separately in JoinupDataSanitizationCommands.
        allowlist-fields: 'field_user_first_name,field_user_family_name'
